<title>Escape from Ace-catraz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: green title bar, pale blue-grey board, white rounded panels, chunky 3D buttons, cartoon inmates. Light look by choice. */
:root {
  --bg: #eef1f6; --panel: #ffffff; --panel2: #f3f6fa; --line: #d5dbe4; --line2: #e4e9f0;
  --ink: #1b2a36; --muted: #5b6b7a; --green: #1f6b50; --green-d: #15503b; --tint: #eaf3ee; --glow: #19b57a;
  --red: #e0323f; --red-d: #b3222d; --amber: #f2a516; --amber-bg: #fff1cf; --amber-ink: #8a5a00;
  --plan: #aef2d4; --plan-ink: #064a36; --patrol: #ffc9c9; --patrol-ink: #7a0f0f;
  --card: #fbfaf5; --cardred: #c8283c; --cardblack: #1b1f24; --back1: #1f3a8a; --back2: #dbe4ff;
  --f: 'Figtree', 'Nunito', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 500 15px/1.4 var(--f); padding-inline: 16px; padding-block: 12px 40px; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.rd { color: var(--cardred); }

/* Title bar */
.bar { margin: -12px -16px 14px; padding: 10px 16px; background: var(--green); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar h1 { font-size: 22px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag { display: inline-block; background: var(--red); color: #fff; font-style: italic; font-weight: 900; padding: 2px 10px; border-radius: 6px; transform: rotate(-2deg); box-shadow: 0 2px 0 var(--red-d); text-transform: uppercase; }
.sub { max-width: 1100px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-weight: 700; font-size: 13px; padding: 5px 12px; border: 2px solid var(--line); border-radius: 999px; background: var(--panel); white-space: nowrap; color: var(--muted); }
.chip b { color: var(--green); font-weight: 800; }
.chip.alarm { border-color: var(--red); color: var(--red); background: #fff1f2; }
.chip.alarm b { color: var(--red); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 600; }
.check input { margin-top: 3px; accent-color: var(--green); width: 16px; height: 16px; }
.sub .check { color: var(--muted); font-size: 13px; align-items: center; }

.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.main { display: grid; gap: 14px; min-width: 0; }
@media (max-width: 960px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

/* Buttons: chunky, with a thick bottom edge */
.btn { border: 2px solid var(--line); border-bottom-width: 4px; background: var(--panel); padding: 8px 16px; border-radius: 12px; font-weight: 800; transition: transform .08s; }
.btn:hover:not(:disabled) { border-color: var(--green); }
.btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--green); color: #fff; border-color: var(--green-d); }
.btn.primary:hover:not(:disabled) { background: #257a5c; }
.btn.sm { padding: 5px 12px; font-size: 13px; border-radius: 10px; }
.bar .btn { color: var(--green-d); }

section.panel { background: var(--panel); border: 1px solid var(--line2); border-radius: 18px; padding: 14px 16px; min-width: 0; box-shadow: 0 1px 2px rgba(20, 40, 60, .06); }
.panel > h2 { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel > h2 small { font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 600; }

/* Escape plan */
.obs { flex: 0 0 auto; width: 132px; display: grid; gap: 6px; justify-items: center; }
.sec { width: 132px; height: 164px; border-radius: 14px; border: 3px solid #000; overflow: hidden; position: relative; }
.sec.up { background: var(--plan); color: var(--plan-ink); text-align: center; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
.sec .pill { font-weight: 900; font-size: 9px; letter-spacing: .1em; padding: 3px 8px; border-radius: 999px; background: #065f46; color: #d1fae5; }
.sec .nm { font-weight: 900; font-size: 24px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
.sec .match { background: #fff; border: 1.5px solid #065f46; border-radius: 6px; padding: 4px 4px 5px; font-weight: 800; font-size: 11px; line-height: 1.2; width: 100%; }
.sec .match i { display: block; font-style: normal; font-size: 8px; letter-spacing: .1em; color: #065f46; }
.sec .lvl { font-weight: 800; font-size: 9px; letter-spacing: .08em; border: 1px solid #065f46; border-radius: 999px; padding: 1px 8px; background: #6ee7b7; }
.sec.down { background: linear-gradient(#17261f, #0f3a2c); color: #6ee7b7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.sec.down small { font-weight: 800; font-size: 9px; letter-spacing: .12em; opacity: .85; }
.sec.down b { font-weight: 900; font-size: 24px; letter-spacing: .02em; }
.sec.down.medium { color: #f4c470; } .sec.down.hard { color: #ff8f8f; }
.obs.active .sec { box-shadow: 0 0 0 4px var(--glow), 0 6px 18px rgba(25, 181, 122, .35); }
.obs.done .sec { height: 56px; opacity: .6; background: var(--panel2); color: var(--muted); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; border-color: var(--line); }
.obs .tagline { font-weight: 800; font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.obs.active .tagline { color: var(--green); }
.corners { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 60px; }
.corner { display: grid; gap: 3px; justify-items: center; font-weight: 700; font-size: 11px; color: var(--muted); }
.corner .who { display: flex; align-items: center; gap: 4px; }
.corner.empty .pc { opacity: .35; background: transparent; border: 2px dashed var(--line); }
.corner.empty .pc::after { display: none; }

/* Cards */
.pc { width: 52px; height: 74px; border-radius: 8px; border: 1.5px solid #0004; background: var(--card); position: relative; padding: 0; color: var(--cardblack); flex: 0 0 auto; user-select: none; box-shadow: 0 2px 0 rgba(20, 40, 60, .18); }
.pc.red { color: var(--cardred); }
.pc .r { position: absolute; left: 5px; top: 3px; font-weight: 900; font-size: 15px; line-height: 1; }
.pc .s { position: absolute; left: 5px; top: 18px; font-size: 13px; line-height: 1; }
.pc .big { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; padding-top: 14px; }
.pc.back { background: repeating-linear-gradient(45deg, var(--back1) 0 5px, #2a4aa8 5px 7px); border: 3px solid var(--back2); }
.pc.back::after { content: ''; position: absolute; inset: 8px; border: 1.5px solid var(--back2); border-radius: 4px; opacity: .6; }
.pc.mini { width: 36px; height: 52px; border-radius: 6px; }
.pc.mini .r { font-size: 11px; left: 3px; top: 2px; } .pc.mini .s { font-size: 9px; left: 3px; top: 13px; } .pc.mini .big { font-size: 20px; padding-top: 10px; }
.pc.pick { cursor: pointer; box-shadow: 0 0 0 3px var(--glow); transform: translateY(-3px); transition: transform .12s; }
.pc.pick:hover { transform: translateY(-7px); }
.pc.sel { box-shadow: 0 0 0 3px var(--amber); transform: translateY(-8px); }
.pc.match { outline: 3px solid var(--glow); outline-offset: 2px; }
.pc.flash { animation: flash 1.2s ease 2; }
@keyframes flash { 50% { box-shadow: 0 0 0 4px var(--amber), 0 0 18px var(--amber); } }
@media (prefers-reduced-motion: reduce) { .pc.flash { animation: none; box-shadow: 0 0 0 3px var(--amber); } .pc.pick, .btn { transition: none; } }
.hand { display: flex; gap: 10px; flex-wrap: wrap; }
.slot { display: grid; gap: 5px; justify-items: center; }
.known { font-weight: 800; font-size: 11px; min-height: 18px; padding: 1px 8px; border-radius: 999px; background: var(--panel2); color: var(--muted); white-space: nowrap; border: 1px solid var(--line2); }
.known.has { color: var(--amber-ink); background: var(--amber-bg); border-color: #f3d58e; }
.known.exact { color: var(--green-d); background: var(--tint); border-color: #b8dccb; }

/* Table */
.table { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-start; }
.pile { display: grid; gap: 5px; justify-items: center; font-weight: 700; font-size: 12px; color: var(--muted); text-align: center; max-width: 120px; }
.pile .stack { width: 62px; height: 86px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; font-size: 22px; color: #fff; box-shadow: 0 3px 0 rgba(20, 40, 60, .2); }
.pile .stack.flash { background: repeating-linear-gradient(45deg, var(--back1) 0 5px, #2a4aa8 5px 7px); border: 3px solid var(--back2); }
.pile .stack.patrol { width: 96px; background: #2a1010; border: 3px solid #000; color: #ff8f8f; font-weight: 800; font-size: 10px; line-height: 1.3; letter-spacing: .08em; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.pile .stack.patrol b { font-weight: 900; font-size: 16px; line-height: 1.05; letter-spacing: .02em; padding: 0 4px; }
.pile .stack.patrol.med { color: #f4c470; background: #2a2210; }
.pile .stack.patrol.relaxed { color: #7ff0c2; background: #10281f; }
.pile .stack.alarm { background: radial-gradient(#e85a5a, #8a1d1d); border: 3px solid #000; font-size: 12px; letter-spacing: .06em; line-height: 1.2; }
.pile .stack.empty { background: transparent; border: 2px dashed var(--line); color: var(--line); box-shadow: none; }
.guardbox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-width: 0; }
.pat { width: 132px; height: 92px; border-radius: 12px; border: 3px solid #000; background: var(--patrol); color: var(--patrol-ink); text-align: center; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
.pat .pill { font-weight: 900; font-size: 9px; letter-spacing: .1em; padding: 2px 8px; border-radius: 999px; background: #991b1b; color: #fee2e2; }
.pat .nm { font-weight: 900; font-size: 20px; line-height: 1; text-transform: uppercase; }
.pat .dn { font-weight: 800; font-size: 9px; letter-spacing: .04em; background: #fff; border: 1.5px solid #991b1b; border-radius: 5px; padding: 2px 4px; width: 100%; }
.verdict { font-weight: 900; font-size: 22px; letter-spacing: .05em; text-transform: uppercase; }
.verdict.pass { color: var(--green); } .verdict.fail { color: var(--red); }
.banner { flex: 1 1 260px; min-width: 0; border: 2px dashed var(--line); border-radius: 14px; padding: 10px 14px; font-size: 14px; align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 4px; background: var(--panel2); }
.banner b { font-weight: 800; font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.reveal { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }

/* Players */
.seats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.seat { background: var(--panel2); border: 2px solid var(--line2); border-radius: 16px; padding: 10px 14px 12px; min-width: 0; }
.seat.turn { border-color: var(--green); background: var(--tint); box-shadow: 0 0 0 3px rgba(31, 107, 80, .15); }
.seat h3 { font-size: 18px; font-weight: 800; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.seat h3 .st { font-weight: 800; font-size: 10px; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; border: 2px solid var(--line); color: var(--muted); background: var(--panel); }
.seat h3 .st.on { color: #fff; background: var(--green); border-color: var(--green-d); }
.seat .hand { gap: 7px; }
.seat .pc { width: 48px; height: 68px; } .seat .pc .big { font-size: 26px; padding-top: 12px; }
.me .pc { width: 58px; height: 82px; }
.av { border-radius: 50%; flex: 0 0 auto; box-shadow: 0 2px 0 rgba(20, 40, 60, .2); }

/* Actions */
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.actions .btn { display: grid; gap: 1px; text-align: left; min-width: 122px; }
.actions .btn small { font-weight: 600; font-size: 11px; opacity: .7; }
.prompt { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--tint); border-left: 5px solid var(--green); font-weight: 700; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.prompt.wait { border-left-color: var(--line); background: var(--panel2); color: var(--muted); font-weight: 600; }
.hintbtns { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tray and log */
.tray { display: flex; gap: 14px; flex-wrap: wrap; padding: 4px 0 2px; }
.tray .group { display: grid; gap: 6px; }
.tray .group > b { font-weight: 800; font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.tray .cards { display: flex; gap: 5px; flex-wrap: wrap; }
.tray .none { font-weight: 600; font-size: 13px; color: var(--muted); }
.pat.mini { width: 92px; height: 66px; padding: 3px; border-width: 2px; border-radius: 8px; } .pat.mini .nm { font-size: 14px; } .pat.mini .pill, .pat.mini .dn { display: none; }
.pat.pick { cursor: pointer; box-shadow: 0 0 0 3px var(--glow); }
.log { max-height: 560px; overflow-y: auto; display: grid; gap: 6px; font-size: 13px; }
.log div { padding-left: 10px; border-left: 3px solid var(--line2); color: var(--muted); font-weight: 600; }
.log div.me { border-left-color: var(--green); color: var(--ink); }
.log div.sys { border-left-color: var(--amber); }
aside { position: sticky; top: 12px; min-width: 0; }
@media (max-width: 960px) { aside { position: static; } .log { max-height: 260px; } }

/* Overlays and dialogs */
.overlay { position: fixed; inset: 0; background: rgba(20, 40, 60, .55); display: grid; place-items: start center; padding: 24px 16px; z-index: 10; overflow-y: auto; }
.dialog { background: var(--bg); border-radius: 20px; padding: 14px; max-width: 520px; width: 100%; display: grid; gap: 12px; margin-block: auto; }
.dialog .box { background: var(--panel); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; box-shadow: 0 1px 2px rgba(20, 40, 60, .06); }
.dialog p { margin: 0; color: var(--muted); font-weight: 600; }
.hero { background: var(--green); color: #fff; border-radius: 20px; padding: 22px 18px 18px; text-align: center; display: grid; gap: 12px; justify-items: center; box-shadow: 0 5px 0 var(--green-d); }
.hero h2 { font-size: 36px; font-weight: 900; line-height: 1.05; text-transform: uppercase; display: grid; gap: 6px; justify-items: center; }
.hero .tag { font-size: 38px; padding: 0 14px; transform: rotate(-3deg); box-shadow: 0 4px 0 var(--red-d); }
.hero p { color: #fff; font-weight: 700; }
.fan { display: flex; justify-content: center; height: 100px; padding-top: 6px; }
.fan .fc { margin-inline: -9px; transform-origin: 50% 120%; }
.fan .pc { width: 56px; height: 80px; cursor: default; }
.fan .pc .r { font-size: 16px; } .fan .pc .big { font-size: 30px; padding-top: 14px; }
.crew { display: flex; gap: 8px; justify-content: center; }
.field > b { font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 8px; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1 1 0; min-width: 64px; padding: 10px; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--panel); border-radius: 12px; font-weight: 800; }
.seg button[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green-d); }
.note { font-weight: 600; font-size: 13px; color: var(--muted); }
.win h2 { color: var(--green); font-size: 34px; font-weight: 900; text-transform: uppercase; }
.lose h2 { color: var(--red); font-size: 34px; font-weight: 900; text-transform: uppercase; }
.notice .box { text-align: center; justify-items: center; }
.notice .who { display: flex; align-items: center; gap: 12px; justify-content: center; flex-wrap: wrap; }
.notice h2 { font-size: 28px; font-weight: 900; text-transform: uppercase; }
.notice h2 span { color: var(--green); }
.xlwrap { padding: 6px 0; }
.pc.xl { width: 120px; height: 168px; border-radius: 12px; border-width: 2px; cursor: default; }
.pc.xl .r { font-size: 32px; left: 10px; top: 8px; } .pc.xl .s { font-size: 26px; left: 10px; top: 42px; } .pc.xl .big { font-size: 64px; padding-top: 30px; }
.barbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.dialog.help { max-width: 640px; }
.dialog.help h2 { font-size: 30px; }
.dialog.help h3 { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.dialog.help .box { gap: 8px; line-height: 1.45; }
.dialog.help ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink); font-weight: 500; }
.dialog.help .box p { color: var(--ink); font-weight: 500; }
.dialog.help .hero p { color: #fff; }
.dialog.help .hero { padding-block: 16px; }

.demo { display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; background: var(--amber); color: #3d2a00; border-radius: 999px; padding: 3px 10px; box-shadow: 0 2px 0 #b97a00; font-style: normal; transform: none; }
.bar h1 .demo { align-self: center; }
.demobadge { display: inline-block; justify-self: center; background: var(--amber); color: #3d2a00 !important; font-weight: 800 !important; font-size: 12px; letter-spacing: .06em; border-radius: 999px; padding: 4px 14px; box-shadow: 0 2px 0 #b97a00; }
footer.site { max-width: 1100px; margin: 22px auto 8px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
footer.site a { color: var(--green); font-weight: 800; }
.hero p.demobadge { width: fit-content; max-width: 100%; border-radius: 14px; text-align: center; }

.known.not { color: var(--amber-ink); background: var(--amber-bg); border-color: #f2d28a; }

.turnlist { margin: 0; padding-left: 20px; display: grid; gap: 5px; text-align: left; font-weight: 600; color: var(--ink); width: 100%; }
.sum .box { justify-items: stretch; text-align: left; }
.sum .who, .sum .xlwrap { justify-self: center; text-align: center; }
.sum .xlwrap { display: grid; gap: 6px; justify-items: center; }
.sum h2 { font-size: 24px; }
.check.sub2 { margin-left: 24px; }
.check.dim { opacity: .55; }
.dialog .dh { font-size: 24px; font-weight: 900; }
.dialog .log { max-height: 50vh; }

/* yard: decks on the outside, discards in the middle */
.table { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px 18px; }
.cluster { display: flex; gap: 18px; align-items: flex-start; }
.pile { max-width: 130px; }
.pile .pt { font-weight: 800; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.pilebtn { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 12px; }
.pilebtn:hover { outline: 3px solid var(--glow); outline-offset: 3px; }
.pat.mini.tall { width: 96px; height: 86px; }
.pat.mini.tall .nm { font-size: 15px; padding: 0 3px; }
.pat.mini.tall .dn { display: block; font-size: 8px; }
.pc.pilec { width: 62px; height: 86px; border-radius: 9px; cursor: pointer; }
.pc.pilec .r { font-size: 17px; left: 6px; top: 4px; } .pc.pilec .s { font-size: 14px; left: 6px; top: 22px; } .pc.pilec .big { font-size: 30px; padding-top: 20px; }
.pile .stack.empty { width: 62px; font-size: 11px; }
.mid { flex: 1 1 200px; min-width: 180px; align-self: stretch; border: 2px dashed var(--line); border-radius: 14px; padding: 10px 14px; display: grid; gap: 4px; align-content: center; justify-items: center; text-align: center; }
.mid .lab { font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mid .vtxt { font-size: 13px; font-weight: 600; color: var(--ink); } .mid .vtxt.sm { color: var(--muted); font-size: 12px; }
.actionsPanel { padding-top: 2px; padding-bottom: 14px; }
.actionsPanel .prompt, .actionsPanel .actions { margin-top: 12px; }
.seats.crewgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.seat.me { background: #fff; border-color: var(--green); border-width: 2px; border-left-width: 9px; }
.seat.me.turn { background: var(--tint); }

/* Escape plan v2 */
.focusrow { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; justify-content: center; padding: 4px 0 8px; }
.cgrid { display: grid; grid-template-columns: 104px 132px 104px; grid-template-rows: 96px 96px; gap: 6px 8px; align-items: stretch; }
.cgrid .ccenter { grid-column: 2; grid-row: 1 / span 2; display: flex; justify-content: center; }

}

function decideHint(G, p) {
  let opts = hintOptions(G, p);
  if (CFG.convention) {
    // Pointing at a card that fits the active obstacle keeps silence meaningful. It is a tie-breaker: a hint that
    // actually lets a teammate plant or prepare outranks it.
    const u = usefulSlots(G, p);
    if (u.size) opts = opts.map((o) => Object.assign({}, o, { score: o.score + (u.has(o.to + ':' + o.hand) ? CFG.conventionBonus : 0) })).sort((a, b) => b.score - a.score);
  }
  if (opts.length) { const o = opts[0]; return { type: 'hint', to: o.to, hand: o.hand, dim: o.dim }; }
  // Forced to hint something: give any new fact, otherwise repeat one.
  for (const T of G.players) {
    if (T.idx === p) continue;
    for (let k = 0; k < T.hand.length; k++) {
      for (const dim of ['rank', 'suit']) if (T.hand[k].known[dim] == null) return { type: 'hint', to: T.idx, hand: k, dim };
    }
  }
  const T = G.players.find((q) => q.idx !== p && q.hand.length);
  return { type: 'hint', to: T.idx, hand: 0, dim: 'rank' };
}

// Judgement call: instead of fixed rules, imagine plausible versions of the hidden cards, play each candidate move
// forward with the ordinary crew policy, and pick the move that wins most often.
let inRollout = false;
function rollout(W, act) {
  if (!A.apply(W, act).ok) return null;
  let steps = 0;
  while (!W.result && steps++ < 400) { if (!A.apply(W, decide(W)).ok) break; }
  return W.result && W.result.won ? 1 : 0.3 * (Math.min(W.cur, W.obstacles.length) / W.obstacles.length);
}
function mcChoose(G, p, cands) {
  if (!CFG.mc || inRollout || cands.length < 2) return null;
  const tot = cands.map(() => 0);
  let got = 0;
  inRollout = true;
  try {
    for (let k = 0; k < CFG.mcSamples; k++) {
      const W0 = A.sampleWorld(G, p, (G.seed * 7919 + G.turnCount * 104729 + k * 15485863) >>> 0);
      if (!W0) continue;
      const vals = cands.map((cd) => rollout(A.cloneWorld(W0), cd.act));
      if (vals.some((v) => v == null)) continue;
      vals.forEach((v, i) => { tot[i] += v; });
      got++;
    }
  } finally { inRollout = false; }
  if (got < Math.ceil(CFG.mcSamples / 2)) return null;
  let bi = 0;
  tot.forEach((t, i) => { if (t > tot[bi] + 1e-9) bi = i; });
  return cands[bi].act;
}

function decideAction(G, p) {
  const me = G.players[p], O = A.active(G), L = A.legal(G), test = O.sec.test, N = G.obstacles[G.cur + 1];
  const myRec = A.plantedBy(O, p);

  // 1. Remove any planted card we know will fail.
  for (const rec of O.planted) {
    const cs = A.plantedCandidates(G, p, rec);
    if (cs.length && cs.every((c) => !test(c)) && L.distract.ok) return { type: 'distract', player: rec.player };
  }

  const cands = A.handCandidates(G, p);
  const P = cands.map((cs) => frac(cs, test));
  const futureVal = (i) => (N ? frac(cands[i], N.sec.test) : 0);

  // 2. Plant.
  if (!myRec && L.plant.ok) {
    const best = argmax(me.hand, (s, i) => P[i] * 10 - futureVal(i));
    if (P[best] === 1) return { type: 'plant', hand: best };
    if (CFG.mc && !inRollout) {
      const cs = [{ act: { type: 'plant', hand: best } }];
      const dump = argmax(me.hand, (s, i) => -futureVal(i) * 3 - P[i] * 0.2 - (A.isExact(s.known) ? 5 : 0));
      if (dump !== best) cs.push({ act: { type: 'plant', hand: dump } });
      if (L.guard.ok) cs.push({ act: { type: 'guard' } });
      if (L.riot.ok && G.deck.length >= 6) cs.push({ act: { type: 'riot' } });
      if (L.pass.ok) cs.push({ act: { type: 'pass' } });
      const pick = mcChoose(G, p, cs);
      if (pick) return pick;
    }
    if (P[best] >= CFG.gamble && (!CFG.needVerifier || verifierExists(G, p))) return { type: 'plant', hand: best };
    if (!L.guard.ok && P[best] > 0) return { type: 'plant', hand: best };
    if (CFG.cycleOnExcluded && G.deck.length >= (typeof CFG.cycleExcludedMinDeck === 'object' ? CFG.cycleExcludedMinDeck[G.n] : CFG.cycleExcludedMinDeck) && P.every((x) => x === 0)) {
      const dump = argmax(me.hand, (s, i) => -futureVal(i) * 3 - (A.isExact(s.known) ? 5 : 0));
      return { type: 'plant', hand: dump };
    }
    if (CFG.cycle && G.deck.length >= (typeof CFG.cycleMinDeck === 'object' ? CFG.cycleMinDeck[G.n] : CFG.cycleMinDeck) && P[best] < CFG.gamble && (!CFG.cycleNeedsVerifier || verifierExists(G, p))) {
      const hs = hintOptions(G, p);
      if (!CFG.cycleNeedsNoHint || !hs.length || hs[0].score < 2) {
        // Dump the card that matters least later; teammates will discard it if it is wrong.
        const dump = argmax(me.hand, (s, i) => -(futureVal(i) * 3 + P[i] * 0.2) - (A.isExact(s.known) ? 5 : 0));
        return { type: 'plant', hand: dump };
      }
    }
  }

  // 3. Guard check when a useful hint is on offer.
  const hints = hintOptions(G, p);
  if (L.guard.ok && hints.length && hints[0].score >= 2) return { type: 'guard' };

  // 4. Riot when I need a fresh card and no teammate can help.
  if (!myRec && me.hand.length && L.riot.ok && G.deck.length >= 6) {
    const best = Math.max(0, ...P);
    const pAny = 1 - P.reduce((a, x) => a * (1 - x), 1);
    if (best < CFG.gamble && pAny < 0.55) return { type: 'riot' };
  }

  // 5. Idle: a guard check may still earn a useful hint.
  if (L.guard.ok) return { type: 'guard' };
  if (L.pass.ok) return { type: 'pass' };
  if (L.riot.ok) return { type: 'riot' };
  if (L.distract.ok) return { type: 'distract', player: O.planted[0].player };
  if (L.plant.ok) return { type: 'plant', hand: argmax(me.hand, (s, i) => P[i]) };
  return { type: 'pass' };
}

function decideSwap(G, p) {
  const O = A.active(G), N = G.obstacles[G.cur + 1];
  // What each player knows about their own cards, as far as I can tell.
  const info = G.players.map((q) => {
    const mine = q.idx === p;
    const cands = A.handCandidates(G, q.idx, mine ? undefined : A.modelPool(G, p, q.idx));
    return {
      planted: !!A.plantedBy(O, q.idx),
      certO: cands.map((cs) => allPass(cs, O.sec.test)),
      certN: cands.map((cs) => (N ? allPass(cs, N.sec.test) : false)),
      // chance each card matches, from my point of view (my own cards are hidden from me)
      pm: q.hand.map((s, i) => (mine ? frac(cands[i], O.sec.test) : O.sec.test(s.card) ? 1 : 0)),
      pn: q.hand.map((s, i) => (!N ? 0 : mine ? frac(cands[i], N.sec.test) : N.sec.test(s.card) ? 1 : 0)),
    };
  });
  const loc = (kind, a, b) => {
    if (kind === 'discard') { const c = G.discard[a]; return { l: { kind, index: a }, owner: null, slot: -1, pm: O.sec.test(c) ? 1 : 0, pn: N && N.sec.test(c) ? 1 : 0, certO: false }; }
    const I = info[a];
    return { l: { kind, player: a, hand: b }, owner: a, slot: b, pm: I.pm[b], pn: I.pn[b], certO: I.certO[b] };
  };
  const readyO = (I) => I.certO.some(Boolean), readyN = (I) => I.certN.some(Boolean);
  const gain = (owner, inc, out) => {
    const I = info[owner];
    let v = 0;
    if (!I.planted) {
      v += inc.pm * (readyO(I) ? 1 : 10);
      if (out.certO) v -= I.certO.some((c, i) => c && i !== out.slot) ? 1 : 10;
      else v -= 1.5 * out.pm;
    }
    if (N) { v += inc.pn * (readyN(I) ? 0.3 : 2.5); v -= 0.8 * out.pn; }
    return v;
  };
  const spots = [];
  G.players.forEach((q) => q.hand.forEach((s, k) => spots.push(loc('player', q.idx, k))));
  const discs = G.discard.map((c, i) => loc('discard', i));
  let best = null;
  const consider = (x, y, score) => { if (!best || score > best.score) best = { score, a: x.l, b: y.l }; };
  for (let i = 0; i < spots.length; i++) {
    for (let j = i + 1; j < spots.length; j++) {
      const x = spots[i], y = spots[j];
      consider(x, y, x.owner === y.owner ? 0 : gain(x.owner, y, x) + gain(y.owner, x, y));
    }
    for (const d of discs) consider(spots[i], d, gain(spots[i].owner, d, spots[i]) - 0.01);
  }
  return { type: 'riotSwap', a: best.a, b: best.b };
}

function decidePatrolPick(G, p) {
  const pool = A.poolFor(G, p);
  const idx = argmax(G.patrolDiscard, (pc) => frac(pool, (c) => !pc.test(c)));
  return { type: 'distractPatrol', index: idx };
}

// Could another player safely break through? (Their own planted card is certain to them and everyone else's card matches.)
function someoneElseCanBreak(G, p) {
  const O = A.active(G);
  for (const q of G.players) {
    if (q.idx === p) continue;
    const rec = A.plantedBy(O, q.idx);
    const cs = A.isExact(rec.known) ? [rec.card] : A.modelPool(G, p, q.idx).filter((c) => A.knownMatches(c, rec.known));
    if (!allPass(cs, O.sec.test)) continue;
    if (O.planted.every((r) => r.player === q.idx || O.sec.test(r.card))) return true;
  }
  return false;
}

function decidePost(G, p) {
  if (!A.allPlanted(G)) return { type: 'end' };
  const O = A.active(G);
  let pAll = 1;
  for (const rec of O.planted) pAll *= frac(A.plantedCandidates(G, p, rec), O.sec.test);
  if (pAll > 0.9999) return { type: 'breakthrough' };
  if (CFG.alarmGamble && A.alarmVisible(G) && pAll >= 0.34 && !someoneElseCanBreak(G, p)) return { type: 'breakthrough' };
  return { type: 'end' };
}

function decideDirection(G) {
  // Tackle the hardest locks first, while the flashlight deck is full.
  const w = { easy: 1, medium: 2, hard: 3 };
  const n = G.obstacles.length;
  const score = (order) => order.reduce((s, o, i) => s + w[o.sec.level] * (n - i), 0);
  const l = score(G.obstacles), r = score(G.obstacles.slice().reverse());
  return { type: 'direction', dir: r > l ? 'rtl' : 'ltr' };
}

function decide(G) {
  const p = G.turn;
  switch (G.phase) {
    case 'direction': return decideDirection(G);
    case 'action': return decideAction(G, p);
    case 'hint': return decideHint(G, p);
    case 'riotSwap': return decideSwap(G, p);
    case 'distractPatrol': return decidePatrolPick(G, p);
    case 'post': return decidePost(G, p);

const api = { decide, hintOptions, verifierExists, CFG };
if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.AceCPU = api;

\/p><\/div>\n  <div class=\"box\"><h3>Goal<\/h3><p>The crew wins if it successfully completes <b>the entire escape plan<\/b>: every obstacle cleared, one card from every player each time.<\/p><p>One wrong card trips the alarm and <b>everyone<\/b> goes back to their cells.<\/p><\/div>\n <\/div>\n <div class=\"box\"><h3>Components<\/h3>\n  <div class=\"row\" style=\"gap:22px;align-items:flex-end\">\n   <div class=\"deck\"><div class=\"row\" style=\"gap:4px\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>RED<\/b><em>MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>Q, K<\/b><em>MATCH<\/em><span>QUEEN OR KING<\/span><u class=\"hard\">HARD<\/u><\/div><\/div><small>17 Security cards<br>(two-sided: obstacle / guard check)<\/small><\/div>\n   <div class=\"deck\"><div class=\"sc alarm s\"><i>ALARM SOUNDS<\/i><b>🚨<\/b><span>Drawing LOCKED. Pass allowed.<\/span><\/div><small>1 Alarm Sounds card<\/small><\/div>\n   <div class=\"deck\"><div class=\"stackc\"><div class=\"pc back d3\"><\/div><div class=\"pc back d2\"><\/div><div class=\"pc back \"><\/div><\/div><small>52-card deck, no jokers<br>(not included)<\/small><\/div>\n  <\/div>\n<\/div>\n <div class=\"box\" style=\"padding:9px 14px\"><h3>The three kinds of Security cards<\/h3>\n  <div class=\"cols c3\" style=\"gap:8px\">\n   <div class=\"row\" style=\"justify-content:flex-start;gap:10px\"><div class=\"sc down easy s\"><small>LOCK SECURITY LEVEL<\/small><b>EASY<\/b><\/div><div><b style=\"color:#1fa38a\">EASY<\/b> × 6<br><span style=\"font-size:8.8pt\">Match half the deck, such as <i>odd<\/i>, <i>red<\/i> or <i>high<\/i>.<\/span><\/div><\/div>\n   <div class=\"row\" style=\"justify-content:flex-start;gap:10px\"><div class=\"sc down medium s\"><small>LOCK SECURITY LEVEL<\/small><b>MEDIUM<\/b><\/div><div><b style=\"color:#e08a00\">MEDIUM<\/b> × 6<br><span style=\"font-size:8.8pt\">One suit, or a group of ranks such as <i>face cards<\/i>.<\/span><\/div><\/div>\n   <div class=\"row\" style=\"justify-content:flex-start;gap:10px\"><div class=\"sc down hard s\"><small>LOCK SECURITY LEVEL<\/small><b>HARD<\/b><\/div><div><b style=\"color:#d23b4a\">HARD<\/b> × 5<br><span style=\"font-size:8.8pt\">Only two ranks match, such as <i>8 or 9<\/i>.<\/span><\/div><\/div>\n  <\/div><\/div>\n <div class=\"foot\"><span>Escape from Ace-catraz · Rules<\/span><span>1<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><div class=\"n\">1<\/div><h2>Setup<\/h2><small>Before you play<\/small><\/div>\n <div class=\"cols c21\">\n  <div class=\"box\">\n   <div class=\"step\"><div class=\"n\">1<\/div><div><b>Build the Escape Plan.<\/b> Set the <b>HARD<\/b> cards and the Alarm card aside. Add <b>1<\/b> (2 players), <b>2<\/b> (3 players) or <b>3<\/b> (4 players) HARD cards to the Easy and Medium cards, and shuffle. Deal this deck face down in a line in the centre to make the <b>Obstacles<\/b> (see the table).<\/div><\/div>\n   <div class=\"step\"><div class=\"n\">2<\/div><div><b>Create the Patrol Deck.<\/b> Shuffle the unused HARD cards into the remaining Security cards. Place this deck next to the Flashlight Deck.<\/div><\/div>\n   <div class=\"step\"><div class=\"n\">3<\/div><div><b>Peek at the lock levels, then choose your escape path.<\/b> Look at the Lock Security Level shown on the back of each Obstacle, then agree on a direction: <b>left-to-right<\/b> or <b>right-to-left<\/b>. Flip the first two Obstacles from that end face up. The first is the <b>active<\/b> Obstacle. Start with the hard ones, or save them for later. It’s your call.<\/div><\/div>\n   <div class=\"step\"><div class=\"n\">4<\/div><div><b>Prepare the Flashlight Deck.<\/b> Shuffle the 52 cards, then place them face down on top of the Alarm Sounds card (a 53-card deck).<\/div><\/div>\n   <div class=\"step\"><div class=\"n\">5<\/div><div><b>Prep the crew.<\/b> Deal 5 cards from the top of the Flashlight Deck to each player. <b>No peeking at your own cards.<\/b> Hold the
