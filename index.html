s=\"ti\">🪥<\/span><span class=\"tn\">SHIV<\/span><\/div><div class=\"gc \" style=\"zoom:0.7;background:#d9f1e9;border-color:#009E73\"><span class=\"gs\">🪼<\/span><span class=\"ti\">⛏️<\/span><span class=\"tn\">PICKAXE<\/span><\/div><div class=\"gc \" style=\"zoom:0.7;background:#f7e6ef;border-color:#CC79A7\"><span class=\"gs\">🌙<\/span><span class=\"ti\">✂️<\/span><span class=\"tn\">SCISSORS<\/span><\/div><\/div><\/div><span class=\"arrow\">↔<\/span><div style=\"text-align:center\"><div class=\"lab\" style=\"margin-bottom:4px\">What you see<\/div><div class=\"row\" style=\"gap:5px\"><div class=\"gc back \" style=\"zoom:0.7\"><span>ACE-<br>CATRAZ<\/span><\/div><div class=\"gc back \" style=\"zoom:0.7\"><span>ACE-<br>CATRAZ<\/span><\/div><div class=\"gc back \" style=\"zoom:0.7\"><span>ACE-<br>CATRAZ<\/span><\/div><div class=\"gc back \" style=\"zoom:0.7\"><span>ACE-<br>CATRAZ<\/span><\/div><div class=\"gc back \" style=\"zoom:0.7\"><span>ACE-<br>CATRAZ<\/span><\/div><\/div><\/div><\/div><div class=\"cap\">Teammates give you hints (a gang or a tool) through Guard Checks. Keep track of what you’ve been told.<\/div><\/div>\n<div class=\"foot\"><span>Escape from Ace-catraz · Prison Deck Rules<\/span><span>1<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><span class=\"n\"><\/span><h2>Security cards &amp; set-up<\/h2><small>Setup<\/small><\/div>\n<div class=\"box\"><h3>The three kinds of Security card<\/h3>\n<div class=\"cols c3\">\n<div class=\"row\" style=\"flex-direction:column;gap:6px\"><div class=\"sx up\" style=\"zoom:0.85\"><div class=\"ph\"><span>ESCAPE PLAN<\/span><span class=\"locks \"><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><\/span><\/div><div class=\"pt\"><small>CELL BLOCK NORTH<\/small><span class=\"nm\" style=\"font-size:20px\">NORTH BLOCK<\/span><\/div><div class=\"pm\"><div class=\"chips lg\"><span class=\"chip gang\" style=\"border-color:#E69F00;background:#fdf0d0\"><b>🔥<\/b><u>HOTHEADS<\/u><\/span><em>OR<\/em><span class=\"chip gang\" style=\"border-color:#56B4E9;background:#e0f1fb\"><b>🍭<\/b><u>STICKY FINGERS<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"lvp\">EASY<\/span><\/div><\/div><div style=\"text-align:center\"><b>EASY × 6<\/b><br>One padlock. Matches about half the deck: a cell block, a work zone or quiet/loud.<\/div><\/div>\n<div class=\"row\" style=\"flex-direction:column;gap:6px\"><div class=\"sx up\" style=\"zoom:0.85\"><div class=\"ph\"><span>ESCAPE PLAN<\/span><span class=\"locks \"><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><\/span><\/div><div class=\"pt\"><small>ONE WHOLE GANG<\/small><span class=\"nm\" style=\"font-size:18px\">THE HOTHEADS<\/span><\/div><div class=\"pm\"><div class=\"chips lg\"><span class=\"chip gang\" style=\"border-color:#E69F00;background:#fdf0d0\"><b>🔥<\/b><u>HOTHEADS<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"lvp\">MEDIUM<\/span><\/div><\/div><div style=\"text-align:center\"><b>MEDIUM × 6<\/b><br>Two padlocks. One whole gang, or a small group of tools such as the Heavy Hitters.<\/div><\/div>\n<div class=\"row\" style=\"flex-direction:column;gap:6px\"><div class=\"sx up\" style=\"zoom:0.85\"><div class=\"ph\"><span>ESCAPE PLAN<\/span><span class=\"locks \"><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><\/span><\/div><div class=\"pt\"><small>TUNNEL TOOLS<\/small><span class=\"nm\" style=\"font-size:28px\">DIG SET<\/span><\/div><div class=\"pm\"><div class=\"chips lg\"><span class=\"chip\"><b>⛏️<\/b><u>PICKAXE<\/u><\/span><em>OR<\/em><span class=\"chip\"><b>🥄<\/b><u>SPOON<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"lvp\">HARD<\/span><\/div><\/div><div style=\"text-align:center\"><b>HARD × 5<\/b><br>Three padlocks. Only <b>two tools<\/b> match, such as the Smashers.<\/div><\/div>\n<\/div><p class=\"lab\" style=\"margin-top:6px;text-transform:none;letter-spacing:.02em;font-size:8pt\">Each card is two-sided: the obstacle side is shown here, and the guard patrol side is on the back (see page 3). Three padlocks on the front means one alert bar on the back.<\/p><\/div>\n<div class=\"cols c21\"><div class=\"box\"><h3>Before you play<\/h3>\n<div class=\"step\"><span class=\"n\">1<\/span><div><b>Build the Escape Plan.<\/b> Set the <b>HARD<\/b> cards and the Alarm card aside. Add <b>1<\/b> (2 players), <b>2<\/b> (3 players) or <b>3<\/b> (4 players) HARD cards to the Easy and Medium cards and shuffle. Deal them face down in a line in the centre: these are the <b>Obstacles<\/b>.<\/div><\/div>\n<div class=\"step\"><span class=\"n\">2<\/span><div><b>Create the Patrol Deck.<\/b> Shuffle the unused HARD cards into the remaining Security cards, patrol side up on top. Place it next to the Flashlight Deck.<\/div><\/div>\n<div class=\"step\"><span class=\"n\">3<\/span><div><b>Peek at the lock levels, then choose your escape path.<\/b> Look at the padlocks on the back of each Obstacle, then agree on a direction: <b>left-to-right<\/b> or <b>right-to-left<\/b>. Flip the first two Obstacles from that end face up. The first is the <b>active<\/b> Obstacle.<\/div><\/div>\n<div class=\"step\"><span class=\"n\">4<\/span><div><b>Prepare the Flashlight Deck.<\/b> Shuffle the 52 Prison cards and place them face down on top of the Alarm Sounds card (a 53-card deck).<\/div><\/div>\n<div class=\"step\"><span class=\"n\">5<\/span><div><b>Prep the crew.<\/b> Deal 5 cards to each player. <b>No peeking at your own cards.<\/b> Hold them facing outward.<\/div><\/div>\n<\/div>\n<div class=\"box\"><h3>Obstacles by player count<\/h3><table><tr><th>Players<\/th><th>Obstacles<\/th><th>HARD added<\/th><\/tr><tr><td><b>2<\/b><\/td><td>8<\/td><td>1<\/td><\/tr><tr><td><b>3<\/b><\/td><td>5<\/td><td>2<\/td><\/tr><tr><td><b>4<\/b><\/td><td>3<\/td><td>3<\/td><\/tr><\/table>\n<div class=\"tip\" style=\"margin-top:8px\"><b>Tip:<\/b> to raise the difficulty, add 1 extra Obstacle.<\/div>\n<div class=\"note\" style=\"margin-top:8px\"><b>Why peek first?<\/b> Seeing the lock levels lets the crew decide whether to take the tough locks early or save them for last.<\/div><\/div><\/div>\n<div class=\"diag\"><div class=\"lab\">Set-up for 4 players<\/div><div class=\"row\" style=\"gap:16px;align-items:flex-end\"><div class=\"deckw\"><div class=\"sx up active\" style=\"zoom:0.72\"><div class=\"ph\"><span>ESCAPE PLAN<\/span><span class=\"locks \"><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><\/span><\/div><div class=\"pt\"><small>LOCKS · SHARPS · CUTTERS<\/small><span class=\"nm\" style=\"font-size:24px\">CELL WORK<\/span><\/div><div class=\"pm\"><div class=\"chips sm\"><span class=\"chip\"><b>🧷<\/b><u>PIN<\/u><\/span><span class=\"chip\"><b>📎<\/b><u>CLIP<\/u><\/span><span class=\"chip\"><b>🔑<\/b><u>KEY<\/u><\/span><span class=\"chip\"><b>🪥<\/b><u>SHIV<\/u><\/span><span class=\"chip\"><b>🪛<\/b><u>DRIVER<\/u><\/span><span class=\"chip\"><b>🪚<\/b><u>SAW<\/u><\/span><span class=\"chip\"><b>✂️<\/b><u>SCISSORS<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"lvp\">EASY<\/span><\/div><\/div><small>Active ▲<\/small><\/div><div class=\"deckw\"><div class=\"sx up\" style=\"zoom:0.72\"><div class=\"ph\"><span>ESCAPE PLAN<\/span><span class=\"locks \"><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><\/span><\/div><div class=\"pt\"><small>ONE WHOLE GANG<\/small><span class=\"nm\" style=\"font-size:18px\">THE HOTHEADS<\/span><\/div><div class=\"pm\"><div class=\"chips lg\"><span class=\"chip gang\" style=\"border-color:#E69F00;background:#fdf0d0\"><b>🔥<\/b><u>HOTHEADS<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"lvp\">MEDIUM<\/span><\/div><\/div><small>Next ▲<\/small><\/div><div class=\"deckw\"><div class=\"sx dn\" style=\"zoom:0.72\"><small>ESCAPE PLAN<\/small><span class=\"locks big\"><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><\/span><b>HARD<\/b><\/div><small>Locked ▲<\/small><\/div><span style=\"width:14px\"><\/span><div class=\"deckw\"><div class=\"sx pat\" style=\"zoom:0.72\"><div class=\"ph\"><span>GUARD PATROL<\/span><svg viewBox=\"0 0 22 16\"><path d=\"M1 8c3-5 7-6.5 10-6.5S18 3 21 8c-3 5-7 6.5-10 6.5S4 13 1 8z\" fill=\"none\" stroke=\"#F0E442\" stroke-width=\"1.8\"/><circle cx=\"11\" cy=\"8\" r=\"3.2\" fill=\"#F0E442\"/><\/svg><\/div><div class=\"pt\"><span class=\"not\">NOT<\/span><span class=\"nm\" style=\"font-size:17px\">CLIMBING GEAR<\/span><small>OVER THE WALL<\/small><\/div><div class=\"pm\"><div class=\"chips lg\"><span class=\"chip\"><b>🪢<\/b><u>ROPE<\/u><\/span><em>OR<\/em><span class=\"chip\"><b>🪜<\/b><u>LADDER<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"bars\"><i class=\"on\"><\/i><i><\/i><i><\/i><\/span><span class=\"plv\">RELAXED<\/span><\/div><\/div><small>Patrol deck ▲<\/small><\/div><div class=\"deckw\"><div class=\"gc back\" style=\"zoom:1.05\"><span>ACE-<br>CATRAZ<\/span><\/div><small>Flashlight deck ▲<\/small><\/div><\/div>\n<div class=\"cap\">Each inmate holds five cards. Cards face outward, so everyone sees your hand but you.<\/div><\/div>\n<div class=\"foot\"><span>Escape from Ace-catraz · Prison Deck Rules<\/span><span>2<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><span class=\"n\"><\/span><h2>On your turn<\/h2><small>Actions<\/small><\/div>\n<div class=\"box\" style=\"padding:8px 14px\"><p><b>1.<\/b> Perform <b>one<\/b> of the five actions &nbsp;›&nbsp; <b>2.<\/b> Optionally attempt a <b>Breakthrough<\/b><\/p><\/div>\n<div class=\"action\"><h4><span>1<\/span>Play my part<\/h4><div class=\"cols c21\" style=\"align-items:center\"><div><p>Choose a card from your hand <b>without looking at it<\/b>. Place it face down on an <b>unoccupied corner of the active Obstacle<\/b>.<\/p><p>Then draw a card from the Flashlight Deck into your hand, keeping it facing away from you.<\/p><\/div><div class=\"row\"><div class=\"gc \" style=\"zoom:0.85;background:#f7e6ef;border-color:#CC79A7\"><span class=\"gs\">🌙<\/span><span class=\"ti\">🪛<\/span><span class=\"tn\">DRIVER<\/span><\/div><div class=\"gc back \" style=\"zoom:0.85\"><span>ACE-<br>CATRAZ<\/span><\/div><\/div><\/div><\/div>\n<div class=\"action\"><h4><span>2<\/span>Perform a Guard check<\/h4>\n<div class=\"cols c21\"><div><ol><li>Flip the top <b>Patrol<\/b> card and the top <b>Flashlight<\/b> card.<\/li><li>Compare the Flashlight card against the Patrol card’s <b>NOT<\/b> line.<\/li><li><b class=\"bad\">Fail:<\/b> the card <b>matches<\/b> what the patrol is NOT looking for. Stay silent. Your turn is over.<\/li><li><b class=\"ok\">Pass:<\/b> the card does <b>not<\/b> match. Point to a card in a teammate’s hand and say either its <b>gang<\/b> or its <b>tool<\/b>.<\/li><li>Discard both revealed cards.<\/li><\/ol><\/div><div class=\"row\" style=\"flex-direction:column;gap:6px\"><div class=\"sx pat\" style=\"zoom:0.8\"><div class=\"ph\"><span>GUARD PATROL<\/span><svg viewBox=\"0 0 22 16\"><path d=\"M1 8c3-5 7-6.5 10-6.5S18 3 21 8c-3 5-7 6.5-10 6.5S4 13 1 8z\" fill=\"none\" stroke=\"#F0E442\" stroke-width=\"1.8\"/><circle cx=\"11\" cy=\"8\" r=\"3.2\" fill=\"#F0E442\"/><\/svg><\/div><div class=\"pt\"><span class=\"not\">NOT<\/span><span class=\"nm\" style=\"font-size:20px\">QUIET TOOLS<\/span><small>NO NOISE<\/small><\/div><div class=\"pm\"><div class=\"chips sm\"><span class=\"chip\"><b>🧷<\/b><u>PIN<\/u><\/span><span class=\"chip\"><b>📎<\/b><u>CLIP<\/u><\/span><span class=\"chip\"><b>🥄<\/b><u>SPOON<\/u><\/span><span class=\"chip\"><b>🪥<\/b><u>SHIV<\/u><\/span><span class=\"chip\"><b>🪢<\/b><u>ROPE<\/u><\/span><span class=\"chip\"><b>✂️<\/b><u>SCISSORS<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"bars\"><i class=\"on\"><\/i><i class=\"on\"><\/i><i class=\"on\"><\/i><\/span><span class=\"plv\">EXTREME CAUTION<\/span><\/div><\/div><\/div><\/div><\/div>\n<div class=\"cols c2\">\n<div class=\"diag\"><div class=\"lab ok\">Pass ✓<\/div><div class=\"row\"><div class=\"sx pat\" style=\"zoom:0.75\"><div class=\"ph\"><span>GUARD PATROL<\/span><svg viewBox=\"0 0 22 16\"><path d=\"M1 8c3-5 7-6.5 10-6.5S18 3 21 8c-3 5-7 6.5-10 6.5S4 13 1 8z\" fill=\"none\" stroke=\"#F0E442\" stroke-width=\"1.8\"/><circle cx=\"11\" cy=\"8\" r=\"3.2\" fill=\"#F0E442\"/><\/svg><\/div><div class=\"pt\"><span class=\"not\">NOT<\/span><span class=\"nm\" style=\"font-size:20px\">QUIET TOOLS<\/span><small>NO NOISE<\/small><\/div><div class=\"pm\"><div class=\"chips sm\"><span class=\"chip\"><b>🧷<\/b><u>PIN<\/u><\/span><span class=\"chip\"><b>📎<\/b><u>CLIP<\/u><\/span><span class=\"chip\"><b>🥄<\/b><u>SPOON<\/u><\/span><span class=\"chip\"><b>🪥<\/b><u>SHIV<\/u><\/span><span class=\"chip\"><b>🪢<\/b><u>ROPE<\/u><\/span><span class=\"chip\"><b>✂️<\/b><u>SCISSORS<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"bars\"><i class=\"on\"><\/i><i class=\"on\"><\/i><i class=\"on\"><\/i><\/span><span class=\"plv\">EXTREME CAUTION<\/span><\/div><\/div><span class=\"lab\">vs<\/span><div class=\"gc \" style=\"zoom:1.0;background:#d9f1e9;border-color:#009E73\"><span class=\"gs\">🪼<\/span><span class=\"ti\">🪓<\/span><span class=\"tn\">AXE<\/span><\/div><\/div><div class=\"cap\"><b>Axe<\/b> is loud, so it is not a Quiet Tool. <b>Pass.<\/b> Give a hint!<\/div><\/div>\n<div class=\"diag\"><div class=\"lab bad\">Fail ✗<\/div><div class=\"row\"><div class=\"sx pat\" style=\"zoom:0.75\"><div class=\"ph\"><span>GUARD PATROL<\/span><svg viewBox=\"0 0 22 16\"><path d=\"M1 8c3-5 7-6.5 10-6.5S18 3 21 8c-3 5-7 6.5-10 6.5S4 13 1 8z\" fill=\"none\" stroke=\"#F0E442\" stroke-width=\"1.8\"/><circle cx=\"11\" cy=\"8\" r=\"3.2\" fill=\"#F0E442\"/><\/svg><\/div><div class=\"pt\"><span class=\"not\">NOT<\/span><span class=\"nm\" style=\"font-size:20px\">QUIET TOOLS<\/span><small>NO NOISE<\/small><\/div><div class=\"pm\"><div class=\"chips sm\"><span class=\"chip\"><b>🧷<\/b><u>PIN<\/u><\/span><span class=\"chip\"><b>📎<\/b><u>CLIP<\/u><\/span><span class=\"chip\"><b>🥄<\/b><u>SPOON<\/u><\/span><span class=\"chip\"><b>🪥<\/b><u>SHIV<\/u><\/span><span class=\"chip\"><b>🪢<\/b><u>ROPE<\/u><\/span><span class=\"chip\"><b>✂️<\/b><u>SCISSORS<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"bars\"><i class=\"on\"><\/i><i class=\"on\"><\/i><i class=\"on\"><\/i><\/span><span class=\"plv\">EXTREME CAUTION<\/span><\/div><\/div><span class=\"lab\">vs<\/span><div class=\"gc \" style=\"zoom:1.0;background:#fdf0d0;border-color:#E69F00\"><span class=\"gs\">🔥<\/span><span class=\"ti\">🧷<\/span><span class=\"tn\">PIN<\/span><\/div><\/div><div class=\"cap\"><b>Safety Pin<\/b> is a Quiet Tool. <b>Fail.<\/b> Say nothing.<\/div><\/div><\/div>\n<div class=\"box\"><h3>Reading the Patrol card<\/h3><p>The yellow bars show how risky the check is. <b>Extreme caution<\/b> (three bars, the card’s obstacle side is Easy) is hard to pass because it rules out half the deck. <b>Relaxed<\/b> (one bar, the obstacle side is Hard) is easy to pass because it rules out only two tools. The top of the Patrol deck always shows how tough the next check is.<\/p><\/div>\n<div class=\"box\"><h3>Hints, in practice<\/h3><div class=\"cols c21\" style=\"align-items:center\"><p>Point at a teammate’s card and say its <b>gang<\/b> or its <b>tool<\/b>, never both. “<b>That one is a Jelly Crew<\/b>” or “<b>that one is a Handsaw<\/b>.” Your teammate remembers it and builds a picture over several turns.<\/p><div class=\"row\" style=\"gap:5px\"><div class=\"gc \" style=\"zoom:0.8;background:#fdf0d0;border-color:#E69F00\"><span class=\"gs\">🔥<\/span><span class=\"ti\">🪚<\/span><span class=\"tn\">SAW<\/span><\/div><div class=\"gc \" style=\"zoom:0.8;background:#e0f1fb;border-color:#56B4E9\"><span class=\"gs\">🍭<\/span><span class=\"ti\">🔨<\/span><span class=\"tn\">HAMMER<\/span><\/div><div class=\"gc \" style=\"zoom:0.8;background:#d9f1e9;border-color:#009E73\"><span class=\"gs\">🪼<\/span><span class=\"ti\">🥄<\/span><span class=\"tn\">SPOON<\/span><\/div><div class=\"gc \" style=\"zoom:0.8;background:#f7e6ef;border-color:#CC79A7\"><span class=\"gs\">🌙<\/span><span class=\"ti\">🪜<\/span><span class=\"tn\">LADDER<\/span><\/div><\/div><\/div><\/div>\n<div class=\"foot\"><span>Escape from Ace-catraz · Prison Deck Rules<\/span><span>3<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><span class=\"n\"><\/span><h2>On your turn, continued<\/h2><small>Actions 3 to 5 and the Breakthrough<\/small><\/div>\n<div class=\"cols c2\">\n<div class=\"action\"><h4><span>3<\/span>Distract<\/h4><p>Discard <b>any<\/b> card at the active Obstacle, then choose a Patrol card from the discard pile and shuffle it back into the Patrol deck. Use it to remove a card you know is wrong, and to bring back an easy Guard Check.<\/p><\/div>\n<div class=\"action\"><h4><span>4<\/span>Riot<\/h4><p>Discard <b>5 cards<\/b> from the top of the Flashlight Deck (it must have at least 5 left), then <b>swap any two cards<\/b>: your own, another player’s, or one from the discard pile. At least one must be in a player’s hand. The best way to move a card to where it’s needed.<\/p><\/div><\/div>\n<div class=\"cols c21\" style=\"align-items:stretch\"><div class=\"action\"><h4><span>5<\/span>Pass<\/h4><p>Only available once the <b>Alarm Sounds card is visible<\/b>, which means the Flashlight Deck has run out. Skip your turn. (Pass is also what you do if you have no other legal action.)<\/p><p>When the Alarm card shows, <b>drawing is locked<\/b>: planting a card no longer replaces it, so hands shrink as the crew plants.<\/p><\/div><div class=\"diag\" style=\"place-items:center\"><div class=\"sx alarm\" style=\"zoom:0.65\"><small>ALARM SOUNDS<\/small><b>🚨<\/b><span>Drawing LOCKED.<br>Pass allowed.<\/span><\/div><\/div><\/div>\n<div class=\"box\" style=\"border-color:var(--red);border-width:3px\"><h3 style=\"color:var(--red-d)\">Then, optionally: Breakthrough<\/h3><p>If <b>each player has planted exactly one card<\/b> on the active Obstacle, you may attempt a Breakthrough. Reveal every planted card.<\/p><p><b class=\"ok\">All cards meet the condition →<\/b> success! Stack the used cards face down on the Obstacle, reveal the next face-down Obstacle (so two are visible), and the next Obstacle in your direction becomes active.<\/p><p><b class=\"bad\">Even one card fails →<\/b> the alarm is tripped and <b>everyone loses immediately<\/b>.<\/p><\/div>\n<div class=\"cols c2\">\n<div class=\"diag\"><div class=\"lab ok\">Success · 3 players · obstacle: Cell Work<\/div><div class=\"row\"><div class=\"sx up active\" style=\"zoom:0.7\"><div class=\"ph\"><span>ESCAPE PLAN<\/span><span class=\"locks \"><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><\/span><\/div><div class=\"pt\"><small>LOCKS · SHARPS · CUTTERS<\/small><span class=\"nm\" style=\"font-size:24px\">CELL WORK<\/span><\/div><div class=\"pm\"><div class=\"chips sm\"><span class=\"chip\"><b>🧷<\/b><u>PIN<\/u><\/span><span class=\"chip\"><b>📎<\/b><u>CLIP<\/u><\/span><span class=\"chip\"><b>🔑<\/b><u>KEY<\/u><\/span><span class=\"chip\"><b>🪥<\/b><u>SHIV<\/u><\/span><span class=\"chip\"><b>🪛<\/b><u>DRIVER<\/u><\/span><span class=\"chip\"><b>🪚<\/b><u>SAW<\/u><\/span><span class=\"chip\"><b>✂️<\/b><u>SCISSORS<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"lvp\">EASY<\/span><\/div><\/div><span class=\"arrow\">›<\/span><div class=\"gc hit\" style=\"zoom:0.85;background:#e0f1fb;border-color:#56B4E9\"><span class=\"gs\">🍭<\/span><span class=\"ti\">✂️<\/span><span class=\"tn\">SCISSORS<\/span><\/div><div class=\"gc hit\" style=\"zoom:0.85;background:#f7e6ef;border-color:#CC79A7\"><span class=\"gs\">🌙<\/span><span class=\"ti\">🔑<\/span><span class=\"tn\">KEY<\/span><\/div><div class=\"gc hit\" style=\"zoom:0.85;background:#fdf0d0;border-color:#E69F00\"><span class=\"gs\">🔥<\/span><span class=\"ti\">🧷<\/span><span class=\"tn\">PIN<\/span><\/div><\/div><div class=\"cap\">Scissors, Stolen Key and Safety Pin are all Cell Work tools. On to the next Obstacle!<\/div><\/div>\n<div class=\"diag\"><div class=\"lab bad\">Alarm! · 3 players · obstacle: Cell Work<\/div><div class=\"row\"><div class=\"sx up active\" style=\"zoom:0.7\"><div class=\"ph\"><span>ESCAPE PLAN<\/span><span class=\"locks \"><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><\/span><\/div><div class=\"pt\"><small>LOCKS · SHARPS · CUTTERS<\/small><span class=\"nm\" style=\"font-size:24px\">CELL WORK<\/span><\/div><div class=\"pm\"><div class=\"chips sm\"><span class=\"chip\"><b>🧷<\/b><u>PIN<\/u><\/span><span class=\"chip\"><b>📎<\/b><u>CLIP<\/u><\/span><span class=\"chip\"><b>🔑<\/b><u>KEY<\/u><\/span><span class=\"chip\"><b>🪥<\/b><u>SHIV<\/u><\/span><span class=\"chip\"><b>🪛<\/b><u>DRIVER<\/u><\/span><span class=\"chip\"><b>🪚<\/b><u>SAW<\/u><\/span><span class=\"chip\"><b>✂️<\/b><u>SCISSORS<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"lvp\">EASY<\/span><\/div><\/div><span class=\"arrow\">›<\/span><div class=\"gc hit\" style=\"zoom:0.85;background:#e0f1fb;border-color:#56B4E9\"><span class=\"gs\">🍭<\/span><span class=\"ti\">✂️<\/span><span class=\"tn\">SCISSORS<\/span><\/div><div class=\"gc miss\" style=\"zoom:0.85;background:#f7e6ef;border-color:#CC79A7\"><span class=\"gs\">🌙<\/span><span class=\"ti\">🔨<\/span><span class=\"tn\">HAMMER<\/span><\/div><div class=\"gc hit\" style=\"zoom:0.85;background:#fdf0d0;border-color:#E69F00\"><span class=\"gs\">🔥<\/span><span class=\"ti\">🧷<\/span><span class=\"tn\">PIN<\/span><\/div><\/div><div class=\"cap\">The Hammer is a Yard Work tool. Everyone loses. Safety first.<\/div><\/div><\/div>\n<div class=\"tip\"><b>Safety first.<\/b> Before attempting, make sure every planted card is one you’re certain about. If any player is unsure of their own planted card, let a teammate who <b>is<\/b> certain make the call, or Distract it. If one planted card is certain to be right, <b>one verifier<\/b> is enough: everyone else’s cards were seen while being planted.<\/div>\n<div class=\"foot\"><span>Escape from Ace-catraz · Prison Deck Rules<\/span><span>4<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><span class=\"n\"><\/span><h2>End game &amp; reminders<\/h2><small>Win, lose and tips<\/small><\/div>\n<div class=\"cols c2\"><div class=\"box\" style=\"background:#e5f4ec;border-color:#0e7a55\"><h3 style=\"color:var(--ok)\">Freedom!<\/h3><p>If you have completed <b>all Obstacles<\/b> in the Escape Plan, you win. Enjoy your freedom!<\/p><\/div>\n<div class=\"box\" style=\"background:#fde8e8;border-color:var(--red-d)\"><h3 style=\"color:var(--red-d)\">Back to your cells<\/h3><p>If any <b>Breakthrough fails<\/b>, or <b>all players have no cards in hand<\/b> and Obstacles remain, you lose.<\/p><\/div><\/div>\n<div class=\"box\"><h3>Critical reminders<\/h3><ul>\n<li>You see your teammates’ hands; <b>you cannot see your own<\/b>.<\/li><li>Once a card is planted face down, <b>no one can look at it again<\/b>.<\/li>\n<li>Inmates can only ever see the <b>active Obstacle and the next one<\/b>.<\/li><li>You may only plant cards at the <b>active Obstacle<\/b>.<\/li>\n<li>Every Obstacle needs <b>exactly one card from each player<\/b> to pass.<\/li><li>If any deck is empty, you <b>cannot reshuffle<\/b>.<\/li><\/ul><\/div>\n<div class=\"box\"><h3>Quick reference: your five actions<\/h3><table><tr><th>Action<\/th><th>What it does<\/th><th>When it shines<\/th><\/tr>\n<tr><td><b>Play my part<\/b><\/td><td>Plant a blind card face down, then draw<\/td><td>You know your card is right, or you want a fresh one<\/td><\/tr>\n<tr><td><b>Guard check<\/b><\/td><td>Flip Patrol + Flashlight card; if you pass, give a hint<\/td><td>The crew needs information<\/td><\/tr>\n<tr><td><b>Distract<\/b><\/td><td>Discard a planted card; return a Patrol card to the deck<\/td><td>A planted card is wrong or suspect<\/td><\/tr>\n<tr><td><b>Riot<\/b><\/td><td>Discard 5 from the deck, swap any two cards<\/td><td>The card an Obstacle needs is in the wrong hand<\/td><\/tr>\n<tr><td><b>Pass<\/b><\/td><td>Do nothing<\/td><td>Alarm visible and nothing useful to do<\/td><\/tr><\/table><\/div>\n<div class=\"cols c2\"><div class=\"box\"><h3>Tips for the crew<\/h3><ul>\n<li><b>Talk in hints, not answers.<\/b> A gang <b>or<\/b> a tool. Never both, never “that one’s fine”.<\/li>\n<li><b>Track what you know.<\/b> Jot hints on a scorepad or count them on your fingers.<\/li>\n<li><b>Watch every plant.<\/b> You need to remember every planted card to judge a Breakthrough.<\/li>\n<li><b>Planting a mystery card can be smart.<\/b> A teammate can Distract it if it’s wrong. Just don’t call the Breakthrough on it yourself.<\/li>\n<li><b>Pick your direction wisely.<\/b> Tackle hard locks while the deck is full, or clear easy ones first and keep hints flowing.<\/li>\n<li><b>Mind the Flashlight Deck.<\/b> When it runs out, the Alarm appears and drawing is locked.<\/li><\/ul><\/div>\n<div class=\"box\"><h3>Tool tricks<\/h3><ul>\n<li>Each tool belongs to a <b>category<\/b> (Lock Set, Sharps, Cutters, Climbing Gear, Smashers, Dig Set), a <b>zone<\/b> (Cell or Yard) and a <b>noise<\/b> (quiet or loud).<\/li>\n<li>A hint like “that’s a <b>Handsaw<\/b>” tells your teammate its gang is still unknown, but it is Cutters, Cell Work and Loud.<\/li>\n<li>A hint like “that’s a <b>Night Shift<\/b>” rules out every other gang, and every obstacle that needs a different one.<\/li>\n<li>Easy locks are broad. Hard locks name just two tools, so plan for them early.<\/li><\/ul><\/div><\/div>\n<div class=\"foot\"><span>Escape from Ace-catraz · Prison Deck Rules<\/span><span>5<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><span class=\"n\"><\/span><h2>Card reference<\/h2><small>All 17 Security cards<\/small><\/div>\n<div class=\"box\"><h3>Easy · one padlock<\/h3><div class=\"gl\" style=\"grid-template-columns:repeat(6,auto)\"><div style=\"text-align:center\"><div class=\"sx up\" style=\"zoom:0.55\"><div class=\"ph\"><span>ESCAPE PLAN<\/span><span class=\"locks \"><span class=\"lk on\"><svg viewBox=\   else top = '<path d="M22 30 L22 14 L31 22 L40 10 L49 22 L58 14 L58 30 Z" fill="#f7c928" stroke="#c99a00" stroke-width="2" stroke-linejoin="round"/><rect x="22" y="28" width="36" height="5" fill="#f7c928" stroke="#c99a00" stroke-width="2"/>' + '<path d="M20 40 Q20 30 40 30 Q60 30 60 40 Z" fill="' + a.hair + '" opacity="0"/>';
  return '<svg class="av" width="' + sz + '" height="' + sz + '" viewBox="0 0 80 80" aria-hidden="true"><defs><clipPath id="avc' + i + '-' + sz + '"><circle cx="40" cy="40" r="40"/></clipPath></defs>' +
    '<g clip-path="url(#avc' + i + '-' + sz + ')"><rect width="80" height="80" fill="' + a.bg + '"/>' +
    '<path d="M6 84 Q8 58 40 56 Q72 58 74 84 Z" fill="#fff"/>' +
    [0, 1, 2, 3, 4].map((k) => '<rect x="' + (10 + k * 14) + '" y="56" width="7" height="26" fill="#222" opacity=".85"/>').join('') +
    '<rect x="34" y="50" width="12" height="9" fill="' + a.skin + '"/>' +
    '<ellipse cx="40" cy="36" rx="19" ry="20" fill="' + a.skin + '"/>' + top +
    '<ellipse cx="33" cy="38" rx="4.6" ry="5.4" fill="#fff"/><ellipse cx="47" cy="38" rx="4.6" ry="5.4" fill="#fff"/>' +
    '<circle cx="34" cy="39" r="2.5" fill="#222"/><circle cx="48" cy="39" r="2.5" fill="#222"/>' +
    '<path d="M33 47 Q40 54 47 47" fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round"/></g></svg>';
}

const VIEW = () => (ui.hot && G ? G.turn : 0);
const isMe = (p) => p.idx === VIEW();
function isSwapSel(pl, i) { const a = ui.swapA; return !!a && a.kind === 'player' && a.player === pl && a.hand === i; }
function mode() {
  if (!G || G.result || ui.dialog || ui.help) return null;
  if (!G.players[G.turn].human) return null;
  switch (G.phase) {
    case 'direction': return 'direction';
    case 'action': return ui.sel || 'choose';
    case 'hint': return 'hint';
    case 'distractPatrol': return 'patrol';
    case 'riotSwap': return ui.swapA == null ? 'swapA' : 'swapB';
    case 'post': return 'post';
  }
  return null;
}

function headerHTML() {
  const alarm = G && A.alarmVisible(G);
  let chips = '';
  if (G) {
    chips = '<span class="chip ' + (alarm ? 'alarm' : '') + '">' + (alarm ? '<b>ALARM SOUNDS</b> drawing locked' : 'Flashlight deck <b>' + G.deck.length + '</b>') + '</span>' +
      '<span class="chip">Patrol deck <b>' + G.patrol.length + '</b></span>' +
      '<span class="chip">Cleared <b>' + Math.min(G.cur, G.obstacles.length) + '/' + G.obstacles.length + '</b></span>';
  }
  const bar = '<header class="bar"><h1>Escape from <span class="tag">Ace-catraz!</span><span class="demo" data-act="badge">Demo</span></h1><span class="barbtns">' + (G ? '<button class="btn sm" data-act="logopen">Log</button> ' : '') + '<button class="btn sm" data-act="cards">Cards</button> <button class="btn sm" data-act="help">How to play</button> ' + (G ? '<button class="btn sm" data-act="options">Options</button> ' : '') + '<button class="btn sm" data-act="newgame">New game</button></span></header>';
  if (!G) return bar;
  return bar + '<div class="sub"><div class="chips">' + chips + '</div></div>';
}

function planHTML() {
  const md = mode();
  const mini = (O, i, st) => {
    const lvl = LV3[O.sec.level];
    if (st === 'done') return '<div class="mo done" title="Cleared"><b>' + esc(shortOf(O.sec)) + '</b><span>✓</span></div>';
    return '<div class="mo ' + (O.faceUp ? 'up' : 'down ' + O.sec.level) + '"><i>' + (i + 1) + '</i><b>' + (O.faceUp ? esc(shortOf(O.sec)) : lvl) + '</b>' + (prison() ? locksHTML(O.sec.level, 'tiny') : '') + '<span>' + (O.faceUp ? lvl : 'locked') + '</span></div>';
  };
  const big = (O, i, tag, active) => '<div class="obs ' + (active ? 'active' : '') + '"><span class="tagline">' + (i + 1) + ' · ' + tag + '</span>' +
    (O.faceUp ? secUp(O.sec) : '<div class="sec down ' + O.sec.level + (prison() ? ' pr' : '') + '"><small>' + (prison() ? 'ESCAPE PLAN' : 'LOCK SECURITY LEVEL') + '</small>' + (prison() ? locksHTML(O.sec.level, 'big') : '') + '<b>' + LEVEL[O.sec.level] + '</b></div>') + '</div>';
  const cur = G.cur, n = G.obstacles.length;
  if (G.phase === 'direction') {
    const tiles = G.obstacles.map((O) => '<div class="mo ' + (O.faceUp ? 'up' : 'down ' + O.sec.level) + ' path"><b>' + (O.faceUp ? esc(shortOf(O.sec)) : LV3[O.sec.level]) + '</b>' + (prison() ? locksHTML(O.sec.level, 'tiny') : '') + '<span>' + (O.faceUp ? LV3[O.sec.level] : 'locked') + '</span></div>').join('<span class="arrow">\u203a</span>');
    return '<section class="panel"><h2>Escape plan <small>direction not chosen yet</small></h2><div class="pathrow">' + tiles + '</div><div class="pathends"><span>\u2190 left end</span><span>right end \u2192</span></div></section>';
  }
  let html = '<div class="focusrow">';
  if (cur < n) {
    const O = G.obstacles[cur], act = true;
    const cell = (p) => {
      const rec = act && A.plantedBy(O, p.idx);
      const pick = rec && md === 'distract' ? 'pick' : '';
      const card = !act ? '' : rec ? back('mini ' + pick, pick ? 'data-act="distract-pick" data-p="' + p.idx + '"' : '') : '<div class="pc mini ghost"></div>';
      return '<div class="corner ' + (rec ? 'has' : 'empty') + ' c' + p.idx + '" style="--pc:' + AV[p.idx % 4].bg + '">' + card + '<span class="who">' + avatar(p.idx, 20) + esc(p.name) + (isMe(p) ? ' (you)' : '') + '</span></div>';
    };
    html += '<div class="cgrid">' + G.players.map(cell).join('') + '<div class="ccenter">' + big(O, cur, act ? 'Active' : 'First', act).replace('class="obs ', 'class="obs ') + '</div></div>';
    if (cur + 1 < n) html += '<div class="nextwrap">' + big(G.obstacles[cur + 1], cur + 1, G.obstacles[cur + 1].faceUp ? 'Next' : 'Locked', false) + '</div>';
  }
  html += '</div>';
  const doneT = [], lockT = [];
  for (let i = 0; i < n; i++) { if (i < cur) doneT.push(mini(G.obstacles[i], i, 'done')); else if (i >= cur + 2) lockT.push(mini(G.obstacles[i], i, 'locked')); }
  html += '<div class="lowrow"><div class="lowcol left"><div class="restlabel">Cleared (' + doneT.length + ')</div><div class="restrow">' + (doneT.join('') || '<span class="emptynote">none yet</span>') + '</div></div>' +
    '<div class="lowcol right"><div class="restlabel">Still locked (' + lockT.length + ')</div><div class="restrow">' + (lockT.join('') || '<span class="emptynote">none</span>') + '</div></div></div>';
  return '<section class="panel"><h2>Escape plan <small>' + (G.dir === 'ltr' ? 'escaping left to right' : G.dir === 'rtl' ? 'escaping right to left' : 'direction not chosen yet') + '</small></h2>' + html + '</section>';
}

function tableHTML() {
  const alarm = A.alarmVisible(G);
  const PL = { easy: ['EXTREME CAUTION', 'hard to pass', 'caution'], medium: ['MEDIUM', 'medium odds', 'med'], hard: ['RELAXED', 'easy to pass', 'relaxed'] };
  const top = G.patrol[G.patrol.length - 1];
  const lv = top ? PL[top.level] : null;
  const pile = (visual, title, sub, btn) => '<div class="pile">' + (btn ? '<button class="pilebtn" data-act="tray" title="Browse the discard piles">' + visual + '</button>' : visual) + '<b class="pt">' + title + '</b><span>' + sub + '</span></div>';
  const patDraw = pile(top ? '<div class="stack patrol ' + lv[2] + '">GUARD PATROL<b>' + lv[0] + '</b></div>' : '<div class="stack empty">empty</div>', 'Patrol deck', top ? 'next check: ' + lv[1] + '<br>' + G.patrol.length + ' left' : 'empty');
  const pd = G.patrolDiscard[G.patrolDiscard.length - 1];
  const patDisc = pile(pd ? patUp(pd, 'mini tall') : '<div class="stack empty">none</div>', 'Patrol discard', G.patrolDiscard.length + ' card' + (G.patrolDiscard.length === 1 ? '' : 's'), true);
  const fd = G.discard[G.discard.length - 1];
  const flDisc = pile(fd ? card(fd, 'pilec') : '<div class="stack empty">none</div>', 'Flashlight discard', G.discard.length + ' card' + (G.discard.length === 1 ? '' : 's'), true);
  const flDraw = pile(alarm ? '<div class="stack alarm">ALARM<br>SOUNDS</div>' : '<div class="stack flash">' + G.deck.length + '</div>', 'Flashlight deck', alarm ? 'drawing is locked' : G.deck.length + ' left');
  const lg = G.lastGuard;
  let mid = '<div class="vtxt">No guard check yet.</div>';
  if (lg) {
    const who = esc(G.players[lg.by].name);
    mid = '<div class="verdict ' + (lg.pass ? 'pass' : 'fail') + '">' + (lg.pass ? 'Pass \u2713' : 'Fail \u2717') + '</div>' +
      '<div class="vtxt sm">' + (lg.pass ? who + ' may give a hint' : who + ' stays silent') + '</div>';
  }
  return '<section class="panel"><h2>The yard</h2><div class="table">' +
    '<div class="cluster">' + patDraw + patDisc + '</div><div class="mid"><div class="lab">Guard check</div>' + mid + '</div><div class="cluster">' + flDisc + flDraw + '</div></div></section>';
}

function trayHTML() {
  const md = mode();
  if (!(ui.tray || md === 'swapA' || md === 'swapB' || md === 'patrol')) return '';
  const sw = md === 'swapA' || md === 'swapB';
  const fl = G.discard.length ? G.discard.map((c, i) => card(c, 'mini ' + (sw ? 'pick ' : '') + (sw && ui.swapA && ui.swapA.kind === 'discard' && ui.swapA.index === i ? 'sel' : ''), sw ? 'data-act="swapslot" data-k="discard" data-i="' + i + '"' : '')).join('') : '<span class="none">empty</span>';
  const pt = G.patrolDiscard.length ? G.patrolDiscard.map((s, i) => patUp(s, 'mini ' + (md === 'patrol' ? 'pick' : ''), md === 'patrol' ? 'data-act="patrol-pick" data-i="' + i + '" role="button" tabindex="0"' : '')).join('') : '<span class="none">empty</span>';
  return '<section class="panel"><h2>Discard piles <small>face-up, nobody can reshuffle them</small></h2><div class="tray"><div class="group"><b>Flashlight discard</b><div class="cards">' + fl + '</div></div>' +
    '<div class="group"><b>Patrol discard</b><div class="cards">' + pt + '</div></div></div></section>';
}

function seatHTML(p) {
  const md = mode(), O = A.active(G), test = O ? O.sec.test : null;
  const turn = !G.result && G.turn === p.idx;
  const planted = O && A.plantedBy(O, p.idx);
  const slots = p.hand.map((s, i) => {
    let inner;
    if (isMe(p)) {
      const sw = md === 'swapA' || md === 'swapB';
      const pick = md === 'plant' || sw;
      const sel = sw && isSwapSel(p.idx, i);
      inner = back((pick ? 'pick ' : '') + (sel ? 'sel' : '') + (ui.flash && ui.flash.to === p.idx && ui.flash.hand === i ? ' flash' : ''), md === 'plant' ? 'data-act="own" data-i="' + i + '"' : sw ? 'data-act="swapslot" data-k="player" data-p="' + p.idx + '" data-i="' + i + '"' : '');
    } else {
      const sw = md === 'swapA' || md === 'swapB';
      const pick = md === 'hint' || sw;
      const m = ui.assist && test && test(s.card) ? 'match ' : '';
      const fl = ui.flash && ui.flash.to === p.idx && ui.flash.hand === i ? 'flash ' : '';
      const selH = (md === 'hint' && ui.hintSel && ui.hintSel.to === p.idx && ui.hintSel.hand === i) || (sw && isSwapSel(p.idx, i)) ? 'sel ' : '';
      inner = card(s.card, m + fl + selH + (pick ? 'pick' : ''), md === 'hint' ? 'data-act="their" data-p="' + p.idx + '" data-i="' + i + '"' : sw ? 'data-act="swapslot" data-k="player" data-p="' + p.idx + '" data-i="' + i + '"' : '');
    }
    return '<div class="slot">' + inner + known(s.known, s.not) + '</div>';
  }).join('') || '<span class="mono" style="color:var(--muted)">Out of cards</span>';
  return '<div class="seat ' + (isMe(p) ? 'me ' : '') + (turn ? 'turn' : '') + '" style="--pc:' + AV[p.idx % 4].bg + '"><h3>' + avatar(p.idx, 38) + esc(p.name) + (isMe(p) ? ' (you)' : '') +
    (turn ? '<span class="st on">TURN</span>' : '') + '<span class="st ' + (planted ? 'on' : '') + '">' + (planted ? 'PLANTED' : 'NEEDS CARD') + '</span></h3>' +
    '<div class="hand">' + slots + '</div></div>';
}

function controlsHTML() {
  if (G.result) return '';
  const me = G.players[VIEW()], md = mode(), cur = G.players[G.turn];
  if (!md) return '<div class="prompt wait"><span>' + esc(cur.name) + ' is thinking…</span></div>';
  const L = A.legal(G);
  const O = A.active(G);
  const TIPS = {
    plant: 'Plant one of your face-down cards on the active obstacle without looking at it, then draw a replacement. Once everyone has planted, the cards are revealed. If even one does not match, the alarm sounds.',
    guard: 'Flip a flashlight card against the top patrol card. If it does NOT match the patrol card you pass, and you must point at a teammate\u2019s card and tell them its suit or its rank. If it matches, you stay silent.',
    distract: 'Discard a planted card you think will not match the obstacle, so that player can plant again. Costs your turn.',
    riot: 'Discard five flashlight cards (needs at least five left), then swap any two cards on the table.',
    pass: 'Do nothing this turn. Only allowed once the Alarm Sounds card is showing, or when you have no other legal action.'
  };
  const b = (act, name, key, sub) => {
    const l = L[key];
    const ok = l && l.ok;
    const tip = dk(TIPS[key]) + (ok ? '' : ' \u2014 Unavailable now: ' + (l ? l.why : ''));
    return '<button class="btn tip" data-act="' + act + '" data-tip="' + esc(tip) + '" ' + (ok ? '' : 'disabled') + '>' + name + '<small>' + esc(l && !l.ok ? l.why : sub) + '</small></button>';
  };
  const cancel = '<button class="btn sm" data-act="cancel">Cancel</button>';
  switch (md) {
    case 'choose':
      return '<div class="prompt"><span>Your turn, ' + esc(me.name) + '. Choose one action.</span></div><div class="actions">' +
        b('a-plant', 'Play my part', 'plant', 'plant a blind card, then draw') + b('a-guard', 'Guard check', 'guard', 'pass to give a hint') +
        b('a-distract', 'Distract', 'distract', 'discard a planted card') + b('a-riot', 'Riot', 'riot', 'discard 5, then swap') + b('a-pass', 'Pass', 'pass', 'alarm only') + '</div>';
    case 'direction': return '<div class="prompt"><span>Choose which end the crew starts from.</span></div>';
    case 'plant': return '<div class="prompt"><span>Pick a card to plant. You cannot look at it, so go by the hints.</span>' + cancel + '</div>';
    case 'distract': return '<div class="prompt"><span>Pick a planted card at the active obstacle to discard.</span>' + cancel + '</div>';
    case 'hint': {
      if (!ui.hintSel) return '<div class="prompt"><span>You passed the guard check. Point at a teammate’s card to give a hint.</span></div>';
      const T = G.players[ui.hintSel.to], sl = T.hand[ui.hintSel.hand], c = sl.card;
      return '<div class="prompt"><span>Tell ' + esc(T.name) + ' about card ' + (ui.hintSel.hand + 1) + ':</span><div class="hintbtns">' +
        '<button class="btn" data-act="hint-dim" data-dim="suit" ' + (sl.known.suit ? 'disabled' : '') + '>Its ' + A.DECK.suitWord + ': ' + symHTML(c.suit) + ' ' + A.SUIT_NAME[c.suit] + '</button>' +
        '<button class="btn" data-act="hint-dim" data-dim="rank" ' + (sl.known.rank ? 'disabled' : '') + '>Its ' + A.DECK.rankWord + ': ' + (prison() ? A.RANKS[c.rank - 1] + ' ' : '') + A.RANK_WORD[c.rank - 1] + '</button></div></div>';
    }
    case 'patrol': return '<div class="prompt"><span>Pick a patrol card from the discard to shuffle back into the patrol deck.</span></div>';
    case 'swapA': return '<div class="prompt"><span>Riot! Swap any two cards. Pick the first: a card in any hand (yours or a teammate\u2019s) or in the discard pile.</span></div>';
    case 'swapB': return '<div class="prompt"><span>Now pick the second card to swap with it. At least one must be from a hand.</span><button class="btn sm" data-act="swapreset">Change first card</button></div>';
    case 'post': {
      const can = A.allPlanted(G);
      return '<div class="prompt"><span>' + (can ? 'Everyone has planted a card. Break through now?' : 'Action done.') + '</span><div class="hintbtns">' +
        (can ? '<button class="btn primary" data-act="breakthrough">Breakthrough</button>' : '') + '<button class="btn" data-act="end">End turn</button></div></div>';
    }
  }
  return '';
}

function summaryDialogHTML() {
  const m = ui.summary;
  return '<div class="overlay"><div class="dialog notice sum"><div class="box"><div class="who">' + avatar(m.idx, 56) + '<h2>' + (m.since ? 'Since your last turn, ' + esc(m.name) : esc(m.name) + '’s turn') + '</h2></div>' +
    (m.card ? '<div class="xlwrap">' + card(m.card, 'xl') + '<p class="note">Planted face-down at ' + esc(m.obs.name) + '. Nobody can look at it again.</p></div>' : '') +
    '<ul class="turnlist">' + m.lines.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
    '<label class="check"><input type="checkbox" data-act="sumoff" ' + (ui.sumOff ? 'checked' : '') + '> Don’t show these ' + (ui.hot ? 'recaps' : 'summaries') + ' anymore</label>' +
    (ui.sumOff && !ui.hot ? '<label class="check sub2"><input type="checkbox" data-act="keepplant" ' + (ui.keepPlant ? 'checked' : '') + '> Still show me the card when a CPU plants one</label>' : '') +
    '<button class="btn primary" data-act="ack">OK</button></div></div></div>';
}

function dialogHTML() {
  if (ui.presenter) return presenterHTML();
  if (ui.help) return helpHTML();
  if (ui.cardsOpen) return cardsDialogHTML();
  if (G && ui.options) return optionsDialogHTML();
  if (G && ui.logOpen) return logDialogHTML();
  if (G && ui.summary) return summaryDialogHTML();
  if (G && !G.result && !ui.dialog && !ui.notice && G.phase === 'direction' && G.players[G.turn].human) return dirDialogHTML();
  if (ui.dialog === 'setup') {
    const segM = [['cpu', 'You vs CPU crew'], ['hot', 'Hotseat (pass and play)']].map((d) => '<button data-act="setmode" data-v="' + d[0] + '" aria-pressed="' + (ui.playMode === d[0]) + '">' + d[1] + '</button>').join('');
    const hotM = ui.playMode === 'hot';
    const segD = [['standard', 'Standard 52-card deck'], ['prison', 'Prison deck']].map((d) => '<button data-act="setdeck" data-v="' + d[0] + '" aria-pressed="' + (ui.deck === d[0]) + '">' + d[1] + '</button>').join('');
    const segN = [2, 3, 4].map((n) => '<button data-act="setn" data-v="' + n + '" aria-pressed="' + (ui.n === n) + '">' + n + ' players</button>').join('');
    const obs = { 2: 8, 3: 5, 4: 3 }[ui.n] + (ui.extra ? 1 : 0);
    const fan = [[1, 'S'], [12, 'H'], [1, 'D'], [11, 'C'], [13, 'S']].map((c, k) => '<div class="fc" style="transform:rotate(' + (k - 2) * 9 + 'deg) translateY(' + Math.abs(k - 2) * 4 + 'px)">' + card({ rank: c[0], suit: c[1] }, '', 'tabindex="-1"') + '</div>').join('');
    return '<div class="overlay"><div class="dialog">' +
      '<div class="hero"><h2 data-act="badge">Escape from <span class="tag">Ace-catraz!</span></h2><div class="fan">' + fan + '</div>' +
      '<div class="crew">' + [0, 1, 2, 3].map((k) => avatar(k, 44)).join('') + '</div>' +
      '<p>' + (hotM ? 'Pass the device between turns. Everyone sees their crewmates’ cards but never their own.' : 'You are Ace. You can see every crewmate’s cards but never your own.') + '</p><p class="demobadge">Playable demo by Andy Serwatuk · Feedback or publishing inquiries: games@serwatuk.ca</p></div>' +
      '<div class="box"><div class="field"><b>Cards</b><div class="seg">' + segD + '</div><p class="note">' + (ui.deck === 'prison' ? 'Standalone edition: 4 Prison Gangs × 13 Tools. Same rules, new cards.' : 'Add-on edition: any standard 52-card deck plus the 18 Security cards.') + '</p></div><div class="field"><b>Play mode</b><div class="seg">' + segM + '</div>' + (hotM ? '<p class="note">No CPU players. A cover screen hides every hand between turns.</p>' : '') + '</div><div class="field"><b>Crew size</b><div class="seg">' + segN + '</div><p class="note">' + obs + ' obstacles, ' + (ui.n - 1) + ' extra HARD card' + (ui.n > 2 ? 's' : '') + ' shuffled in</p></div>' +
      '<label class="check"><input type="checkbox" data-act="extra" ' + (ui.extra ? 'checked' : '') + '> Add one obstacle (harder, per the rules tip)</label>' +
      '<button class="btn primary" data-act="start">Start the escape</button><button class="btn" data-act="help">How to play</button></div></div></div>';
  }
  if (ui.notice) {
    const n = ui.notice;
    return '<div class="overlay"><div class="dialog notice"><div class="box"><div class="who">' + avatar(n.idx || 0, 56) + '<h2>' + esc(n.name) + ' <span>planted</span> this card</h2></div>' +
      '<div class="xlwrap">' + card(n.card, 'xl') + '</div>' +
      '<p>Placed face-down at the active obstacle (' + esc(n.obs.name) + ': ' + esc(n.obs.text.toLowerCase()) + '). Once it is down, nobody can look at it again.</p>' +
      '<button class="btn primary" data-act="ack">Got it</button></div></div></div>';
  }
  if (G && G.result && !ui.endSeen) {
    const w = G.result.won;
    const done = Math.min(G.cur, G.obstacles.length);
    return '<div class="overlay"><div class="dialog ' + (w ? 'win' : 'lose') + '"><div class="box"><h2>' + (w ? 'Freedom!' : 'Back to your cells') + '</h2><p>' + esc(G.result.reason) + '</p>' +
      '<p class="note">Obstacles cleared ' + done + '/' + G.obstacles.length + ' · guard checks ' + G.stats.guards + ' (' + G.stats.guardPass + ' passed) · hints ' + G.stats.hints + ' · riots ' + G.stats.riots + ' · distractions ' + G.stats.distracts + '</p>' +
      '<div class="actions"><button class="btn primary" data-act="again">Play again</button><button class="btn" data-act="newgame">Change setup</button><button class="btn" data-act="closeend">Look at the board</button></div></div></div></div>';
  }
  return '';
}

const MAIL = 'games@serwatuk.ca';
function footHTML() {
  return '<footer class="site"><span class="demo">Demo</span><span>A playable demo of a cooperative card game by designer Andy Serwatuk. Send feedback, or get in touch about publishing opportunities: <a href="mailto:' + MAIL + '?subject=Escape%20from%20Ace-catraz">' + MAIL + '</a></span></footer>';
}

function coverHTML() {
  const h = ui.handoff, to = G.players[h.to];
  return '<div class="cover"><div class="coverbox">' + avatar(h.to, 96) + '<h2>Pass the device to <span>' + esc(to.name) + '</span></h2>' +
    '<p>Everyone else, look away. Press Ready when you are ' + esc(to.name) + ' and it is your turn.</p>' +
    '<button class="btn primary big" data-act="ready">Ready</button></div></div>';
}

function render() {
  document.body.classList.toggle('prison', prison());
  const scroll = document.getElementById('log');
  const atBottom = !scroll || scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 30;
  if (!G) { app.innerHTML = headerHTML() + footHTML() + dialogHTML(); return; }
  tourAdvance();
  if (ui.hot && ui.handoff && !G.result) { app.innerHTML = headerHTML() + coverHTML() + footHTML() + dialogHTML(); return; }
  const view = VIEW();
  const crewSection = ui.hot
    ? '<section class="panel"><h2>The crew <small>everyone else\u2019s cards, with what each of them knows</small></h2><div class="seats crewgrid' + (G.n === 2 ? ' one' : '') + '">' + G.players.filter((p) => p.idx !== view).map(seatHTML).join('') + '</div></section>' +
      '<section class="panel handPanel"><h2>Your hand <small>' + esc(G.players[view].name) + ', you cannot see these cards</small></h2><div class="seats crewgrid one">' + seatHTML(G.players[view]) + '</div></section>'
    : '<section class="panel"><h2>Crew <small>each tag shows what that player knows about their own card</small></h2><div class="seats crewgrid">' + G.players.map(seatHTML).join('') + '</div></section>';
  app.innerHTML = headerHTML() + '<div class="wrap"><div class="main">' + planHTML() + tableHTML() + trayHTML() +
    '<section class="panel actionsPanel">' + controlsHTML() + '</section>' +
    crewSection + '</div></div>' + footHTML() + (ui.tour ? '<div style="height:190px"></div>' : '') + dialogHTML() + tourHTML();
  const lg = document.getElementById('log');
  if (lg && atBottom) lg.scrollTop = lg.scrollHeight;
  tourAfterRender();
  const ack = document.querySelector('[data-act=ack]');
  if (ack) ack.focus();
}

function doApply(a) {
  const O = A.active(G);
  let notice = null;
  if (a.type === 'plant') {
    const pl = G.players[G.turn];
    if (!pl.human && pl.hand[a.hand]) notice = { name: pl.name, card: pl.hand[a.hand].card, obs: O.sec, idx: pl.idx };
  }
  const actor = G.turn, actorP = G.players[actor];
  const before = a.type === 'breakthrough' && O ? O.planted.map((r) => ({ player: r.player, card: r.card })) : null;
  const r = A.apply(G, a);
  if (!r.ok) { console.warn(a, r.why); return r; }
  if (ui.tour && actorP.human) ui.tour.seen[a.type] = true;
  if (notice) { if (ui.summaries) ui.turnPlant = notice; else if (ui.plantPopup) ui.notice = notice; }
  if (G.turn !== actor || G.result) {
    if (!actorP.human && ui.summaries) {
      ui.summary = { name: actorP.name, idx: actor, lines: G.log.slice(ui.turnStart).map((l) => l.text), card: ui.turnPlant ? ui.turnPlant.card : null, obs: ui.turnPlant ? ui.turnPlant.obs : null };
    }
    if (ui.hot && !G.result) {
      ui.handoff = { from: actor, to: G.turn };
      ui.lastEnd[actor] = G.log.length;
      const since = ui.lastEnd[G.turn] != null ? ui.lastEnd[G.turn] : ui.startLog;
      ui.pendingSummary = ui.summaries ? { name: G.players[G.turn].name, idx: G.turn, since: true, lines: G.log.slice(since).map((l) => l.text), card: null, obs: null } : null;
    }
    ui.turnStart = G.log.length; ui.turnPlant = null;
  }
  ui.flash = a.type === 'hint' ? { to: a.to, hand: a.hand } : null;
  if (before) ui.reveal = { ok: G.lastBreak.ok, items: before };
  ui.sel = null; ui.hintSel = null; if (a.type === 'riotSwap') ui.swapA = null;
  return r;
}

function schedule() {
  clearTimeout(timer);
  if (!G || G.result || ui.dialog || ui.notice || ui.help || ui.summary || ui.options || ui.logOpen || ui.cardsOpen || ui.presenter || ui.handoff) return;
  const p = G.players[G.turn];
  if (p.human) {
    if (!ui.hot && G.phase === 'post' && !A.allPlanted(G)) timer = setTimeout(() => { doApply({ type: 'end' }); render(); schedule(); }, 1100);
    return;
  }
  timer = setTimeout(() => {
    const a = CPU.decide(G);
    if (!a) return;
    doApply(a); render(); schedule();
  }, ui.speed);
}
function go(a) { const r = doApply(a); render(); schedule(); return r; }

/* ---------- Presenter tools (hidden): pitch position and guided tour ---------- */
function presenterHTML() {
  return '<div class="overlay"><div class="dialog notice"><div class="box"><h2>Presenter tools</h2>' +
    '<p>Hidden from the public view. Tap the “Demo” badge (or the title on the start screen) five times, or add <b>?demo</b> or <b>?tour</b> to the address.</p>' +
    '<div class="actions"><button class="btn primary" data-act="loaddemo">Load pitch position<small>4 players, mid-game, your move</small></button>' +
    '<button class="btn" data-act="starttour">Start guided tour<small>2 players, fresh game, coach marks</small></button></div>' +
    '<button class="btn sm" data-act="presclose">Close</button></div></div></div>';
}
function loadDemo() {
  const D = window.DEMO; if (!D) return;
  clearTimeout(timer);
  ui.presenter = false; ui.tour = null; ui.hot = false; ui.handoff = null; ui.pendingSummary = null; ui.lastEnd = {};
  G = A.newGame({ n: D.n, seed: D.seed, human: [true, false, false, false] });
  for (const a of D.acts) A.apply(G, a);
  ui.n = D.n; ui.dialog = null; ui.notice = null; ui.summary = null; ui.turnPlant = null; ui.turnStart = G.log.length; ui.startLog = 0;
  ui.sumOff = false; ui.keepPlant = true; ui.endSeen = false; ui.sel = null; ui.swapA = null; ui.hintSel = null; ui.reveal = null; ui.flash = null; ui.tray = false;
  ui.logOpen = false; ui.help = false; ui.cardsOpen = false; ui.options = false;
  render(); schedule(); window.scrollTo(0, 0);
}
const TOUR = [
  { t: 'Welcome to the escape. You are Ace, one of the inmates. You can see every crewmate’s cards but never your own. Let me show you the table.' },
  { t: 'First, choose which end of the plan the crew starts from. Either way works; it just sets the order of the obstacles.', when: () => G.phase !== 'direction' },
  { sel: '.main > section.panel:nth-of-type(1)', t: 'This is the escape plan. The big card is the active obstacle: everyone must plant a matching card there. The next one is on deck, cleared ones sit lower left, locked ones lower right.' },
  { sel: '.main > section.panel:nth-of-type(2)', t: 'The yard holds the flashlight deck, the patrol deck and the guard-check area. Flashlight cards are what you draw and plant.' },
  { sel: '.main > section.panel:last-child', t: 'The crew. Your teammates’ cards are face-up to you; yours are hidden. The small tags show what each player has been told about their own card.' },
  { sel: '.actionsPanel', t: 'Your turn. Try “Play my part”: tap it, then tap one of your own cards to plant it blind. Hover over any action for a tooltip.', when: () => ui.tour.seen.plant },
  { sel: '.actionsPanel', t: 'Planted face-down. Now the CPU crew take their turns, and a short recap appears after each. Tap OK to carry on.', when: () => ui.tour.seen.plant && G.turn === 0 && G.phase === 'action' && !ui.summary && !ui.notice },
  { sel: '.actionsPanel', t: 'Try a Guard check. Flip a flashlight card: if it does not match the patrol card you pass and get to give a hint; if it matches, you stay silent.', when: () => ui.tour.seen.guard },
  { sel: '.crewgrid', t: 'You passed! Point at a teammate’s card and tell them its suit or rank. Hints are the only way anyone learns what they are holding. Silence teaches things too.', when: () => ui.tour.seen.hint || G.phase !== 'hint' },
  { sel: '.barbtns', t: 'Log replays everything, Cards shows every obstacle and patrol card (with a flip), How to play opens the rulebook, and Options has the CPU speed.' },
  { t: 'That is the whole loop: plant, guard check, hint. Clear every obstacle before the alarm ends the escape. Good luck!', last: true },
];
function startTour() {
  clearTimeout(timer);
  ui.presenter = false; ui.n = 2; ui.playMode = 'cpu'; ui.extra = false;
  startGame();
  ui.tour = { i: 0, seen: {}, shown: -1 };
  render();
}
function tourAdvance() {
  const T = ui.tour; if (!T) return;
  let guard = 0;
  while (T.i < TOUR.length - 1 && TOUR[T.i].when && TOUR[T.i].when() && guard++ < 12) T.i++;
}
function tourHTML() {
  const T = ui.tour; if (!T || !G) return '';
  const st = TOUR[T.i];
  return '<div class="tour"><div class="tourstep">Tour · step ' + (T.i + 1) + ' of ' + TOUR.length + '</div><p>' + esc(dk(st.t)) + '</p><div class="tourrow">' +
    '<button class="btn sm" data-act="tourquit">' + (st.last ? 'Close' : 'End tour') + '</button>' +
    (st.last ? '' : '<button class="btn sm primary" data-act="tournext">' + (st.when ? 'Skip step' : 'Next') + '</button>') + '</div></div>';
}
function tourAfterRender() {
  document.querySelectorAll('.tourhl').forEach((e) => e.classList.remove('tourhl'));
  const T = ui.tour; if (!T) return;
  const st = TOUR[T.i];
  if (!st.sel) return;
  const el = document.querySelector(st.sel);
  if (!el) return;
  el.classList.add('tourhl');
  if (T.shown !== T.i) { T.shown = T.i; try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {} }
}
let badgeTaps = [];

function startGame() {
  A.setDeck(ui.deck);
  ui.hot = ui.playMode === 'hot'; ui.handoff = null; ui.pendingSummary = null; ui.lastEnd = {};
  const human = ui.hot ? [true, true, true, true] : [true, false, false, false];
  G = A.newGame({ n: ui.n, extra: ui.extra, human });
  ui.dialog = null; ui.notice = null; ui.summary = null; ui.turnPlant = null; ui.turnStart = G.log.length; ui.startLog = G.log.length; ui.sumOff = false; ui.keepPlant = true; ui.endSeen = false; ui.sel = null; ui.swapA = null; ui.hintSel = null; ui.reveal = null; ui.flash = null; ui.tray = false;
  save(); render(); schedule();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const d = el.dataset, md = mode();
  switch (d.act) {
    case 'badge': { const now = Date.now(); badgeTaps = badgeTaps.filter((t) => now - t < 3000); badgeTaps.push(now); if (badgeTaps.length >= 5) { badgeTaps = []; ui.presenter = true; render(); } return; }
    case 'presclose': ui.presenter = false; render(); schedule(); return;
    case 'loaddemo': loadDemo(); return;
    case 'starttour': startTour(); return;
    case 'tournext': if (ui.tour) { ui.tour.i = Math.min(TOUR.length - 1, ui.tour.i + 1); render(); } return;
    case 'tourquit': ui.tour = null; render(); return;
    case 'setdeck': ui.deck = d.v; A.setDeck(ui.deck); save(); render(); return;
    case 'setmode': ui.playMode = d.v; save(); render(); return;
    case 'ready': ui.handoff = null; ui.summary = ui.pendingSummary; ui.pendingSummary = null; render(); schedule(); return;
    case 'setn': ui.n = +d.v; render(); return;
    case 'dir': go({ type: 'direction', dir: d.v }); return;
    case 'setspeed': ui.speed = +d.v; save(); render(); return;
    case 'extra': ui.extra = el.checked; render(); return;
    case 'assist': ui.assist = el.checked; save(); render(); return;
    case 'start': case 'again': startGame(); return;
    case 'newgame': clearTimeout(timer); ui.dialog = 'setup'; render(); return;
    case 'cards': ui.cardsOpen = true; render(); return;
    case 'closecards': ui.cardsOpen = false; render(); schedule(); return;
    case 'flipcards': ui.cardSide = ui.cardSide === 'plan' ? 'patrol' : 'plan'; render(); return;
    case 'help': ui.help = true; render(); return;
    case 'closehelp': ui.help = false; render(); schedule(); return;
    case 'ack':
      if (ui.summary && ui.sumOff) { ui.summaries = false; ui.plantPopup = ui.keepPlant; save(); }
      ui.notice = null; ui.summary = null; ui.sumOff = false; ui.keepPlant = true; render(); schedule(); return;
    case 'sumoff': ui.sumOff = el.checked; render(); return;
    case 'keepplant': ui.keepPlant = el.checked; render(); return;
    case 'logopen': ui.logOpen = true; render(); return;
    case 'closelog': ui.logOpen = false; render(); schedule(); return;
    case 'options': ui.options = true; render(); return;
    case 'closeopt': ui.options = false; render(); schedule(); return;
    case 'opt-summaries': ui.summaries = el.checked; save(); render(); return;
    case 'opt-not': ui.showNot = el.checked; save(); render(); return;
    case 'opt-plant': ui.plantPopup = el.checked; save(); render(); return;
    case 'closeend': ui.endSeen = true; render(); return;
    case 'tray': ui.tray = !ui.tray; render(); return;
    case 'cancel': ui.sel = null; render(); return;
    case 'a-plant': ui.sel = 'plant'; render(); return;
    case 'a-distract': ui.sel = 'distract'; render(); return;
    case 'a-guard': go({ type: 'guard' }); return;
    case 'a-riot': go({ type: 'riot' }); return;
    case 'a-pass': go({ type: 'pass' }); return;
    case 'breakthrough': go({ type: 'breakthrough' }); return;
    case 'end': go({ type: 'end' }); return;
    case 'own': if (md === 'plant') go({ type: 'plant', hand: +d.i }); return;
    case 'swapreset': ui.swapA = null; render(); return;
    case 'swapslot': {
      if (md !== 'swapA' && md !== 'swapB') return;
      const l = d.k === 'discard' ? { kind: 'discard', index: +d.i } : { kind: 'player', player: +d.p, hand: +d.i };
      const a = ui.swapA;
      if (!a) { ui.swapA = l; render(); return; }
      const same = a.kind === l.kind && (l.kind === 'discard' ? a.index === l.index : a.player === l.player && a.hand === l.hand);
      if (same) { ui.swapA = null; render(); return; }
      if (a.kind === 'discard' && l.kind === 'discard') return;
      go({ type: 'riotSwap', a, b: l });
      return;
    }
    case 'their':
      if (md === 'hint') { ui.hintSel = { to: +d.p, hand: +d.i }; render(); }
      return;
    case 'hint-dim': if (ui.hintSel) go({ type: 'hint', to: ui.hintSel.to, hand: ui.hintSel.hand, dim: d.dim }); return;
    case 'distract-pick': if (md === 'distract') go({ type: 'distract', player: +d.p }); return;
    case 'patrol-pick': if (md === 'patrol') go({ type: 'distractPatrol', index: +d.i }); return;
  }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.pat[data-act]')) { e.preventDefault(); e.target.click(); }
});

try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
const q = (location.search + location.hash).toLowerCase();
if (/demo/.test(q) && window.DEMO) loadDemo();
else if (/tour/.test(q)) startTour();
else render();
})();
</script>
