/* Layout: green title bar, pale blue-grey board, white rounded panels, chunky 3D buttons, cartoon inmates. Light look by choice. */
:root {
  --bg: #eef1f6; --panel: #ffffff; --panel2: #f3f6fa; --line: #d5dbe4; --line2: #e4e9f0;
  --ink: #1b2a36; --muted: #5b6b7a; --green: #1f6b50; --green-d: #15503b; --tint: #eaf3ee; --glow: #19b57a;
  --red: #e0323f; --red-d: #b3222d; --amber: #f2a516; --amber-bg: #fff1cf; --amber-ink: #8a5a00;
  --plan: #aef2d4; --plan-ink: #064a36; --patrol: #ffc9c9; --patrol-ink: #7a0f0f;
  --card: #fbfaf5; --cardred: #c8283c; --cardblack: #1b1f24; --back1: #1f3a8a; --back2: #dbe4ff;
  --f: 'Figtree', 'Nunito', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 500 15px/1.4 var(--f); padding-inline: 16px; padding-block: 12px 40px; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.rd { color: var(--cardred); }

/* Title bar */
.bar { margin: -12px -16px 14px; padding: 10px 16px; background: var(--green); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar h1 { font-size: 22px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag { display: inline-block; background: var(--red); color: #fff; font-style: italic; font-weight: 900; padding: 2px 10px; border-radius: 6px; transform: rotate(-2deg); box-shadow: 0 2px 0 var(--red-d); text-transform: uppercase; }
.sub { max-width: 1100px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-weight: 700; font-size: 13px; padding: 5px 12px; border: 2px solid var(--line); border-radius: 999px; background: var(--panel); white-space: nowrap; color: var(--muted); }
.chip b { color: var(--green); font-weight: 800; }
.chip.alarm { border-color: var(--red); color: var(--red); background: #fff1f2; }
.chip.alarm b { color: var(--red); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 600; }
.check input { margin-top: 3px; accent-color: var(--green); width: 16px; height: 16px; }
.sub .check { color: var(--muted); font-size: 13px; align-items: center; }

.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.main { display: grid; gap: 14px; min-width: 0; }
@media (max-width: 960px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

/* Buttons: chunky, with a thick bottom edge */
.btn { border: 2px solid var(--line); border-bottom-width: 4px; background: var(--panel); padding: 8px 16px; border-radius: 12px; font-weight: 800; transition: transform .08s; }
.btn:hover:not(:disabled) { border-color: var(--green); }
.btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--green); color: #fff; border-color: var(--green-d); }
.btn.primary:hover:not(:disabled) { background: #257a5c; }
.btn.sm { padding: 5px 12px; font-size: 13px; border-radius: 10px; }
.bar .btn { color: var(--green-d); }

section.panel { background: var(--panel); border: 1px solid var(--line2); border-radius: 18px; padding: 14px 16px; min-width: 0; box-shadow: 0 1px 2px rgba(20, 40, 60, .06); }
.panel > h2 { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel > h2 small { font-size: 12px; letter-spacing: 0; text-transform: none; font-weight: 600; }

/* Escape plan */
.obs { flex: 0 0 auto; width: 132px; display: grid; gap: 6px; justify-items: center; }
.sec { width: 132px; height: 164px; border-radius: 14px; border: 3px solid #000; overflow: hidden; position: relative; }
.sec.up { background: var(--plan); color: var(--plan-ink); text-align: center; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
.sec .pill { font-weight: 900; font-size: 9px; letter-spacing: .1em; padding: 3px 8px; border-radius: 999px; background: #065f46; color: #d1fae5; }
.sec .nm { font-weight: 900; font-size: 24px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
.sec .match { background: #fff; border: 1.5px solid #065f46; border-radius: 6px; padding: 4px 4px 5px; font-weight: 800; font-size: 11px; line-height: 1.2; width: 100%; }
.sec .match i { display: block; font-style: normal; font-size: 8px; letter-spacing: .1em; color: #065f46; }
.sec .lvl { font-weight: 800; font-size: 9px; letter-spacing: .08em; border: 1px solid #065f46; border-radius: 999px; padding: 1px 8px; background: #6ee7b7; }
.sec.down { background: linear-gradient(#17261f, #0f3a2c); color: #6ee7b7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.sec.down small { font-weight: 800; font-size: 9px; letter-spacing: .12em; opacity: .85; }
.sec.down b { font-weight: 900; font-size: 24px; letter-spacing: .02em; }
.sec.down.medium { color: #f4c470; } .sec.down.hard { color: #ff8f8f; }
.obs.active .sec { box-shadow: 0 0 0 4px var(--glow), 0 6px 18px rgba(25, 181, 122, .35); }
.obs.done .sec { height: 56px; opacity: .6; background: var(--panel2); color: var(--muted); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; border-color: var(--line); }
.obs .tagline { font-weight: 800; font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.obs.active .tagline { color: var(--green); }
.corners { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 60px; }
.corner { display: grid; gap: 3px; justify-items: center; font-weight: 700; font-size: 11px; color: var(--muted); }
.corner .who { display: flex; align-items: center; gap: 4px; }
.corner.empty .pc { opacity: .35; background: transparent; border: 2px dashed var(--line); }
.corner.empty .pc::after { display: none; }

/* Cards */
.pc { width: 52px; height: 74px; border-radius: 8px; border: 1.5px solid #0004; background: var(--card); position: relative; padding: 0; color: var(--cardblack); flex: 0 0 auto; user-select: none; box-shadow: 0 2px 0 rgba(20, 40, 60, .18); }
.pc.red { color: var(--cardred); }
.pc .r { position: absolute; left: 5px; top: 3px; font-weight: 900; font-size: 15px; line-height: 1; }
.pc .s { position: absolute; left: 5px; top: 18px; font-size: 13px; line-height: 1; }
.pc .big { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; padding-top: 14px; }
.pc.back { background: repeating-linear-gradient(45deg, var(--back1) 0 5px, #2a4aa8 5px 7px); border: 3px solid var(--back2); }
.pc.back::after { content: ''; position: absolute; inset: 8px; border: 1.5px solid var(--back2); border-radius: 4px; opacity: .6; }
.pc.mini { width: 36px; height: 52px; border-radius: 6px; }
.pc.mini .r { font-size: 11px; left: 3px; top: 2px; } .pc.mini .s { font-size: 9px; left: 3px; top: 13px; } .pc.mini .big { font-size: 20px; padding-top: 10px; }
.pc.pick { cursor: pointer; box-shadow: 0 0 0 3px var(--glow); transform: translateY(-3px); transition: transform .12s; }
.pc.pick:hover { transform: translateY(-7px); }
.pc.sel { box-shadow: 0 0 0 3px var(--amber); transform: translateY(-8px); }
.pc.match { outline: 3px solid var(--glow); outline-offset: 2px; }
.pc.flash { animation: flash 1.2s ease 2; }
@keyframes flash { 50% { box-shadow: 0 0 0 4px var(--amber), 0 0 18px var(--amber); } }
@media (prefers-reduced-motion: reduce) { .pc.flash { animation: none; box-shadow: 0 0 0 3px var(--amber); } .pc.pick, .btn { transition: none; } }
.hand { display: flex; gap: 10px; flex-wrap: wrap; }
.slot { display: grid; gap: 5px; justify-items: center; }
.known { font-weight: 800; font-size: 11px; min-height: 18px; padding: 1px 8px; border-radius: 999px; background: var(--panel2); color: var(--muted); white-space: nowrap; border: 1px solid var(--line2); }
.known.has { color: var(--amber-ink); background: var(--amber-bg); border-color: #f3d58e; }
.known.exact { color: var(--green-d); background: var(--tint); border-color: #b8dccb; }

/* Table */
.table { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-start; }
.pile { display: grid; gap: 5px; justify-items: center; font-weight: 700; font-size: 12px; color: var(--muted); text-align: center; max-width: 120px; }
.pile .stack { width: 62px; height: 86px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; font-size: 22px; color: #fff; box-shadow: 0 3px 0 rgba(20, 40, 60, .2); }
.pile .stack.flash { background: repeating-linear-gradient(45deg, var(--back1) 0 5px, #2a4aa8 5px 7px); border: 3px solid var(--back2); }
.pile .stack.patrol { width: 96px; background: #2a1010; border: 3px solid #000; color: #ff8f8f; font-weight: 800; font-size: 10px; line-height: 1.3; letter-spacing: .08em; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.pile .stack.patrol b { font-weight: 900; font-size: 16px; line-height: 1.05; letter-spacing: .02em; padding: 0 4px; }

  const readyO = (I) => I.certO.some(Boolean), readyN = (I) => I.certN.some(Boolean);
  const gain = (owner, inc, out) => {
    const I = info[owner];
    let v = 0;
    if (!I.planted) {
      v += inc.pm * (readyO(I) ? 1 : 10);
      if (out.certO) v -= I.certO.some((c, i) => c && i !== out.slot) ? 1 : 10;
      else v -= 1.5 * out.pm;
    }
    if (N) { v += inc.pn * (readyN(I) ? 0.3 : 2.5); v -= 0.8 * out.pn; }
    return v;
  };
  const spots = [];
  G.players.forEach((q) => q.hand.forEach((s, k) => spots.push(loc('player', q.idx, k))));
  const discs = G.discard.map((c, i) => loc('discard', i));
  let best = null;
  const consider = (x, y, score) => { if (!best || score > best.score) best = { score, a: x.l, b: y.l }; };
  for (let i = 0; i < spots.length; i++) {

  }

}

function decidePatrolPick(G, p) {
  const pool = A.poolFor(G, p);
  const idx = argmax(G.patrolDiscard, (pc) => frac(pool, (c) => !pc.test(c)));
  return { type: 'distractPatrol', index: idx };

function someoneElseCanBreak(G, p) {
  const O = A.active(G);
  for (const q of G.players) {
    if (q.idx === p) continue;
    const rec = A.plantedBy(O, q.idx);

function decideDirection(G) {
  // Tackle the hardest locks first, while the flashlight deck is full.
  const w = { easy: 1, medium: 2, hard: 3 };
  const n = G.obstacles.length;

    case 'hint': return decideHint(G, p);
    case 'riotSwap': return decideSwap(G, p);
    case 'distractPatrol': return decidePatrolPick(G, p);
    case 'post': return decidePost(G, p);

}

\/p><\/div>\n  <div class=\"box\"><h3>Goal<\/h3><p>The crew wins if it successfully completes <b>the entire escape plan<\/b>: every obstacle cleared, one card from every player each time.<\/p><p>One wrong card trips the alarm and <b>everyone<\/b> goes back to their cells.<\/p><\/div>\n <\/div>\n <div class=\"box\"><h3>Components<\/h3>\n  <div class=\"row\" style=\"gap:22px;align-items:flex-end\">\n   <div class=\"deck\"><div class=\"row\" style=\"gap:4px\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>RED<\/b><em>MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>Q, K<\/b><em>MATCH<\/em><span>QUEEN OR KING<\/span><u class=\"hard\">HARD<\/u><\/div><\/div><small>17 Security cards<br>(two-sided: obstacle / guard check)<\/small><\/div>\n   <div class=\"deck\"><div class=\"sc alarm s\"><i>ALARM SOUNDS<\/i><b>🚨<\/b><span>Drawing LOCKED. Pass allowed.<\/span><\/div><small>1 Alarm Sounds card<\/small><\/div>\n   <div class=\"deck\"><div class=\"stackc\"><div class=\"pc back d3\"><\/div><div class=\"pc back d2\"><\/div><div class=\"pc back \"><\/div><\/div><small>52-card deck, no jokers<br>(not included)<\/small><\/div>\n  <\/div>\n<\/div>\n <div class=\"box\" style=\"padding:9px 14px\"><h3>The three kinds of Security cards<\/h3>\n  <div class=\"cols c3\" style=\"gap:8px\">\n   <div class=\"row\" style=\"justify-content:flex-start;gap:10px\"><div class=\"sc down easy s\"><small>LOCK SECURITY LEVEL<\/small><b>EASY<\/b><\/div><div><b style=\"color:#1fa38a\">EASY<\/b> × 6<br><span style=\"font-size:8.8pt\">Match half the deck, such as <i>odd<\/i>, <i>red<\/i> or <i>high<\/i>.<\/span><\/div><\/div>\n   <div class=\"row\" style=\"justify-content:flex-start;gap:10px\"><div class=\"sc down medium s\"><small>LOCK SECURITY LEVEL<\/small><b>MEDIUM<\/b><\/div><div><b style=\"color:#e08a00\">MEDIUM<\/b> × 6<br><span style=\"font-size:8.8pt\">One suit, or a group of ranks such as <i>face cards<\/i>.<\/span><\/div><\/div>\n   <div class=\"row\" style=\"justify-content:flex-start;gap:10px\"><div class=\"sc down hard s\"><small>LOCK SECURITY LEVEL<\/small><b>HARD<\/b><\/div><div><b style=\"color:#d23b4a\">HARD<\/b> × 5<br><span style=\"font-size:8.8pt\">Only two ranks match, such as <i>8 or 9<\/i>.<\/span><\/div><\/div>\n  <\/div><\/div>\n <div class=\"foot\"><span>Escape from Ace-catraz · Rules<\/span><span>1<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><div class=\"n\">1<\/div><h2>Setup<\/h2><small>Before you play<\/small><\/div>\n <div class=\"cols c21\">\n  <div class=\"box\">\n   <div class=\"step\"><div class=\"n\">1<\/div><div><b>Build the Escape Plan.<\/b> Set the <b>HARD<\/b> cards and the Alarm card aside. Add <b>1<\/b> (2 players), <b>2<\/b> (3 players) or <b>3<\/b> (4 players) HARD cards to the Easy and Medium cards, and shuffle. Deal this deck face down in a line in the centre to make the <b>Obstacles<\/b> (see the table).<\/div><\/div>\n   <div class=\"step\"><div class=\"n\">2<\/div><div><b>Create the Patrol Deck.<\/b> Shuffle the unused HARD cards into the remaining Security cards. Place this deck next to the Flashlight Deck.<\/div><\/div>\n   <div class=\"step\"><div class=\"n\">3<\/div><div><b>Peek at the lock levels, then choose your escape path.<\/b> Look at the Lock Security Level shown on the back of each Obstacle, then agree on a direction: <b>left-to-right<\/b> or <b>right-to-left<\/b>. Flip the first two Obstacles from that end face up. The first is the <b>active<\/b> Obstacle. Start with the hard ones, or save them for later. It’s your call.<\/div><\/div>\n   <div class=\"step\"><div class=\"n\">4<\/div><div><b>Prepare the Flashlight Deck.<\/b> Shuffle the 52 cards, then place them face down on top of the Alarm Sounds card (a 53-card deck).<\/div><\/div>\n   <div class=\"step\"><div class=\"n\">5<\/div><div><b>Prep the crew.<\/b> Deal 5 cards from the top of the Flashlight Deck to each player. <b>No peeking at your own cards.<\/b> Hold them facing outward.<\/div><\/div>\n  <\/div>\n  <div style=\"display:grid;gap:12px;align-content:start\">\n   <div class=\"box\"><h3>Obstacles by player count<\/h3><table><tr><th>Players<\/th><th>Obstacles<\/th><th>HARD added<\/th><\/tr><tr><td><svg class=\"av\" width=\"22\" height=\"22\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av4\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av4)\"><rect width=\"80\" height=\"80\" fill=\"#f2a516\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#f6c9a0\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#f6c9a0\"/><path d=\"M20 36 Q20 14 40 14 Q60 14 60 36 Z\" fill=\"#e23d4a\"/><rect x=\"18\" y=\"32\" width=\"44\" height=\"8\" rx=\"4\" fill=\"#fff\"/><circle cx=\"40\" cy=\"12\" r=\"4\" fill=\"#fff\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg> 2<\/td><td><b>8<\/b><\/td><td>1<\/td><\/tr><tr><td><svg class=\"av\" width=\"22\" height=\"22\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av5\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av5)\"><rect width=\"80\" height=\"80\" fill=\"#f2a516\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" pse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#8d5a3c\"/><ellipse cx=\"32\" cy=\"24\" rx=\"5\" ry=\"3\" fill=\"#fff\" opacity=\".45\" transform=\"rotate(-30 32 24)\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><div class=\"row\" style=\"gap:2px\"><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><\/div><\/div><div style=\"display:grid;gap:3px;justify-items:center\"><svg class=\"av\" width=\"32\" height=\"32\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av13\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av13)\"><rect width=\"80\" height=\"80\" fill=\"#7a4fd1\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#f6d3b3\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#f6d3b3\"/><path d=\"M22 30 L22 14 L31 22 L40 10 L49 22 L58 14 L58 30 Z\" fill=\"#f7c928\" stroke=\"#c99a00\" stroke-width=\"2\" stroke-linejoin=\"round\"/><rect x=\"22\" y=\"28\" width=\"36\" height=\"5\" fill=\"#f7c928\" stroke=\"#c99a00\" stroke-width=\"2\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><div class=\"row\" style=\"gap:2px\"><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><\/div><\/div><\/div>\n  <div class=\"cap\">Each inmate holds five cards. The backs shown here face the player; everyone else sees the fronts.<\/div><\/div>\n <div class=\"box\"><h3>The big twist: you can’t see your own hand<\/h3>\n  <div class=\"row\" style=\"gap:30px\">\n   <div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"lab\">What your crew sees<\/div><div class=\"row\" style=\"gap:3px\"><div class=\"pc red sm\"><span class=\"r\">7<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><div class=\"pc sm\"><span class=\"r\">A<\/span><span class=\"s\">♠<\/span><span class=\"big\">♠<\/span><\/div><div class=\"pc red sm\"><span class=\"r\">Q<\/span><span class=\"s\">♦<\/span><span class=\"big\">♦<\/span><\/div><div class=\"pc sm\"><span class=\"r\">4<\/span><span class=\"s\">♣<\/span><span class=\"big\">♣<\/span><\/div><div class=\"pc sm\"><span class=\"r\">9<\/span><span class=\"s\">♠<\/span><span class=\"big\">♠<\/span><\/div><\/div><\/div>\n   <div style=\"font-size:22pt\">↔<\/div>\n   <div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"lab\">What you see<\/div><div class=\"row\" style=\"gap:3px\"><div class=\"pc back sm\"><\/div><div class=\"pc back sm\"><\/div><div class=\"pc back sm\"><\/div><div class=\"pc back sm\"><\/div><div class=\"pc back sm\"><\/div><\/div><\/div>\n  <\/div>\n  <p class=\"cap\" style=\"text-align:center;margin-top:4px;color:var(--muted);font-size:8.5pt\">Your teammates give you hints (a suit or a rank) through Guard Checks. Keep track of what you’ve been told.<\/p><\/div>\n <div class=\"foot\"><span>Escape from Ace-catraz · Rules<\/span><span>2<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><div class=\"n\">2<\/div><h2>On your turn<\/h2><small>Choose one action, then optionally Breakthrough<\/small><\/div>\n <div class=\"row\" style=\"gap:10px\"><div class=\"box\" style=\"flex:1;text-align:center\"><b>1.<\/b> Perform <b>one<\/b> of the five actions<\/div><div class=\"arrow\">›<\/div><div class=\"box\" style=\"flex:1;text-align:center\"><b>2.<\/b> Optionally attempt a <b>Breakthrough<\/b><\/div><\/div>\n <div class=\"action\"><h4><span>1<\/span>Play my part<\/h4>\n  <div class=\"row\" style=\"justify-content:space-between;gap:14px;align-items:center\">\n   <div><ol style=\"padding-left:16px\"><li>Choose a card from your hand <b>without looking at it<\/b>. Place it face down on an <b>unoccupied corner of the active Obstacle<\/b>.<\/li><li>Draw a card from the Flashlight Deck into your hand. Keep it facing away from you.<\/li><\/ol><\/div>\n   <div class=\"row\" style=\"gap:6px\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>RED<\/b><em>MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><u class=\"easy\">EASY<\/u><\/div><div style=\"display:grid;grid-template-columns:auto auto;gap:4px\"><div class=\"pc back sm\"><\/div><div class=\"pc back sm\"><\/div><div class=\"pc sm\" style=\"border:2px dashed #aab;background:transparent;box-shadow:none\"><\/div><div class=\"pc sm\" style=\"border:2px dashed #aab;background:transparent;box-shadow:none\"><\/div><\/div><\/div>\n  <\/div><\/div>\n <div class=\"action\"><h4><span>2<\/span>Perform a Guard check<\/h4>\n  <div class=\"row\" style=\"justify-content:space-between;gap:14px\">\n   <div><ol style=\"padding-left:16px\"><li>Flip the top <b>Patrol<\/b> card and the top <b>Flashlight<\/b> card.<\/li><li>Compare the Flashlight card against the Patrol card’s criteria.<ul><li><b class=\"bad\">Fail:<\/b> the card <i>matches<\/i> the “DO NOT MATCH” line. Stay silent. Your turn is over.<\/li><li><b class=\"ok\">Pass:<\/b> the card does <i>not<\/i> match. Point to a card in a teammate’s hand and say either its <b>suit<\/b> or its <b>rank<\/b>.<\/li><\/ul><\/li><li>Discard both revealed cards.<\/li><\/ol><\/div>\n  <\/div>\n  <div class=\"cols c2\" style=\"margin-top:8px\">\n   <div class=\"diag\" style=\"background:#f3f6fa;padding:8px\"><div class=\"row\" style=\"gap:8px\"><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><\/div><span class=\"lab\">vs<\/span><div class=\"pc \"><span class=\"r\">7<\/span><span class=\"s\">♠<\/span><span class=\"big\">♠<\/span><\/div><div style=\"font-weight:900;font-size:9.5pt\" class=\"ok\">PASS ✓<br><span style=\"font-weight:600;color:var(--ink)\">7♠ is not red.<br>Give a hint!<\/span><\/div><\/div><\/div>\n   <div class=\"diag\" style=\"background:#f3f6fa;padding:8px\"><div class=\"row\" style=\"gap:8px\"><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><\/div><span class=\"lab\">vs<\/span><div class=\"pc red \"><span class=\"r\">Q<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><div style=\"font-weight:900;font-size:9.5pt\" class=\"bad\">FAIL ✗<br><span style=\"font-weight:600;color:var(--ink)\">Q♥ is red.<br>Say nothing.<\/span><\/div><\/div><\/div>\n  <\/div>\n  <div class=\"call warn\" style=\"margin-top:8px\"><b>Reading the Patrol card:<\/b> the card’s coloured label tells you how risky the check is. <b>Extreme caution<\/b> (the card’s obstacle side is Easy) is hard to pass because it forbids half the deck. <b>Relaxed<\/b> (the card’s obstacle side is Hard) is easy to pass because it only forbids a couple of ranks. The top of the Patrol deck always shows how tough the next check is.<\/div>\n <\/div>\n <div class=\"box\" style=\"padding:8px 14px\"><h3>Hints, in practice<\/h3><div class=\"row\" style=\"gap:16px\"><div style=\"display:grid;gap:4px;justify-items:center\"><svg class=\"av\" width=\"36\" height=\"36\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av14\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av14)\"><rect width=\"80\" height=\"80\" fill=\"#e23d4a\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#c68a5e\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#c68a5e\"/><path d=\"M20 36 L22 16 L30 28 L36 10 L42 28 L50 12 L54 28 L60 18 L60 36 Z\" fill=\"#222\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><div class=\"row\" style=\"gap:3px\"><div class=\"pc red sm\"><span class=\"r\">7<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><div class=\"pc sm hit\"><span class=\"r\">3<\/span><span class=\"s\">♣<\/span><span class=\"big\">♣<\/span><\/div><div class=\"pc sm\"><span class=\"r\">10<\/span><span class=\"s\">♠<\/span><span class=\"big\">♠<\/span><\/div><\/div><\/div><div style=\"font-size:9.6pt;max-width:330px\">“<b>That one is a club<\/b>” <span style=\"color:var(--muted)\">(pointing at the 3♣)<\/span> or “<b>that one is a 3<\/b>”. Say a suit <i>or<\/i> a rank, never both. Your teammate remembers it and builds the picture over several turns.<\/div><\/div><\/div>\n <div class=\"foot\"><span>Escape from Ace-catraz · Rules<\/span><span>3<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><div class=\"n\">2<\/div><h2>On your turn, continued<\/h2><small>Actions 3 to 5 and the Breakthrough<\/small><\/div>\n <div class=\"action\"><h4><span>3<\/span>Distract<\/h4><p>Discard <b>any<\/b> card at the active Obstacle, then choose a Patrol card from the discard pile and shuffle it back into the Patrol deck. Use it to remove a card you know is wrong, and to bring back an easy Guard Check.<\/p><\/div>\n <div class=\"action\"><h4><span>4<\/span>Riot<\/h4><p>Discard <b>5 cards<\/b> from the top of the Flashlight Deck (the deck must have at least 5 cards left), then <b>swap any two cards<\/b>: your own, another player’s, or one from the discard pile. At least one has to be in a player’s hand. Riots are the best way to move a card to where it’s needed.<\/p><\/div>\n <div class=\"action\"><h4><span>5<\/span>Pass<\/h4><p>Only available once the <b>Alarm Sounds card is visible<\/b>, which means the Flashlight Deck has run out. Skip your turn. (Pass is also what you do if you have no other legal action.)<\/p>\n  <div class=\"row\" style=\"justify-content:flex-start;gap:12px;margin-top:4px\"><div class=\"sc alarm s\"><i>ALARM SOUNDS<\/i><b>🚨<\/b><span>Drawing LOCKED. Pass allowed.<\/span><\/div><div style=\"font-size:9.2pt\">When the Alarm card is revealed, <b>drawing is locked<\/b>. Planting a card no longer replaces it, so your hands shrink as the crew plants.<\/div><\/div><\/div>\n <div class=\"hd\" style=\"margin:4px -0.55in 0\"><div class=\"n\">3<\/div><h2>Breakthrough<\/h2><small>Optional, at the end of your turn<\/small><\/div>\n <div class=\"box\"><p>If <b>each player has planted exactly one card<\/b> on the active Obstacle, you may attempt a Breakthrough.<\/p><ol style=\"margin-top:4px\"><li>Reveal every card planted at the active Obstacle.<\/li><li><b class=\"ok\">All cards meet the condition →<\/b> success! Stack the used cards face down on the Obstacle, reveal the next face-down Obstacle (so two are visible), and the next Obstacle in your direction becomes active.<\/li><li><b class=\"bad\">Even one card fails →<\/b> the alarm is tripped and <b>everyone loses immediately<\/b>.<\/li><\/ol><\/div>\n <div class=\"cols c2\">\n  <div class=\"diag\" style=\"border:3px solid #19b57a\"><div class=\"lab ok\">Success · 3 players · obstacle: RED<\/div><div class=\"row\" style=\"gap:6px\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>RED<\/b><em>MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><u class=\"easy\">EASY<\/u><\/div><span class=\"arrow\">›<\/span><div class=\"pc red sm hit\"><span class=\"r\">4<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><div class=\"pc red sm hit\"><span class=\"r\">J<\/span><span class=\"s\">♦<\/span><span class=\"big\">♦<\/span><\/div><div class=\"pc red sm hit\"><span class=\"r\">9<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><\/div><div class=\"cap\">All three are red. On to the next Obstacle!<\/div><\/div>\n  <div class=\"diag\" style=\"border:3px solid var(--red)\"><div class=\"lab bad\">Alarm! · 3 players · obstacle: RED<\/div><div class=\"row\" style=\"gap:6px\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>RED<\/b><em>MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><u class=\"easy\">EASY<\/u><\/div><span class=\"arrow\" style=\"color:var(--red)\">›<\/span><div class=\"pc red sm hit\"><span class=\"r\">4<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><div class=\"pc sm miss\"><span class=\"r\">6<\/span><span class=\"s\">♠<\/span><span class=\"big\">♠<\/span><\/div><div class=\"pc red sm hit\"><span class=\"r\">9<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><\/div><div class=\"cap\">The 6♠ is black. Everyone loses.<\/div><\/div>\n <\/div>\n <div class=\"call good\"><b>Safety first.<\/b> Before attempting, make sure every planted card is one you’re certain about. If any player is unsure of their own planted card, it’s often smarter to let a teammate who <i>is<\/i> certain make the call, or to Distract it. If one planted card is certain to be right, <b>one verifier<\/b> is enough: everyone else’s planted cards were seen while being planted.<\/div>\n <div class=\"foot\"><span>Escape from Ace-catraz · Rules<\/span><span>4<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><div class=\"n\">4<\/div><h2>End game<\/h2><small>Win, lose, and reminders<\/small><\/div>\n <div class=\"cols c2\">\n  <div class=\"call good\" style=\"display:grid;gap:5px;justify-items:center;text-align:center\"><div style=\"font-size:20pt;font-weight:900;color:var(--green)\">FREEDOM!<\/div><div class=\"crew\" style=\"gap:6px\"><svg class=\"av\" width=\"38\" height=\"38\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av15\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av15)\"><rect width=\"80\" height=\"80\" fill=\"#f2a516\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#f6c9a0\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#f6c9a0\"/><path d=\"M20 36 Q20 14 40 14 Q60 14 60 36 Z\" fill=\"#e23d4a\"/><rect x=\"18\" y=\"32\" width=\"44\" height=\"8\" rx=\"4\" fill=\"#fff\"/><circle cx=\"40\" cy=\"12\" r=\"4\" fill=\"#fff\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><svg class=\"av\" width=\"38\" height=\"38\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av16\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av16)\"><rect width=\"80\" height=\"80\" fill=\"#e23d4a\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#c68a5e\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#c68a5e\"/><path d=\"M20 36 L22 16 L30 28 L36 10 L42 28 L50 12 L54 28 L60 18 L60 36 Z\" fill=\"#222\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><svg class=\"av\" width=\"38\" height=\"38\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av17\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av17)\"><rect width=\"80\" height=\"80\" fill=\"#1fa38a\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#8d5a3c\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#8d5a3c\"/><ellipse cx=\"32\" cy=\"24\" rx=\"5\" ry=\"3\" fill=\"#fff\" opacity=\".45\" transform=\"rotate(-30 32 24)\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><svg class=\"av\" width=\"38\" height=\"38\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av18\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av18)\"><rect width=\"80\" height=\"80\" fill=\"#7a4fd1\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#f6d3b3\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#f6d3b3\"/><path d=\"M22 30 L22 14 L31 22 L40 10 L49 22 L58 14 L58 30 Z\" fill=\"#f7c928\" stroke=\"#c99a00\" stroke-width=\"2\" stroke-linejoin=\"round\"/><rect x=\"22\" y=\"28\" width=\"36\" height=\"5\" fill=\"#f7c928\" stroke=\"#c99a00\" stroke-width=\"2\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><\/div><div>If you have completed <b>all Obstacles<\/b> in the Escape Plan, you win. Enjoy your freedom!<\/div><\/div>\n  <div class=\"call bad\" style=\"display:grid;gap:5px;justify-items:center;text-align:center\"><div style=\"font-size:20pt;font-weight:900;color:var(--red)\">BACK TO YOUR CELLS<\/div><div style=\"font-size:26pt;line-height:1\">🚨<\/div><div>If any <b>Breakthrough fails<\/b>, or <b>all players have no cards in hand<\/b> and Obstacles remain, you lose.<\/div><\/div>\n <\/div>\n <div class=\"box\"><h3>Critical reminders<\/h3><ul>\n  <li>You see your teammates’ hands; <b>you cannot see your own<\/b>.<\/li>\n  <li>Once a card is planted face down, <b>no one can look at it again<\/b>.<\/li>\n  <li>Inmates can only ever see the <b>active Obstacle and the next one<\/b> on the Escape Plan.<\/li>\n  <li>You may only plant cards at the <b>active Obstacle<\/b>.<\/li>\n  <li>Every Obstacle must have <b>exactly one card from each player<\/b> to pass it.<\/li>\n  <li>If any deck is empty, you <b>cannot reshuffle<\/b>.<\/li><\/ul><\/div>\n <div class=\"box\"><h3>Quick reference: your five actions<\/h3><table>\n  <tr><th>Action<\/th><th>What it does<\/th><th>When it shines<\/th><\/tr>\n  <tr><td><b>Play my part<\/b><\/td><td>Plant a blind card face down, then draw<\/td><td>You know your card is right, or you want to cycle in a fresh one<\/td><\/tr>\n  <tr><td><b>Guard check<\/b><\/td><td>Flip Patrol + Flashlight card; if you pass, give a hint<\/td><td>The crew needs information<\/td><\/tr>\n  <tr><td><b>Distract<\/b><\/td><td>Discard a planted card; return a Patrol card to the deck<\/td><td>A planted card is wrong or suspect<\/td><\/tr>\n  <tr><td><b>Riot<\/b><\/td><td>Discard 5 from the deck, swap any two cards<\/td><td>The card an Obstacle needs is in the wrong hand<\/td><\/tr>\n  <tr><td><b>Pass<\/b><\/td><td>Do nothing<\/td><td>Alarm visible and nothing useful to do<\/td><\/tr><\/table><\/div>\n <div class=\"box\"><h3>Tips for the crew<\/h3><div class=\"cols c2\" style=\"gap:14px\"><ul>\n  <li><b>Talk in hints, not answers.<\/b> Only a suit <i>or<\/i> a rank. Never both, never “that one’s fine”.<\/li>\n  <li><b>Track what you know.<\/b> Write the hints on your fingers, or jot them in the margin of a scorepad.<\/li>\n  <li><b>Watch every plant.<\/b> You’ll need to remember every planted card to judge a Breakthrough.<\/li><\/ul><ul>\n  <li><b>Planting a mystery card can be smart.<\/b> It’s a way to bring fresh cards into your hand, because a teammate can Distract it if it’s wrong. Just don’t trigger the Breakthrough on it yourself.<\/li>\n  <li><b>Pick your direction wisely.<\/b> Tackle hard locks while the deck is full, or clear easy ones first and keep hints flowing.<\/li>\n  <li><b>Mind the Flashlight Deck.<\/b> When it runs dry, drawing stops and hands shrink.<\/li><\/ul><\/div><\/div>\n <div class=\"foot\"><span>Escape from Ace-catraz · Rules<\/span><span>5<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><div class=\"n\">A<\/div><h2>Card reference<\/h2><small>Every Security card, both sides<\/small><\/div>\n <p style=\"font-size:9.2pt;color:var(--muted)\">Each Security card is two-sided. Its <b>obstacle<\/b> side (top row of each pair) says what must be planted; its <b>Guard Check<\/b> side (bottom row) says what to avoid. A card that’s EASY to match is EXTREME CAUTION to guard-check, and vice versa.<\/p>\n <div class=\"box\"><h3 style=\"color:#1fa38a\">Easy · 6 cards<\/h3><div class=\"grid6\"><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>ODD<\/b><em>MATCH<\/em><span>A, 3, 5, 7, 9, J, K<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>A, 3, 5, 7, 9, J, K<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>HIGH<\/b><em>MATCH<\/em><span>RANKS 7 THROUGH K<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>RANKS 7 THROUGH K<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>RED<\/b><em>MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>BLACK<\/b><em>MATCH<\/em><span>SPADES ♠ OR CLUBS ♣<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>SPADES ♠ OR CLUBS ♣<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>EVEN<\/b><em>MATCH<\/em><span>2, 4, 6, 8, 10, Q<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>2, 4, 6, 8, 10, Q<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>LOW<\/b><em>MATCH<\/em><span>RANKS A THROUGH 6<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>RANKS A THROUGH 6<\/span><\/div><\/div><\/div><\/div>\n <div class=\"box\"><h3 style=\"color:#e08a00\">Medium · 6 cards<\/h3><div class=\"grid6\"><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>HEART<\/b><em>MATCH<\/em><span>HEARTS ♥<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>HEARTS ♥<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>DIAMOND<\/b><em>MATCH<\/em><span>DIAMONDS ♦<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>DIAMONDS ♦<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>SPADE<\/b><em>MATCH<\/em><span>SPADES ♠<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>SPADES ♠<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>CLUB<\/b><em>MATCH<\/em><span>CLUBS ♣<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>CLUBS ♣<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>FACE<\/b><em>MATCH<\/em><span>JACK, QUEEN, OR KING<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>JACK, QUEEN, OR KING<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>A, 2, 3<\/b><em>MATCH<\/em><span>A, 2, OR 3<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>A, 2, OR 3<\/span><\/div><\/div><\/div><\/div>\n <div class=\"box\"><h3 style=\"color:#d23b4a\">Hard · 5 cards<\/h3><div class=\"grid6\"><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>Q, K<\/b><em>MATCH<\/em><span>QUEEN OR KING<\/span><u class=\"hard\">HARD<\/u><\/div><div class=\"sc pat hard s\"><i>GUARD CHECK<\/i><b>RELAXED<\/b olute; left:.55in; right:.55in; bottom:.28in; display:flex; justify-content:space-between; font-size:8pt; font-weight:800; letter-spacing:.1em; color:#7c8696; text-transform:uppercase; }\nh1,h2,h3,h4,p,ul,ol { margin:0; }\n.hd { display:flex; align-items:center; gap:12px; background: var(--ink); color:#efe9db; margin: -0.5in -0.55in 4px; padding: 14px .55in; }\n.hd h2 { font-family:'Barlow Condensed',Figtree,sans-serif; font-size: 26pt; font-weight:800; text-transform:uppercase; letter-spacing:.04em; line-height:1; }\n.hd .n { background:var(--lamp); color:var(--ink); border-radius:50%; width:30px; height:30px; display:grid; place-items:center; font-weight:900; font-size:14pt; }\n.hd small { margin-left:auto; font-weight:800; opacity:.8; letter-spacing:.14em; text-transform:uppercase; font-size:8pt; }\n.tag { display:inline-block; background:var(--red); color:#fff; font-style:italic; font-weight:900; padding:1px 12px; border-radius:7px; transform:rotate(-2deg); box-shadow:0 3px 0 var(--red-d); text-transform:uppercase; }\n.box { background:#fff; border:2px solid var(--ink); border-radius:14px; padding:11px 15px; }\n.box h3 { font-size:8.5pt; font-weight:900; letter-spacing:.16em; text-transform:uppercase; color:var(--steel); margin-bottom:6px; }\n.box p + p { margin-top:5px; }\nul,ol { padding-left: 18px; } li + li { margin-top:3px; }\n.cols { display:grid; gap:12px; } .c2 { grid-template-columns: 1fr 1fr; } .c3 { grid-template-columns: 1fr 1fr 1fr; } .c21 { grid-template-columns: 1.25fr 1fr; }\n.hero { background:var(--ink); color:#efe9db; margin:-0.5in -0.55in 0; padding: .36in .55in 14px; text-align:center; display:grid; gap:8px; justify-items:center; border-bottom:6px solid var(--lamp); }\n.hero .eyebrow { font-weight:900; letter-spacing:.22em; font-size:9pt; color:var(--lamp); }\n.hero h1 { font-family:'Barlow Condensed',Figtree,sans-serif; font-size: 44pt; line-height:1; font-weight:800; text-transform:uppercase; letter-spacing:.04em; display:grid; gap:8px; ju y player each time.<\/p><p>One wrong card trips the alarm and <b>everyone<\/b> goes back to their cells.<\/p><p style=\"margin-top:7px\">Every Prison card is <b>a gang and a tool<\/b>. Hints can be about either.<\/p><\/div><\/div>\n<div class=\"box\"><h3>Components<\/h3><div class=\"row\" style=\"justify-content:space-around;align-items:flex-end\">\n<div class=\"sx up\" style=\"zoom:0.62\"><div class=\"ph\"><span>ESCAPE PLAN<\/span><span class=\"locks \"><span class=\"lk on\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><span class=\"lk\"><svg viewBox=\"0 0 18 21\"><path d=\"M4.5 9.5V6.5a4.5 4.5 0 0 1 9 0v3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"/><rect x=\"1.5\" y=\"9.5\" width=\"15\" height=\"10\" rx=\"2.5\" fill=\"currentColor\"/><\/svg><\/span><\/span><\/div><div class=\"pt\"><small>LOCKS · SHARPS · CUTTERS<\/small><span class=\"nm\" style=\"font-size:24px\">CELL WORK<\/span><\/div><div class=\"pm\"><div class=\"chips sm\"><span class=\"chip\"><b>🧷<\/b><u>PIN<\/u><\/span><span class=\"chip\"><b>📎<\/b><u>CLIP<\/u><\/span><span class=\"chip\"><b>🔑<\/b><u>KEY<\/u><\/span><span class=\"chip\"><b>🪥<\/b><u>SHIV<\/u><\/span><span class=\"chip\"><b>🪛<\/b><u>DRIVER<\/u><\/span><span class=\"chip\"><b>🪚<\/b><u>SAW<\/u><\/span><span class=\"chip\"><b>✂️<\/b><u>SCISSORS<\/u><\/span><\/div><\/div><div class=\"pf\"><span class=\"lvp\">EASY<\/span><\/div><\/div><div class=\"sx pat\" style=\"zoom:0.62\"><div class=\"ph\"><span>GUARD PATROL<\/span><sv
