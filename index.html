4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><div class=\"row\" style=\"gap:2px\"><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><div class=\"pc back xs\"><\/div><\/div><\/div><\/div>\n  <div class=\"cap\">Each inmate holds five cards. The backs shown here face the player; everyone else sees the fronts.<\/div><\/div>\n <div class=\"box\"><h3>The big twist: you can’t see your own hand<\/h3>\n  <div class=\"row\" style=\"gap:30px\">\n   <div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"lab\">What your crew sees<\/div><div class=\"row\" style=\"gap:3px\"><div class=\"pc red sm\"><span class=\"r\">7<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><div class=\"pc sm\"><span class=\"r\">A<\/span><span class=\"s\">♠<\/span><span class=\"big\">♠<\/span><\/div><div class=\"pc red sm\"><span class=\"r\">Q<\/span><span class=\"s\">♦<\/span><span class=\"big\">♦<\/span><\/div><div class=\"pc sm\"><span class=\"r\">4<\/span><span class=\"s\">♣<\/span><span class=\"big\">♣<\/span><\/div><div class=\"pc sm\"><span class=\"r\">9<\/span><span class=\"s\">♠<\/span><span class=\"big\">♠<\/span><\/div><\/div><\/div>\n   <div style=\"font-size:22pt\">↔<\/div>\n   <div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"lab\">What you see<\/div><div class=\"row\" style=\"gap:3px\"><div class=\"pc back sm\"><\/div><div class=\"pc back sm\"><\/div><div class=\"pc back sm\"><\/div><div class=\"pc back sm\"><\/div><div class=\"pc back sm\"><\/div><\/div><\/div>\n  <\/div>\n  <p class=\"cap\" style=\"text-align:center;margin-top:4px;color:var(--muted);font-size:8.5pt\">Your teammates give you hints (a suit or a rank) through Guard Checks. Keep track of what you’ve been told.<\/p><\/div>\n <div class=\"foot\"><span>Escape from Ace-catraz · Rules<\/span><span>2<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><div class=\"n\">2<\/div><h2>On your turn<\/h2><small>Choose one action, then optionally Breakthrough<\/small><\/div>\n <div class=\"row\" style=\"gap:10px\"><div class=\"box\" style=\"flex:1;text-align:center\"><b>1.<\/b> Perform <b>one<\/b> of the five actions<\/div><div class=\"arrow\">›<\/div><div class=\"box\" style=\"flex:1;text-align:center\"><b>2.<\/b> Optionally attempt a <b>Breakthrough<\/b><\/div><\/div>\n <div class=\"action\"><h4><span>1<\/span>Play my part<\/h4>\n  <div class=\"row\" style=\"justify-content:space-between;gap:14px;align-items:center\">\n   <div><ol style=\"padding-left:16px\"><li>Choose a card from your hand <b>without looking at it<\/b>. Place it face down on an <b>unoccupied corner of the active Obstacle<\/b>.<\/li><li>Draw a card from the Flashlight Deck into your hand. Keep it facing away from you.<\/li><\/ol><\/div>\n   <div class=\"row\" style=\"gap:6px\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>RED<\/b><em>MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><u class=\"easy\">EASY<\/u><\/div><div style=\"display:grid;grid-template-columns:auto auto;gap:4px\"><div class=\"pc back sm\"><\/div><div class=\"pc back sm\"><\/div><div class=\"pc sm\" style=\"border:2px dashed #aab;background:transparent;box-shadow:none\"><\/div><div class=\"pc sm\" style=\"border:2px dashed #aab;background:transparent;box-shadow:none\"><\/div><\/div><\/div>\n  <\/div><\/div>\n <div class=\"action\"><h4><span>2<\/span>Perform a Guard check<\/h4>\n  <div class=\"row\" style=\"justify-content:space-between;gap:14px\">\n   <div><ol style=\"padding-left:16px\"><li>Flip the top <b>Patrol<\/b> card and the top <b>Flashlight<\/b> card.<\/li><li>Compare the Flashlight card against the Patrol card’s criteria.<ul><li><b class=\"bad\">Fail:<\/b> the card <i>matches<\/i> the “DO NOT MATCH” line. Stay silent. Your turn is over.<\/li><li><b class=\"ok\">Pass:<\/b> the card does <i>not<\/i> match. Point to a card in a teammate’s hand and say either its <b>suit<\/b> or its <b>rank<\/b>.<\/li><\/ul><\/li><li>Discard both revealed cards.<\/li><\/ol><\/div>\n  <\/div>\n  <div class=\"cols c2\" style=\"margin-top:8px\">\n   <div class=\"diag\" style=\"background:#f3f6fa;padding:8px\"><div class=\"row\" style=\"gap:8px\"><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><\/div><span class=\"lab\">vs<\/span><div class=\"pc \"><span class=\"r\">7<\/span><span class=\"s\">♠<\/span><span class=\"big\">♠<\/span><\/div><div style=\"font-weight:900;font-size:9.5pt\" class=\"ok\">PASS ✓<br><span style=\"font-weight:600;color:var(--ink)\">7♠ is not red.<br>Give a hint!<\/span><\/div><\/div><\/div>\n   <div class=\"diag\" style=\"background:#f3f6fa;padding:8px\"><div class=\"row\" style=\"gap:8px\"><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><\/div><span class=\"lab\">vs<\/span><div class=\"pc red \"><span class=\"r\">Q<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><div style=\"font-weight:900;font-size:9.5pt\" class=\"bad\">FAIL ✗<br><span style=\"font-weight:600;color:var(--ink)\">Q♥ is red.<br>Say nothing.<\/span><\/div><\/div><\/div>\n  <\/div>\n  <div class=\"call warn\" style=\"margin-top:8px\"><b>Reading the Patrol card:<\/b> the card’s coloured label tells you how risky the check is. <b>Extreme caution<\/b> (the card’s obstacle side is Easy) is hard to pass because it forbids half the deck. <b>Relaxed<\/b> (the card’s obstacle side is Hard) is easy to pass because it only forbids a couple of ranks. The top of the Patrol deck always shows how tough the next check is.<\/div>\n <\/div>\n <div class=\"box\" style=\"padding:8px 14px\"><h3>Hints, in practice<\/h3><div class=\"row\" style=\"gap:16px\"><div style=\"display:grid;gap:4px;justify-items:center\"><svg class=\"av\" width=\"36\" height=\"36\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av14\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av14)\"><rect width=\"80\" height=\"80\" fill=\"#e23d4a\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#c68a5e\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#c68a5e\"/><path d=\"M20 36 L22 16 L30 28 L36 10 L42 28 L50 12 L54 28 L60 18 L60 36 Z\" fill=\"#222\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><div class=\"row\" style=\"gap:3px\"><div class=\"pc red sm\"><span class=\"r\">7<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><div class=\"pc sm hit\"><span class=\"r\">3<\/span><span class=\"s\">♣<\/span><span class=\"big\">♣<\/span><\/div><div class=\"pc sm\"><span class=\"r\">10<\/span><span class=\"s\">♠<\/span><span class=\"big\">♠<\/span><\/div><\/div><\/div><div style=\"font-size:9.6pt;max-width:330px\">“<b>That one is a club<\/b>” <span style=\"color:var(--muted)\">(pointing at the 3♣)<\/span> or “<b>that one is a 3<\/b>”. Say a suit <i>or<\/i> a rank, never both. Your teammate remembers it and builds the picture over several turns.<\/div><\/div><\/div>\n <div class=\"foot\"><span>Escape from Ace-catraz · Rules<\/span><span>3<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><div class=\"n\">2<\/div><h2>On your turn, continued<\/h2><small>Actions 3 to 5 and the Breakthrough<\/small><\/div>\n <div class=\"action\"><h4><span>3<\/span>Distract<\/h4><p>Discard <b>any<\/b> card at the active Obstacle, then choose a Patrol card from the discard pile and shuffle it back into the Patrol deck. Use it to remove a card you know is wrong, and to bring back an easy Guard Check.<\/p><\/div>\n <div class=\"action\"><h4><span>4<\/span>Riot<\/h4><p>Discard <b>5 cards<\/b> from the top of the Flashlight Deck (the deck must have at least 5 cards left), then <b>swap any two cards<\/b>: your own, another player’s, or one from the discard pile. At least one has to be in a player’s hand. Riots are the best way to move a card to where it’s needed.<\/p><\/div>\n <div class=\"action\"><h4><span>5<\/span>Pass<\/h4><p>Only available once the <b>Alarm Sounds card is visible<\/b>, which means the Flashlight Deck has run out. Skip your turn. (Pass is also what you do if you have no other legal action.)<\/p>\n  <div class=\"row\" style=\"justify-content:flex-start;gap:12px;margin-top:4px\"><div class=\"sc alarm s\"><i>ALARM SOUNDS<\/i><b>🚨<\/b><span>Drawing LOCKED. Pass allowed.<\/span><\/div><div style=\"font-size:9.2pt\">When the Alarm card is revealed, <b>drawing is locked<\/b>. Planting a card no longer replaces it, so your hands shrink as the crew plants.<\/div><\/div><\/div>\n <div class=\"hd\" style=\"margin:4px -0.55in 0\"><div class=\"n\">3<\/div><h2>Breakthrough<\/h2><small>Optional, at the end of your turn<\/small><\/div>\n <div class=\"box\"><p>If <b>each player has planted exactly one card<\/b> on the active Obstacle, you may attempt a Breakthrough.<\/p><ol style=\"margin-top:4px\"><li>Reveal every card planted at the active Obstacle.<\/li><li><b class=\"ok\">All cards meet the condition →<\/b> success! Stack the used cards face down on the Obstacle, reveal the next face-down Obstacle (so two are visible), and the next Obstacle in your direction becomes active.<\/li><li><b class=\"bad\">Even one card fails →<\/b> the alarm is tripped and <b>everyone loses immediately<\/b>.<\/li><\/ol><\/div>\n <div class=\"cols c2\">\n  <div class=\"diag\" style=\"border:3px solid #19b57a\"><div class=\"lab ok\">Success · 3 players · obstacle: RED<\/div><div class=\"row\" style=\"gap:6px\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>RED<\/b><em>MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><u class=\"easy\">EASY<\/u><\/div><span class=\"arrow\">›<\/span><div class=\"pc red sm hit\"><span class=\"r\">4<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><div class=\"pc red sm hit\"><span class=\"r\">J<\/span><span class=\"s\">♦<\/span><span class=\"big\">♦<\/span><\/div><div class=\"pc red sm hit\"><span class=\"r\">9<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><\/div><div class=\"cap\">All three are red. On to the next Obstacle!<\/div><\/div>\n  <div class=\"diag\" style=\"border:3px solid var(--red)\"><div class=\"lab bad\">Alarm! · 3 players · obstacle: RED<\/div><div class=\"row\" style=\"gap:6px\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>RED<\/b><em>MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><u class=\"easy\">EASY<\/u><\/div><span class=\"arrow\" style=\"color:var(--red)\">›<\/span><div class=\"pc red sm hit\"><span class=\"r\">4<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><div class=\"pc sm miss\"><span class=\"r\">6<\/span><span class=\"s\">♠<\/span><span class=\"big\">♠<\/span><\/div><div class=\"pc red sm hit\"><span class=\"r\">9<\/span><span class=\"s\">♥<\/span><span class=\"big\">♥<\/span><\/div><\/div><div class=\"cap\">The 6♠ is black. Everyone loses.<\/div><\/div>\n <\/div>\n <div class=\"call good\"><b>Safety first.<\/b> Before attempting, make sure every planted card is one you’re certain about. If any player is unsure of their own planted card, it’s often smarter to let a teammate who <i>is<\/i> certain make the call, or to Distract it. If one planted card is certain to be right, <b>one verifier<\/b> is enough: everyone else’s planted cards were seen while being planted.<\/div>\n <div class=\"foot\"><span>Escape from Ace-catraz · Rules<\/span><span>4<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><div class=\"n\">4<\/div><h2>End game<\/h2><small>Win, lose, and reminders<\/small><\/div>\n <div class=\"cols c2\">\n  <div class=\"call good\" style=\"display:grid;gap:5px;justify-items:center;text-align:center\"><div style=\"font-size:20pt;font-weight:900;color:var(--green)\">FREEDOM!<\/div><div class=\"crew\" style=\"gap:6px\"><svg class=\"av\" width=\"38\" height=\"38\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av15\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av15)\"><rect width=\"80\" height=\"80\" fill=\"#f2a516\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#f6c9a0\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#f6c9a0\"/><path d=\"M20 36 Q20 14 40 14 Q60 14 60 36 Z\" fill=\"#e23d4a\"/><rect x=\"18\" y=\"32\" width=\"44\" height=\"8\" rx=\"4\" fill=\"#fff\"/><circle cx=\"40\" cy=\"12\" r=\"4\" fill=\"#fff\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><svg class=\"av\" width=\"38\" height=\"38\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av16\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av16)\"><rect width=\"80\" height=\"80\" fill=\"#e23d4a\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#c68a5e\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#c68a5e\"/><path d=\"M20 36 L22 16 L30 28 L36 10 L42 28 L50 12 L54 28 L60 18 L60 36 Z\" fill=\"#222\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><svg class=\"av\" width=\"38\" height=\"38\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av17\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av17)\"><rect width=\"80\" height=\"80\" fill=\"#1fa38a\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#8d5a3c\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#8d5a3c\"/><ellipse cx=\"32\" cy=\"24\" rx=\"5\" ry=\"3\" fill=\"#fff\" opacity=\".45\" transform=\"rotate(-30 32 24)\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><svg class=\"av\" width=\"38\" height=\"38\" viewBox=\"0 0 80 80\"><defs><clipPath id=\"av18\"><circle cx=\"40\" cy=\"40\" r=\"40\"/><\/clipPath><\/defs><g clip-path=\"url(#av18)\"><rect width=\"80\" height=\"80\" fill=\"#7a4fd1\"/><path d=\"M6 84 Q8 58 40 56 Q72 58 74 84 Z\" fill=\"#fff\"/><rect x=\"10\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"24\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"38\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"52\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"66\" y=\"56\" width=\"7\" height=\"26\" fill=\"#222\" opacity=\".85\"/><rect x=\"34\" y=\"50\" width=\"12\" height=\"9\" fill=\"#f6d3b3\"/><ellipse cx=\"40\" cy=\"36\" rx=\"19\" ry=\"20\" fill=\"#f6d3b3\"/><path d=\"M22 30 L22 14 L31 22 L40 10 L49 22 L58 14 L58 30 Z\" fill=\"#f7c928\" stroke=\"#c99a00\" stroke-width=\"2\" stroke-linejoin=\"round\"/><rect x=\"22\" y=\"28\" width=\"36\" height=\"5\" fill=\"#f7c928\" stroke=\"#c99a00\" stroke-width=\"2\"/><ellipse cx=\"33\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><ellipse cx=\"47\" cy=\"38\" rx=\"4.6\" ry=\"5.4\" fill=\"#fff\"/><circle cx=\"34\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"39\" r=\"2.5\" fill=\"#222\"/><path d=\"M33 47 Q40 54 47 47\" fill=\"none\" stroke=\"#222\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/g><\/svg><\/div><div>If you have completed <b>all Obstacles<\/b> in the Escape Plan, you win. Enjoy your freedom!<\/div><\/div>\n  <div class=\"call bad\" style=\"display:grid;gap:5px;justify-items:center;text-align:center\"><div style=\"font-size:20pt;font-weight:900;color:var(--red)\">BACK TO YOUR CELLS<\/div><div style=\"font-size:26pt;line-height:1\">🚨<\/div><div>If any <b>Breakthrough fails<\/b>, or <b>all players have no cards in hand<\/b> and Obstacles remain, you lose.<\/div><\/div>\n <\/div>\n <div class=\"box\"><h3>Critical reminders<\/h3><ul>\n  <li>You see your teammates’ hands; <b>you cannot see your own<\/b>.<\/li>\n  <li>Once a card is planted face down, <b>no one can look at it again<\/b>.<\/li>\n  <li>Inmates can only ever see the <b>active Obstacle and the next one<\/b> on the Escape Plan.<\/li>\n  <li>You may only plant cards at the <b>active Obstacle<\/b>.<\/li>\n  <li>Every Obstacle must have <b>exactly one card from each player<\/b> to pass it.<\/li>\n  <li>If any deck is empty, you <b>cannot reshuffle<\/b>.<\/li><\/ul><\/div>\n <div class=\"box\"><h3>Quick reference: your five actions<\/h3><table>\n  <tr><th>Action<\/th><th>What it does<\/th><th>When it shines<\/th><\/tr>\n  <tr><td><b>Play my part<\/b><\/td><td>Plant a blind card face down, then draw<\/td><td>You know your card is right, or you want to cycle in a fresh one<\/td><\/tr>\n  <tr><td><b>Guard check<\/b><\/td><td>Flip Patrol + Flashlight card; if you pass, give a hint<\/td><td>The crew needs information<\/td><\/tr>\n  <tr><td><b>Distract<\/b><\/td><td>Discard a planted card; return a Patrol card to the deck<\/td><td>A planted card is wrong or suspect<\/td><\/tr>\n  <tr><td><b>Riot<\/b><\/td><td>Discard 5 from the deck, swap any two cards<\/td><td>The card an Obstacle needs is in the wrong hand<\/td><\/tr>\n  <tr><td><b>Pass<\/b><\/td><td>Do nothing<\/td><td>Alarm visible and nothing useful to do<\/td><\/tr><\/table><\/div>\n <div class=\"box\"><h3>Tips for the crew<\/h3><div class=\"cols c2\" style=\"gap:14px\"><ul>\n  <li><b>Talk in hints, not answers.<\/b> Only a suit <i>or<\/i> a rank. Never both, never “that one’s fine”.<\/li>\n  <li><b>Track what you know.<\/b> Write the hints on your fingers, or jot them in the margin of a scorepad.<\/li>\n  <li><b>Watch every plant.<\/b> You’ll need to remember every planted card to judge a Breakthrough.<\/li><\/ul><ul>\n  <li><b>Planting a mystery card can be smart.<\/b> It’s a way to bring fresh cards into your hand, because a teammate can Distract it if it’s wrong. Just don’t trigger the Breakthrough on it yourself.<\/li>\n  <li><b>Pick your direction wisely.<\/b> Tackle hard locks while the deck is full, or clear easy ones first and keep hints flowing.<\/li>\n  <li><b>Mind the Flashlight Deck.<\/b> When it runs dry, drawing stops and hands shrink.<\/li><\/ul><\/div><\/div>\n <div class=\"foot\"><span>Escape from Ace-catraz · Rules<\/span><span>5<\/span><\/div><\/div><div class=\"page\"><div class=\"hd\"><div class=\"n\">A<\/div><h2>Card reference<\/h2><small>Every Security card, both sides<\/small><\/div>\n <p style=\"font-size:9.2pt;color:var(--muted)\">Each Security card is two-sided. Its <b>obstacle<\/b> side (top row of each pair) says what must be planted; its <b>Guard Check<\/b> side (bottom row) says what to avoid. A card that’s EASY to match is EXTREME CAUTION to guard-check, and vice versa.<\/p>\n <div class=\"box\"><h3 style=\"color:#1fa38a\">Easy · 6 cards<\/h3><div class=\"grid6\"><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>ODD<\/b><em>MATCH<\/em><span>A, 3, 5, 7, 9, J, K<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>A, 3, 5, 7, 9, J, K<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>HIGH<\/b><em>MATCH<\/em><span>RANKS 7 THROUGH K<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>RANKS 7 THROUGH K<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>RED<\/b><em>MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>HEARTS ♥ OR DIAMONDS ♦<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>BLACK<\/b><em>MATCH<\/em><span>SPADES ♠ OR CLUBS ♣<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>SPADES ♠ OR CLUBS ♣<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>EVEN<\/b><em>MATCH<\/em><span>2, 4, 6, 8, 10, Q<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>2, 4, 6, 8, 10, Q<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>LOW<\/b><em>MATCH<\/em><span>RANKS A THROUGH 6<\/span><u class=\"easy\">EASY<\/u><\/div><div class=\"sc pat easy s\"><i>GUARD CHECK<\/i><b>EXTREME CAUTION<\/b><em>DO NOT MATCH<\/em><span>RANKS A THROUGH 6<\/span><\/div><\/div><\/div><\/div>\n <div class=\"box\"><h3 style=\"color:#e08a00\">Medium · 6 cards<\/h3><div class=\"grid6\"><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>HEART<\/b><em>MATCH<\/em><span>HEARTS ♥<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>HEARTS ♥<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>DIAMOND<\/b><em>MATCH<\/em><span>DIAMONDS ♦<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>DIAMONDS ♦<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>SPADE<\/b><em>MATCH<\/em><span>SPADES ♠<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>SPADES ♠<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>CLUB<\/b><em>MATCH<\/em><span>CLUBS ♣<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>CLUBS ♣<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>FACE<\/b><em>MATCH<\/em><span>JACK, QUEEN, OR KING<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>JACK, QUEEN, OR KING<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>A, 2, 3<\/b><em>MATCH<\/em><span>A, 2, OR 3<\/span><u class=\"medium\">MEDIUM<\/u><\/div><div class=\"sc pat medium s\"><i>GUARD CHECK<\/i><b>MEDIUM<\/b><em>DO NOT MATCH<\/em><span>A, 2, OR 3<\/span><\/div><\/div><\/div><\/div>\n <div class=\"box\"><h3 style=\"color:#d23b4a\">Hard · 5 cards<\/h3><div class=\"grid6\"><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>Q, K<\/b><em>MATCH<\/em><span>QUEEN OR KING<\/span><u class=\"hard\">HARD<\/u><\/div><div class=\"sc pat hard s\"><i>GUARD CHECK<\/i><b>RELAXED<\/b><em>DO NOT MATCH<\/em><span>QUEEN OR KING<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>A, J<\/b><em>MATCH<\/em><span>ACE OR JACK<\/span><u class=\"hard\">HARD<\/u><\/div><div class=\"sc pat hard s\"><i>GUARD CHECK<\/i><b>RELAXED<\/b><em>DO NOT MATCH<\/em><span>ACE OR JACK<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>8 OR 9<\/b><em>MATCH<\/em><span>8 OR 9<\/span><u class=\"hard\">HARD<\/u><\/div><div class=\"sc pat hard s\"><i>GUARD CHECK<\/i><b>RELAXED<\/b><em>DO NOT MATCH<\/em><span>8 OR 9<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>6 OR 7<\/b><em>MATCH<\/em><span>6 OR 7<\/span><u class=\"hard\">HARD<\/u><\/div><div class=\"sc pat hard s\"><i>GUARD CHECK<\/i><b>RELAXED<\/b><em>DO NOT MATCH<\/em><span>6 OR 7<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center\"><div class=\"sc up s\"><i>ESCAPE PLAN<\/i><b>4 OR 5<\/b><em>MATCH<\/em><span>4 OR 5<\/span><u class=\"hard\">HARD<\/u><\/div><div class=\"sc pat hard s\"><i>GUARD CHECK<\/i><b>RELAXED<\/b><em>DO NOT MATCH<\/em><span>4 OR 5<\/span><\/div><\/div><div style=\"display:grid;gap:4px;justify-items:center;align-self:center\"><div class=\"sc alarm s\"><i>ALARM SOUNDS<\/i><b>🚨<\/b><span>Drawing LOCKED. Pass allowed.<\/span><\/div><div class=\"lab\">Alarm Sounds<\/div><\/div><\/div><\/div>\n <div class=\"box\"><h3>Ranks<\/h3><p style=\"font-size:9.2pt\">Ace is low: A = 1, J = 11, Q = 12, K = 13. <b>ODD<\/b> = A, 3, 5, 7, 9, J, K. <b>EVEN<\/b> = 2, 4, 6, 8, 10, Q. <b>LOW<\/b> = A through 6. <b>HIGH<\/b> = 7 through K.<\/p><\/div>\n <div class=\"foot\"><span>Escape from Ace-catraz · Rules<\/span><span>6<\/span><\/div><\/div>";
</script>
<script>
(function () {
'use strict';
const A = window.Ace, CPU = window.AceCPU;
const app = document.getElementById('app');
let G = null, timer = null;
const ui = { n: 2, extra: false, speed: 800, assist: false, dialog: 'setup', endSeen: false, sel: null, swapA: null, hintSel: null, reveal: null, flash: null, tray: false, notice: null, help: false, summary: null, options: false, logOpen: false, summaries: true, plantPopup: true, showNot: false, cardsOpen: false, cardSide: 'plan', sumOff: false, keepPlant: true, turnStart: 0 };
try { const s = JSON.parse(localStorage.getItem('ace.settings') || 'null'); if (s) for (const k of ['n', 'extra', 'speed', 'assist', 'summaries', 'plantPopup', 'showNot']) if (k in s) ui[k] = s[k]; } catch (e) {}
const save = () => { try { localStorage.setItem('ace.settings', JSON.stringify({ n: ui.n, extra: ui.extra, speed: ui.speed, assist: ui.assist, summaries: ui.summaries, plantPopup: ui.plantPopup, showNot: ui.showNot })); } catch (e) {} };

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const redSuit = (s) => s === 'H' || s === 'D';
const symHTML = (s) => '<span class="' + (redSuit(s) ? 'rd' : '') + '">' + A.SYM[s] + '</span>';
const LEVEL = { easy: 'EASY', medium: 'MEDIUM', hard: 'HARD' };

function card(c, cls, attrs) {
  return '<button class="pc ' + (redSuit(c.suit) ? 'red ' : '') + (cls || '') + '" ' + (attrs || '') + ' aria-label="' + esc(A.label(c)) + '">' +
    '<span class="r">' + A.RANKS[c.rank - 1] + '</span><span class="s">' + A.SYM[c.suit] + '</span><span class="big">' + A.SYM[c.suit] + '</span></button>';
}
function back(cls, attrs) { return '<button class="pc back ' + (cls || '') + '" ' + (attrs || '') + ' aria-label="Face-down card"></button>'; }
const SUITWORD = { HEART: 'H', DIAMOND: 'D', CLUB: 'C', SPADE: 'S' };
function notTag(not) {
  return (not || []).map((key) => {
    const nm = A.SEC.find((x) => x.key === key).name, st = SUITWORD[String(nm).toUpperCase()];
    return '<span class="known not" title="Cannot be ' + esc(nm) + '"><em>✕</em>' + (st ? symHTML(st) : esc(nm)) + '</span>';
  }).join('');
}
function known(k, not) {
  const nt = ui.showNot ? notTag(not) : '';
  if (A.isExact(k)) return '<span class="known exact" title="Known exactly"><b>' + A.RANKS[k.rank - 1] + '</b>' + symHTML(k.suit) + '</span>';
  const parts = [];
  if (k.suit) parts.push('<span class="ks" title="Suit is known">' + symHTML(k.suit) + '</span>');
  if (k.rank) parts.push('<b class="kr" title="Rank is known">' + A.RANKS[k.rank - 1] + '</b>');
  if (parts.length) return '<span class="known has">' + parts.join('') + '</span>' + nt;
  return nt || '<span class="known none" title="No hints yet">?</span>';
}
function secUp(sec) {
  return '<div class="sec up"><span class="pill">ESCAPE PLAN</span><span class="nm">' + esc(sec.name) + '</span>' +
    '<div class="match"><i>MATCH:</i>' + esc(sec.text) + '</div><span class="lvl">' + LEVEL[sec.level] + '</span></div>';
}
function patUp(sec, cls, attrs) {
  return '<div class="pat ' + (cls || '') + '" ' + (attrs || '') + '><span class="pill">GUARD CHECK</span><span class="nm">NOT ' + esc(sec.name) + '</span>' +
    '<div class="dn">DO NOT MATCH: ' + esc(sec.text) + '</div></div>';
}


const AV = [
  { bg: '#f2a516', skin: '#f6c9a0', hair: '#5b3a1e', kind: 'beanie', hat: '#e23d4a' },
  { bg: '#e23d4a', skin: '#c68a5e', hair: '#222', kind: 'spiky' },
  { bg: '#1fa38a', skin: '#8d5a3c', hair: '#222', kind: 'bald' },
  { bg: '#7a4fd1', skin: '#f6d3b3', hair: '#c9822b', kind: 'crown' }
];
function avatar(i, size) {
  const a = AV[i % 4], sz = size || 36;
  let top = '';
  if (a.kind === 'beanie') top = '<path d="M20 36 Q20 14 40 14 Q60 14 60 36 Z" fill="' + a.hat + '"/><rect x="18" y="32" width="44" height="8" rx="4" fill="#fff"/><circle cx="40" cy="12" r="4" fill="#fff"/>';
  else if (a.kind === 'spiky') top = '<path d="M20 36 L22 16 L30 28 L36 10 L42 28 L50 12 L54 28 L60 18 L60 36 Z" fill="' + a.hair + '"/>';
  else if (a.kind === 'bald') top = '<ellipse cx="32" cy="24" rx="5" ry="3" fill="#fff" opacity=".45" transform="rotate(-30 32 24)"/>';
  else top = '<path d="M22 30 L22 14 L31 22 L40 10 L49 22 L58 14 L58 30 Z" fill="#f7c928" stroke="#c99a00" stroke-width="2" stroke-linejoin="round"/><rect x="22" y="28" width="36" height="5" fill="#f7c928" stroke="#c99a00" stroke-width="2"/>' + '<path d="M20 40 Q20 30 40 30 Q60 30 60 40 Z" fill="' + a.hair + '" opacity="0"/>';
  return '<svg class="av" width="' + sz + '" height="' + sz + '" viewBox="0 0 80 80" aria-hidden="true"><defs><clipPath id="avc' + i + '-' + sz + '"><circle cx="40" cy="40" r="40"/></clipPath></defs>' +
    '<g clip-path="url(#avc' + i + '-' + sz + ')"><rect width="80" height="80" fill="' + a.bg + '"/>' +
    '<path d="M6 84 Q8 58 40 56 Q72 58 74 84 Z" fill="#fff"/>' +
    [0, 1, 2, 3, 4].map((k) => '<rect x="' + (10 + k * 14) + '" y="56" width="7" height="26" fill="#222" opacity=".85"/>').join('') +
    '<rect x="34" y="50" width="12" height="9" fill="' + a.skin + '"/>' +
    '<ellipse cx="40" cy="36" rx="19" ry="20" fill="' + a.skin + '"/>' + top +
    '<ellipse cx="33" cy="38" rx="4.6" ry="5.4" fill="#fff"/><ellipse cx="47" cy="38" rx="4.6" ry="5.4" fill="#fff"/>' +
    '<circle cx="34" cy="39" r="2.5" fill="#222"/><circle cx="48" cy="39" r="2.5" fill="#222"/>' +
    '<path d="M33 47 Q40 54 47 47" fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round"/></g></svg>';
}

function isSwapSel(pl, i) { const a = ui.swapA; return !!a && a.kind === 'player' && a.player === pl && a.hand === i; }
function mode() {
  if (!G || G.result || ui.dialog || ui.help) return null;
  if (!G.players[G.turn].human) return null;
  switch (G.phase) {
    case 'direction': return 'direction';
    case 'action': return ui.sel || 'choose';
    case 'hint': return 'hint';
    case 'distractPatrol': return 'patrol';
    case 'riotSwap': return ui.swapA == null ? 'swapA' : 'swapB';
    case 'post': return 'post';
  }
  return null;
}

function headerHTML() {
  const alarm = G && A.alarmVisible(G);
  let chips = '';
  if (G) {
    chips = '<span class="chip ' + (alarm ? 'alarm' : '') + '">' + (alarm ? '<b>ALARM SOUNDS</b> drawing locked' : 'Flashlight deck <b>' + G.deck.length + '</b>') + '</span>' +
      '<span class="chip">Patrol deck <b>' + G.patrol.length + '</b></span>' +
      '<span class="chip">Cleared <b>' + Math.min(G.cur, G.obstacles.length) + '/' + G.obstacles.length + '</b></span>';
  }
  const bar = '<header class="bar"><h1>Escape from <span class="tag">Ace-catraz!</span><span class="demo">Demo</span></h1><span class="barbtns">' + (G ? '<button class="btn sm" data-act="logopen">Log</button> ' : '') + '<button class="btn sm" data-act="cards">Cards</button> <button class="btn sm" data-act="help">How to play</button> ' + (G ? '<button class="btn sm" data-act="options">Options</button> ' : '') + '<button class="btn sm" data-act="newgame">New game</button></span></header>';
  if (!G) return bar;
  return bar + '<div class="sub"><div class="chips">' + chips + '</div></div>';
}

function planHTML() {
  const md = mode();
  const mini = (O, i, st) => {
    const lvl = O.faceUp ? LEVEL[O.sec.level] : LEVEL[O.sec.level];
    if (st === 'done') return '<div class="mo done" title="Cleared"><b>' + esc(O.sec.name) + '</b><span>✓</span></div>';
    return '<div class="mo ' + (O.faceUp ? 'up' : 'down ' + O.sec.level) + '"><i>' + (i + 1) + '</i><b>' + (O.faceUp ? esc(O.sec.name) : lvl) + '</b><span>' + (O.faceUp ? lvl : 'locked') + '</span></div>';
  };
  const big = (O, i, tag, active) => '<div class="obs ' + (active ? 'active' : '') + '"><span class="tagline">' + (i + 1) + ' · ' + tag + '</span>' +
    (O.faceUp ? secUp(O.sec) : '<div class="sec down ' + O.sec.level + '"><small>LOCK SECURITY LEVEL</small><b>' + LEVEL[O.sec.level] + '</b></div>') + '</div>';
  const cur = G.cur, n = G.obstacles.length;
  if (G.phase === 'direction') {
    const tiles = G.obstacles.map((O) => '<div class="mo ' + (O.faceUp ? 'up' : 'down ' + O.sec.level) + ' path"><b>' + (O.faceUp ? esc(O.sec.name) : LEVEL[O.sec.level]) + '</b><span>' + (O.faceUp ? LEVEL[O.sec.level] : 'locked') + '</span></div>').join('<span class="arrow">\u203a</span>');
    return '<section class="panel"><h2>Escape plan <small>direction not chosen yet</small></h2><div class="pathrow">' + tiles + '</div><div class="pathends"><span>\u2190 left end</span><span>right end \u2192</span></div></section>';
  }
  let html = '<div class="focusrow">';
  if (cur < n) {
    const O = G.obstacles[cur], act = true;
    const cell = (p) => {
      const rec = act && A.plantedBy(O, p.idx);
      const pick = rec && md === 'distract' ? 'pick' : '';
      const card = !act ? '' : rec ? back('mini ' + pick, pick ? 'data-act="distract-pick" data-p="' + p.idx + '"' : '') : '<div class="pc mini ghost"></div>';
      return '<div class="corner ' + (rec ? 'has' : 'empty') + ' c' + p.idx + '" style="--pc:' + AV[p.idx % 4].bg + '">' + card + '<span class="who">' + avatar(p.idx, 20) + esc(p.name) + (p.human ? ' (you)' : '') + '</span></div>';
    };
    html += '<div class="cgrid">' + G.players.map(cell).join('') + '<div class="ccenter">' + big(O, cur, act ? 'Active' : 'First', act).replace('class="obs ', 'class="obs ') + '</div></div>';
    if (cur + 1 < n) html += '<div class="nextwrap">' + big(G.obstacles[cur + 1], cur + 1, G.obstacles[cur + 1].faceUp ? 'Next' : 'Locked', false) + '</div>';
  }
  html += '</div>';
  const doneT = [], lockT = [];
  for (let i = 0; i < n; i++) { if (i < cur) doneT.push(mini(G.obstacles[i], i, 'done')); else if (i >= cur + 2) lockT.push(mini(G.obstacles[i], i, 'locked')); }
  html += '<div class="lowrow"><div class="lowcol left"><div class="restlabel">Cleared (' + doneT.length + ')</div><div class="restrow">' + (doneT.join('') || '<span class="emptynote">none yet</span>') + '</div></div>' +
    '<div class="lowcol right"><div class="restlabel">Still locked (' + lockT.length + ')</div><div class="restrow">' + (lockT.join('') || '<span class="emptynote">none</span>') + '</div></div></div>';
  return '<section class="panel"><h2>Escape plan <small>' + (G.dir === 'ltr' ? 'escaping left to right' : G.dir === 'rtl' ? 'escaping right to left' : 'direction not chosen yet') + '</small></h2>' + html + '</section>';
}

function tableHTML() {
  const alarm = A.alarmVisible(G);
  const PL = { easy: ['EXTREME CAUTION', 'hard to pass', 'caution'], medium: ['MEDIUM', 'medium odds', 'med'], hard: ['RELAXED', 'easy to pass', 'relaxed'] };
  const top = G.patrol[G.patrol.length - 1];
  const lv = top ? PL[top.level] : null;
  const pile = (visual, title, sub, btn) => '<div class="pile">' + (btn ? '<button class="pilebtn" data-act="tray" title="Browse the discard piles">' + visual + '</button>' : visual) + '<b class="pt">' + title + '</b><span>' + sub + '</span></div>';
  const patDraw = pile(top ? '<div class="stack patrol ' + lv[2] + '">GUARD PATROL<b>' + lv[0] + '</b></div>' : '<div class="stack empty">empty</div>', 'Patrol deck', top ? 'next check: ' + lv[1] + '<br>' + G.patrol.length + ' left' : 'empty');
  const pd = G.patrolDiscard[G.patrolDiscard.length - 1];
  const patDisc = pile(pd ? patUp(pd, 'mini tall') : '<div class="stack empty">none</div>', 'Patrol discard', G.patrolDiscard.length + ' card' + (G.patrolDiscard.length === 1 ? '' : 's'), true);
  const fd = G.discard[G.discard.length - 1];
  const flDisc = pile(fd ? card(fd, 'pilec') : '<div class="stack empty">none</div>', 'Flashlight discard', G.discard.length + ' card' + (G.discard.length === 1 ? '' : 's'), true);
  const flDraw = pile(alarm ? '<div class="stack alarm">ALARM<br>SOUNDS</div>' : '<div class="stack flash">' + G.deck.length + '</div>', 'Flashlight deck', alarm ? 'drawing is locked' : G.deck.length + ' left');
  const lg = G.lastGuard;
  let mid = '<div class="vtxt">No guard check yet.</div>';
  if (lg) {
    const who = esc(G.players[lg.by].name);
    mid = '<div class="verdict ' + (lg.pass ? 'pass' : 'fail') + '">' + (lg.pass ? 'Pass \u2713' : 'Fail \u2717') + '</div>' +
      '<div class="vtxt sm">' + (lg.pass ? who + ' may give a hint' : who + ' stays silent') + '</div>';
  }
  return '<section class="panel"><h2>The yard</h2><div class="table">' +
    '<div class="cluster">' + patDraw + patDisc + '</div><div class="mid"><div class="lab">Guard check</div>' + mid + '</div><div class="cluster">' + flDisc + flDraw + '</div></div></section>';
}

function trayHTML() {
  const md = mode();
  if (!(ui.tray || md === 'swapA' || md === 'swapB' || md === 'patrol')) return '';
  const sw = md === 'swapA' || md === 'swapB';
  const fl = G.discard.length ? G.discard.map((c, i) => card(c, 'mini ' + (sw ? 'pick ' : '') + (sw && ui.swapA && ui.swapA.kind === 'discard' && ui.swapA.index === i ? 'sel' : ''), sw ? 'data-act="swapslot" data-k="discard" data-i="' + i + '"' : '')).join('') : '<span class="none">empty</span>';
  const pt = G.patrolDiscard.length ? G.patrolDiscard.map((s, i) => patUp(s, 'mini ' + (md === 'patrol' ? 'pick' : ''), md === 'patrol' ? 'data-act="patrol-pick" data-i="' + i + '" role="button" tabindex="0"' : '')).join('') : '<span class="none">empty</span>';
  return '<section class="panel"><h2>Discard piles <small>face-up, nobody can reshuffle them</small></h2><div class="tray"><div class="group"><b>Flashlight discard</b><div class="cards">' + fl + '</div></div>' +
    '<div class="group"><b>Patrol discard</b><div class="cards">' + pt + '</div></div></div></section>';
}

function seatHTML(p) {
  const md = mode(), O = A.active(G), test = O ? O.sec.test : null;
  const turn = !G.result && G.turn === p.idx;
  const planted = O && A.plantedBy(O, p.idx);
  const slots = p.hand.map((s, i) => {
    let inner;
    if (p.human) {
      const sw = md === 'swapA' || md === 'swapB';
      const pick = md === 'plant' || sw;
      const sel = sw && isSwapSel(p.idx, i);
      inner = back((pick ? 'pick ' : '') + (sel ? 'sel' : '') + (ui.flash && ui.flash.to === p.idx && ui.flash.hand === i ? ' flash' : ''), md === 'plant' ? 'data-act="own" data-i="' + i + '"' : sw ? 'data-act="swapslot" data-k="player" data-p="' + p.idx + '" data-i="' + i + '"' : '');
    } else {
      const sw = md === 'swapA' || md === 'swapB';
      const pick = md === 'hint' || sw;
      const m = ui.assist && test && test(s.card) ? 'match ' : '';
      const fl = ui.flash && ui.flash.to === p.idx && ui.flash.hand === i ? 'flash ' : '';
      const selH = (md === 'hint' && ui.hintSel && ui.hintSel.to === p.idx && ui.hintSel.hand === i) || (sw && isSwapSel(p.idx, i)) ? 'sel ' : '';
      inner = card(s.card, m + fl + selH + (pick ? 'pick' : ''), md === 'hint' ? 'data-act="their" data-p="' + p.idx + '" data-i="' + i + '"' : sw ? 'data-act="swapslot" data-k="player" data-p="' + p.idx + '" data-i="' + i + '"' : '');
    }
    return '<div class="slot">' + inner + known(s.known, s.not) + '</div>';
  }).join('') || '<span class="mono" style="color:var(--muted)">Out of cards</span>';
  return '<div class="seat ' + (p.human ? 'me ' : '') + (turn ? 'turn' : '') + '" style="--pc:' + AV[p.idx % 4].bg + '"><h3>' + avatar(p.idx, 38) + esc(p.name) + (p.human ? ' (you)' : '') +
    (turn ? '<span class="st on">TURN</span>' : '') + '<span class="st ' + (planted ? 'on' : '') + '">' + (planted ? 'PLANTED' : 'NEEDS CARD') + '</span></h3>' +
    '<div class="hand">' + slots + '</div></div>';
}

function controlsHTML() {
  if (G.result) return '';
  const me = G.players[0], md = mode(), cur = G.players[G.turn];
  if (!md) return '<div class="prompt wait"><span>' + esc(cur.name) + ' is thinking…</span></div>';
  const L = A.legal(G);
  const O = A.active(G);
  const TIPS = {
    plant: 'Plant one of your face-down cards on the active obstacle without looking at it, then draw a replacement. Once everyone has planted, the cards are revealed. If even one does not match, the alarm sounds.',
    guard: 'Flip a flashlight card against the top patrol card. If it does NOT match the patrol card you pass, and you must point at a teammate\u2019s card and tell them its suit or its rank. If it matches, you stay silent.',
    distract: 'Discard a planted card you think will not match the obstacle, so that player can plant again. Costs your turn.',
    riot: 'Discard five flashlight cards (needs at least five left), then swap any two cards on the table.',
    pass: 'Do nothing this turn. Only allowed once the Alarm Sounds card is showing, or when you have no other legal action.'
  };
  const b = (act, name, key, sub) => {
    const l = L[key];
    const ok = l && l.ok;
    const tip = TIPS[key] + (ok ? '' : ' \u2014 Unavailable now: ' + (l ? l.why : ''));
    return '<button class="btn tip" data-act="' + act + '" data-tip="' + esc(tip) + '" ' + (ok ? '' : 'disabled') + '>' + name + '<small>' + esc(l && !l.ok ? l.why : sub) + '</small></button>';
  };
  const cancel = '<button class="btn sm" data-act="cancel">Cancel</button>';
  switch (md) {
    case 'choose':
      return '<div class="prompt"><span>Your turn, ' + esc(me.name) + '. Choose one action.</span></div><div class="actions">' +
        b('a-plant', 'Play my part', 'plant', 'plant a blind card, then draw') + b('a-guard', 'Guard check', 'guard', 'pass to give a hint') +
        b('a-distract', 'Distract', 'distract', 'discard a planted card') + b('a-riot', 'Riot', 'riot', 'discard 5, then swap') + b('a-pass', 'Pass', 'pass', 'alarm only') + '</div>';
    case 'direction': return '<div class="prompt"><span>Choose which end the crew starts from.</span></div>';
    case 'plant': return '<div class="prompt"><span>Pick a card to plant. You cannot look at it, so go by the hints.</span>' + cancel + '</div>';
    case 'distract': return '<div class="prompt"><span>Pick a planted card at the active obstacle to discard.</span>' + cancel + '</div>';
    case 'hint': {
      if (!ui.hintSel) return '<div class="prompt"><span>You passed the guard check. Point at a teammate’s card to give a hint.</span></div>';
      const T = G.players[ui.hintSel.to], sl = T.hand[ui.hintSel.hand], c = sl.card;
      return '<div class="prompt"><span>Tell ' + esc(T.name) + ' about card ' + (ui.hintSel.hand + 1) + ':</span><div class="hintbtns">' +
        '<button class="btn" data-act="hint-dim" data-dim="suit" ' + (sl.known.suit ? 'disabled' : '') + '>Its suit: ' + symHTML(c.suit) + ' ' + A.SUIT_NAME[c.suit] + '</button>' +
        '<button class="btn" data-act="hint-dim" data-dim="rank" ' + (sl.known.rank ? 'disabled' : '') + '>Its rank: ' + A.RANK_WORD[c.rank - 1] + '</button></div></div>';
    }
    case 'patrol': return '<div class="prompt"><span>Pick a patrol card from the discard to shuffle back into the patrol deck.</span></div>';
    case 'swapA': return '<div class="prompt"><span>Riot! Swap any two cards. Pick the first: a card in any hand (yours or a teammate\u2019s) or in the discard pile.</span></div>';
    case 'swapB': return '<div class="prompt"><span>Now pick the second card to swap with it. At least one must be from a hand.</span><button class="btn sm" data-act="swapreset">Change first card</button></div>';
    case 'post': {
      const can = A.allPlanted(G);
      return '<div class="prompt"><span>' + (can ? 'Everyone has planted a card. Break through now?' : 'Action done.') + '</span><div class="hintbtns">' +
        (can ? '<button class="btn primary" data-act="breakthrough">Breakthrough</button>' : '') + '<button class="btn" data-act="end">End turn</button></div></div>';
    }
  }
  return '';
}

function logHTML() {
  return '<aside><section class="panel"><h2>Log</h2><div class="log" id="log">' + G.log.map((l) => '<div class="' + (l.p === 0 ? 'me' : l.p == null ? 'sys' : '') + '">' + esc(l.text) + '</div>').join('') + '</div></section></aside>';
}

    '<div class="rbbar"><b>How to play</b><span class="rbbtns"><a class="btn sm" href="Escape_from_Ace-catraz_Rules.pdf"" target="_blank" rel="noopener">Printable PDF</a>' +
    '<button class="btn sm primary" data-act="closehelp">' + (G ? 'Back to the game' : 'Close') + '</button></span></div>' +
    '<iframe class="rbframe" title="Escape from Ace-catraz rules" srcdoc="' + esc(window.RULEBOOK_HTML) + '"></iframe></div></div>';
}

function cardsDialogHTML() {
  const plan = ui.cardSide === 'plan';
  const PL = A.PATROL_LABEL;
  const face = (sec) => plan ? secUp(sec) :
    '<div class="pat full"><span class="pill">GUARD CHECK</span><span class="nm">NOT ' + esc(sec.name) + '</span><div class="dn">DO NOT MATCH: ' + esc(sec.text) + '</div><span class="plv ' + sec.level + '">' + PL[sec.level] + '</span></div>';
  const groups = ['easy', 'medium', 'hard'].map((lv) => '<h3 class="lvh ' + lv + '">' + LEVEL[lv] + ' locks · ' + A.SEC.filter((x) => x.level === lv).length + ' cards</h3><div class="cardgrid">' +
    A.SEC.filter((x) => x.level === lv).map((x) => '<div class="cc ' + (plan ? 'plan' : 'patrol') + '">' + face(x) + '</div>').join('') + '</div>').join('');
  return '<div class="overlay"><div class="dialog cards"><div class="box"><div class="cardshead"><h2 class="dh">All 17 security cards</h2>' +
    '<button class="btn primary" data-act="flipcards">⇄ Flip to ' + (plan ? 'guard patrol side' : 'escape plan side') + '</button></div>' +
    '<p class="sidenote">' + (plan ? '<b>Escape plan side.</b> Face up, a card is an obstacle your crew must break through. Face down, only its lock level shows.' : '<b>Guard patrol side.</b> The top card of the patrol deck. A flashlight card that does NOT match it passes the guard check. The label shows how hard that check is to pass.') + '</p>' +
    groups + '<button class="btn primary" data-act="closecards">Close</button></div></div></div>';
}
function dirDialogHTML() {
  const row = (arr, first) => '<div class="dirrow">' + arr.map((o, i) => '<div class="dt ' + o.sec.level + (i === 0 ? ' first' : '') + '">' + (i === 0 ? '<i>START</i>' : '') + '<small>LOCK</small><b>' + LEVEL[o.sec.level] + '</b></div>').join('<span class="darr">›</span>') + '</div>';
  const opt = (v, title, arr) => '<button class="dirbtn" data-act="dir" data-v="' + v + '"><span class="dirtitle">' + title + '</span>' + row(arr) + '</button>';
  return '<div class="overlay"><div class="dialog dirdlg"><div class="box"><h2 class="dh">Choose your escape direction</h2>' +
    '<p>You have checked the lock levels. Pick which end of the line the crew breaks out from first.</p>' +
    opt('ltr', '← Start from the left', G.obstacles) + opt('rtl', 'Start from the right →', G.obstacles.slice().reverse()) + '</div></div></div>';
}
function logDialogHTML() {
  return '<div class="overlay"><div class="dialog"><div class="box"><h2 class="dh">Game log</h2><div class="log" id="log">' + G.log.map((l) => '<div class="' + (l.p === 0 ? 'me' : l.p == null ? 'sys' : '') + '">' + esc(l.text) + '</div>').join('') + '</div>' +
    '<button class="btn primary" data-act="closelog">Close</button></div></div></div>';
}
function optionsDialogHTML() {
  const segS = [['Fast', 350], ['Normal', 800], ['Slow', 1500]].map((d) => '<button data-act="setspeed" data-v="' + d[1] + '" aria-pressed="' + (ui.speed === d[1]) + '">' + d[0] + '</button>').join('');
  return '<div class="overlay"><div class="dialog"><div class="box"><h2 class="dh">Options</h2>' +
    '<label class="check"><input type="checkbox" data-act="opt-summaries" ' + (ui.summaries ? 'checked' : '') + '> Show a summary after each CPU turn</label>' +
    '<label class="check ' + (ui.summaries ? 'dim' : '') + '"><input type="checkbox" data-act="opt-plant" ' + (ui.plantPopup ? 'checked' : '') + (ui.summaries ? ' disabled' : '') + '> Show the card whenever a CPU plants one' + (ui.summaries ? ' (included in the summary)' : '') + '</label>' +
    '<label class="check"><input type="checkbox" data-act="opt-not" ' + (ui.showNot ? 'checked' : '') + '> Show \u201cnot\u2026\u201d hints under cards (what a player has been ruled out as holding)</label>' +
    '<label class="check"><input type="checkbox" data-act="assist" ' + (ui.assist ? 'checked' : '') + '> Outline cards that match the active obstacle</label>' +
    '<div class="field"><b>CPU speed</b><div class="seg">' + segS + '</div></div>' +
    '<button class="btn primary" data-act="closeopt">Done</button></div></div></div>';
}
function summaryDialogHTML() {
  const m = ui.summary;
  return '<div class="overlay"><div class="dialog notice sum"><div class="box"><div class="who">' + avatar(m.idx, 56) + '<h2>' + esc(m.name) + '’s turn</h2></div>' +
    (m.card ? '<div class="xlwrap">' + card(m.card, 'xl') + '<p class="note">Planted face-down at ' + esc(m.obs.name) + '. Nobody can look at it again.</p></div>' : '') +
    '<ul class="turnlist">' + m.lines.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
    '<label class="check"><input type="checkbox" data-act="sumoff" ' + (ui.sumOff ? 'checked' : '') + '> Don’t show these summaries anymore</label>' +
    (ui.sumOff ? '<label class="check sub2"><input type="checkbox" data-act="keepplant" ' + (ui.keepPlant ? 'checked' : '') + '> Still show me the card when a CPU plants one</label>' : '') +
    '<button class="btn primary" data-act="ack">OK</button></div></div></div>';
}

function dialogHTML() {
  if (ui.help) return helpHTML();
  if (ui.cardsOpen) return cardsDialogHTML();
  if (G && ui.options) return optionsDialogHTML();
  if (G && ui.logOpen) return logDialogHTML();
  if (G && ui.summary) return summaryDialogHTML();
  if (G && !G.result && !ui.dialog && !ui.notice && G.phase === 'direction' && G.players[G.turn].human) return dirDialogHTML();
  if (ui.dialog === 'setup') {
    const segN = [2, 3, 4].map((n) => '<button data-act="setn" data-v="' + n + '" aria-pressed="' + (ui.n === n) + '">' + n + ' players</button>').join('');
    const obs = { 2: 8, 3: 5, 4: 3 }[ui.n] + (ui.extra ? 1 : 0);
    const segS = [['Fast', 350], ['Normal', 800], ['Slow', 1500]].map((d) => '<button data-act="setspeed" data-v="' + d[1] + '" aria-pressed="' + (ui.speed === d[1]) + '">' + d[0] + '</button>').join('');
    const fan = [[1, 'S'], [12, 'H'], [1, 'D'], [11, 'C'], [13, 'S']].map((c, k) => '<div class="fc" style="transform:rotate(' + (k - 2) * 9 + 'deg) translateY(' + Math.abs(k - 2) * 4 + 'px)">' + card({ rank: c[0], suit: c[1] }, '', 'tabindex="-1"') + '</div>').join('');
    return '<div class="overlay"><div class="dialog">' +
      '<div class="hero"><h2>Escape from <span class="tag">Ace-catraz!</span></h2><div class="fan">' + fan + '</div>' +
      '<div class="crew">' + [0, 1, 2, 3].map((k) => avatar(k, 44)).join('') + '</div>' +
      '<p>You are Ace. You can see every crewmate’s cards but never your own.</p><p class="demobadge">Playable demo by Andy Serwatuk · Feedback or publishing inquiries: games@serwatuk.ca</p></div>' +
      '<div class="box"><div class="field"><b>Crew size</b><div class="seg">' + segN + '</div><p class="note">' + obs + ' obstacles, ' + (ui.n - 1) + ' extra HARD card' + (ui.n > 2 ? 's' : '') + ' shuffled in</p></div>' +
      '<label class="check"><input type="checkbox" data-act="extra" ' + (ui.extra ? 'checked' : '') + '> Add one obstacle (harder, per the rules tip)</label>' +
      '<div class="field"><b>CPU speed</b><div class="seg">' + segS + '</div></div>' +
      '<button class="btn primary" data-act="start">Start the escape</button><button class="btn" data-act="help">How to play</button></div></div></div>';
  }
  if (ui.notice) {
    const n = ui.notice;
    return '<div class="overlay"><div class="dialog notice"><div class="box"><div class="who">' + avatar(n.idx || 0, 56) + '<h2>' + esc(n.name) + ' <span>planted</span> this card</h2></div>' +
      '<div class="xlwrap">' + card(n.card, 'xl') + '</div>' +
      '<p>Placed face-down at the active obstacle (' + esc(n.obs.name) + ': ' + esc(n.obs.text.toLowerCase()) + '). Once it is down, nobody can look at it again.</p>' +
      '<button class="btn primary" data-act="ack">Got it</button></div></div></div>';
  }
  if (G && G.result && !ui.endSeen) {
    const w = G.result.won;
    const done = Math.min(G.cur, G.obstacles.length);
    return '<div class="overlay"><div class="dialog ' + (w ? 'win' : 'lose') + '"><div class="box"><h2>' + (w ? 'Freedom!' : 'Back to your cells') + '</h2><p>' + esc(G.result.reason) + '</p>' +
      '<p class="note">Obstacles cleared ' + done + '/' + G.obstacles.length + ' · guard checks ' + G.stats.guards + ' (' + G.stats.guardPass + ' passed) · hints ' + G.stats.hints + ' · riots ' + G.stats.riots + ' · distractions ' + G.stats.distracts + '</p>' +
      '<div class="actions"><button class="btn primary" data-act="again">Play again</button><button class="btn" data-act="newgame">Change setup</button><button class="btn" data-act="closeend">Look at the board</button></div></div></div></div>';
  }
  return '';
}

const MAIL = 'games@serwatuk.ca';
function footHTML() {
  return '<footer class="site"><span class="demo">Demo</span><span>A playable demo of a cooperative card game by designer Andy Serwatuk. Send feedback, or get in touch about publishing opportunities: <a href="mailto:' + MAIL + '?subject=Escape%20from%20Ace-catraz">' + MAIL + '</a></span></footer>';
}

function render() {
  const scroll = document.getElementById('log');
  const atBottom = !scroll || scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 30;
  if (!G) { app.innerHTML = headerHTML() + footHTML() + dialogHTML(); return; }
  const cpus = G.players.filter((p) => !p.human), me = G.players.filter((p) => p.human);
  app.innerHTML = headerHTML() + '<div class="wrap"><div class="main">' + planHTML() + tableHTML() + trayHTML() +
    '<section class="panel actionsPanel">' + controlsHTML() + '</section>' +
    '<section class="panel"><h2>Crew <small>each tag shows what that player knows about their own card</small></h2><div class="seats crewgrid">' + G.players.map(seatHTML).join('') + '</div></section></div></div>' + footHTML() + dialogHTML();
  const lg = document.getElementById('log');
  if (lg && atBottom) lg.scrollTop = lg.scrollHeight;
  const ack = document.querySelector('[data-act=ack]');
  if (ack) ack.focus();
}

function doApply(a) {
  const O = A.active(G);
  let notice = null;
  if (a.type === 'plant') {
    const pl = G.players[G.turn];
    if (!pl.human && pl.hand[a.hand]) notice = { name: pl.name, card: pl.hand[a.hand].card, obs: O.sec, idx: pl.idx };
  }
  const actor = G.turn, actorP = G.players[actor];
  const before = a.type === 'breakthrough' && O ? O.planted.map((r) => ({ player: r.player, card: r.card })) : null;
  const r = A.apply(G, a);
  if (!r.ok) { console.warn(a, r.why); return r; }
  if (notice) { if (ui.summaries) ui.turnPlant = notice; else if (ui.plantPopup) ui.notice = notice; }
  if (G.turn !== actor || G.result) {
    if (!actorP.human && ui.summaries) {
      ui.summary = { name: actorP.name, idx: actor, lines: G.log.slice(ui.turnStart).map((l) => l.text), card: ui.turnPlant ? ui.turnPlant.card : null, obs: ui.turnPlant ? ui.turnPlant.obs : null };
    }
    ui.turnStart = G.log.length; ui.turnPlant = null;
  }
  ui.flash = a.type === 'hint' ? { to: a.to, hand: a.hand } : null;
  if (before) ui.reveal = { ok: G.lastBreak.ok, items: before };
  ui.sel = null; ui.hintSel = null; if (a.type === 'riotSwap') ui.swapA = null;

}

function schedule() {
  clearTimeout(timer);
  if (!G || G.result || ui.dialog || ui.notice || ui.help || ui.summary || ui.options || ui.logOpen || ui.cardsOpen) return;
  const p = G.players[G.turn];
  if (p.human) {
    if (G.phase === 'post' && !A.allPlanted(G)) timer = setTimeout(() => { doApply({ type: 'end' }); render(); schedule(); }, 1100);
    return;
  }
  timer = setTimeout(() => {
    const a = CPU.decide(G);
    if (!a) return;
    doApply(a); render(); schedule();
  }, ui.speed);
}
function go(a) { const r = doApply(a); render(); schedule(); return r; }

function startGame() {
  const human = [true, false, false, false];
  G = A.newGame({ n: ui.n, extra: ui.extra, human });
  ui.dialog = null; ui.notice = null; ui.summary = null; ui.turnPlant = null; ui.turnStart = G.log.length; ui.sumOff = false; ui.keepPlant = true; ui.endSeen = false; ui.sel = null; ui.swapA = null; ui.hintSel = null; ui.reveal = null; ui.flash = null; ui.tray = false;
  save(); render(); schedule();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const d = el.dataset, md = mode();
  switch (d.act) {
    case 'setn': ui.n = +d.v; render(); return;
    case 'dir': go({ type: 'direction', dir: d.v }); return;
    case 'setspeed': ui.speed = +d.v; save(); render(); return;
    case 'extra': ui.extra = el.checked; render(); return;
    case 'assist': ui.assist = el.checked; save(); render(); return;
    case 'start': case 'again': startGame(); return;
    case 'newgame': clearTimeout(timer); ui.dialog = 'setup'; render(); return;
    case 'cards': ui.cardsOpen = true; render(); return;
    case 'closecards': ui.cardsOpen = false; render(); schedule(); return;
    case 'flipcards': ui.cardSide = ui.cardSide === 'plan' ? 'patrol' : 'plan'; render(); return;
    case 'help': ui.help = true; render(); return;
    case 'closehelp': ui.help = false; render(); schedule(); return;
    case 'ack':
      if (ui.summary && ui.sumOff) { ui.summaries = false; ui.plantPopup = ui.keepPlant; save(); }
      ui.notice = null; ui.summary = null; ui.sumOff = false; ui.keepPlant = true; render(); schedule(); return;
    case 'sumoff': ui.sumOff = el.checked; render(); return;
    case 'keepplant': ui.keepPlant = el.checked; render(); return;
    case 'logopen': ui.logOpen = true; render(); return;
    case 'closelog': ui.logOpen = false; render(); schedule(); return;
    case 'options': ui.options = true; render(); return;
    case 'closeopt': ui.options = false; render(); schedule(); return;
    case 'opt-summaries': ui.summaries = el.checked; save(); render(); return;
    case 'opt-not': ui.showNot = el.checked; save(); render(); return;
    case 'opt-plant': ui.plantPopup = el.checked; save(); render(); return;
    case 'closeend': ui.endSeen = true; render(); return;
    case 'tray': ui.tray = !ui.tray; render(); return;
    case 'cancel': ui.sel = null; render(); return;
    case 'a-plant': ui.sel = 'plant'; render(); return;
    case 'a-distract': ui.sel = 'distract'; render(); return;
    case 'a-guard': go({ type: 'guard' }); return;
    case 'a-riot': go({ type: 'riot' }); return;
    case 'a-pass': go({ type: 'pass' }); return;
    case 'breakthrough': go({ type: 'breakthrough' }); return;
    case 'end': go({ type: 'end' }); return;
    case 'own': if (md === 'plant') go({ type: 'plant', hand: +d.i }); return;
    case 'swapreset': ui.swapA = null; render(); return;
    case 'swapslot': {
      if (md !== 'swapA' && md !== 'swapB') return;
      const l = d.k === 'discard' ? { kind: 'discard', index: +d.i } : { kind: 'player', player: +d.p, hand: +d.i };
      const a = ui.swapA;
      if (!a) { ui.swapA = l; render(); return; }
      const same = a.kind === l.kind && (l.kind === 'discard' ? a.index === l.index : a.player === l.player && a.hand === l.hand);
      if (same) { ui.swapA = null; render(); return; }
      if (a.kind === 'discard' && l.kind === 'discard') return;
      go({ type: 'riotSwap', a, b: l });
      return;
    }
    case 'their':
      if (md === 'hint') { ui.hintSel = { to: +d.p, hand: +d.i }; render(); }
      return;
    case 'hint-dim': if (ui.hintSel) go({ type: 'hint', to: ui.hintSel.to, hand: ui.hintSel.hand, dim: d.dim }); return;
    case 'distract-pick': if (md === 'distract') go({ type: 'distract', player: +d.p }); return;
    case 'patrol-pick': if (md === 'patrol') go({ type: 'distractPatrol', index: +d.i }); return;
  }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.pat[data-act]')) { e.preventDefault(); e.target.click(); }
});

render();
})();
